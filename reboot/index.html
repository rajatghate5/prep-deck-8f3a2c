ushes, each O(log k) because the heap never exceeds k. Better than sorting (O(n log n)) when k is much smaller than n. State this tradeoff out loud in an interview.", "id": "d2"}, {"t": "dsa", "d": 2, "q": "Why does a monotonic stack solution run in O(n) despite the inner while loop?", "o": ["The while loop rarely runs", "Each element is pushed once and popped at most once, so total work is amortized O(n)", "The stack is sorted", "It is actually O(n^2)"], "c": 1, "e": "Amortized analysis. The inner loop can run many times on one iteration, but across the whole run every element enters and leaves the stack at most once, so total operations are bounded by 2n.", "id": "d3"}, {"t": "dsa", "d": 2, "q": "What does DFS on a binary tree cost in space?", "o": ["O(1)", "O(n) always", "O(h) where h is height, so O(log n) balanced and O(n) skewed", "O(w) where w is width"], "c": 2, "e": "The recursion stack holds one frame per level. Balanced gives O(log n); a degenerate list-shaped tree gives O(n) and can stack-overflow, which is why an iterative version is sometimes required.", "id": "d4"}, {"t": "dsa", "d": 3, "q": "When is BFS strictly better than DFS?", "o": ["Always", "Shortest path on an UNWEIGHTED graph, because the first time you reach a node is via the fewest edges", "When memory is tight", "On dense graphs"], "c": 1, "e": "BFS explores in order of distance, so the first arrival is optimal. DFS gives no such guarantee. For weighted edges you need Dijkstra instead.", "id": "d5"}, {"t": "dsa", "d": 2, "q": "What signals that a problem needs DP rather than greedy?", "o": ["Large input", "A locally optimal choice can lead to a globally worse result, and subproblems repeat", "It mentions arrays", "Recursion is involved"], "c": 1, "e": "Greedy works only when the local choice is provably safe (exchange argument). Coin Change with coins [1,3,4] and target 6 breaks greedy: 4+1+1 is three coins, 3+3 is two. That counterexample is worth memorizing.", "id": "d6"}, {"t": "dsa", "d": 2, "q": "What is the complexity of sorting-based `groupAnagrams` for n words of length k?", "o": ["O(n k)", "O(n k log k)", "O(n log n)", "O(n^2)"], "c": 1, "e": "Each word costs O(k log k) to sort as a key, times n words. The counting-sort key variant gets it to O(n k), worth mentioning as the optimization.", "id": "d7"}, {"t": "dsa", "d": 3, "q": "In 'search on the answer' binary search, what must be true of the predicate?", "o": ["It must be O(1)", "It must be monotonic: false...false, true...true with a single flip point", "The array must be sorted", "It must return a number"], "c": 1, "e": "Binary search needs one boundary. If the check flips back and forth you cannot discard half the range. Proving monotonicity ('if capacity C works, C+1 works') is the key step interviewers listen for.", "id": "d8"}, {"t": "dsa", "d": 1, "q": "What is the amortized cost of pushing to a dynamic array (JS array)?", "o": ["O(1) amortized, O(n) on resize", "O(n) always", "O(log n)", "O(1) always, guaranteed"], "c": 0, "e": "Capacity doubles on overflow, so the occasional O(n) copy is spread across the n cheap pushes before it. Amortized O(1). Interviewers like this as a warm-up on amortized analysis.", "id": "d9"}, {"t": "dsa", "d": 2, "q": "Why keep indices rather than values on a monotonic stack?", "o": ["Indices are smaller", "You usually need the distance or position, and you can always look up the value", "Values cannot be stored", "It is arbitrary"], "c": 1, "e": "Problems like Daily Temperatures ask for how many days ahead, which needs `i - stack.top()`. Storing the index gives you both position and value; storing the value loses position.", "id": "d10"}, {"t": "dsa", "d": 3, "q": "Two Sum on an UNSORTED array: hashmap O(n) time / O(n) space, or sort + two pointers O(n log n) / O(1)?", "o": ["Always hashmap", "Depends on the constraint: hashmap if time matters, sort+pointers if space is constrained or output is indices-agnostic", "Always sort", "They are identical"], "c": 1, "e": "The right answer in an interview is to name both and ask which resource is constrained. Note sorting destroys original indices, so if the problem wants indices you must track them or use the hashmap.", "id": "d11"}], PLAN=[{"n": 1, "date": "2026-09-14", "dow": "Mon", "label": "14 Sep", "tech": "js", "techLabel": "JavaScript core", "dsa": "two-pointers", "problems": [["two-pointers", 167, "Two Sum II (sorted)", 1, "The canonical template. Do this one first."], ["two-pointers", 125, "Valid Palindrome", 1, "Pointer walk plus character filtering."]], "review": false}, {"n": 2, "date": "2026-09-15", "dow": "Tue", "label": "15 Sep", "tech": "js", "techLabel": "JavaScript core", "dsa": "two-pointers", "problems": [["two-pointers", 283, "Move Zeroes", 1, "In-place partition with a write pointer."], ["two-pointers", 11, "Container With Most Water", 2, "Always move the shorter wall; argue why that is safe."]], "review": false}, {"n": 3, "date": "2026-09-16", "dow": "Wed", "label": "16 Sep", "tech": "js", "techLabel": "JavaScript core", "dsa": "two-pointers", "problems": [["two-pointers", 15, "3Sum", 2, "Sort, fix one, two-pointer the rest. Duplicate skipping is the hard part."], ["two-pointers", 42, "Trapping Rain Water", 3, "Two pointers with running max from each side."]], "review": false}, {"n": 4, "date": "2026-09-17", "dow": "Thu", "label": "17 Sep", "tech": "js", "techLabel": "JavaScript core", "dsa": "two-pointers", "problems": [], "review": false}, {"n": 5, "date": "2026-09-18", "dow": "Fri", "label": "18 Sep", "tech": "js", "techLabel": "JavaScript core", "dsa": "hashmap", "problems": [["hashmap", 1, "Two Sum", 1, "Complement lookup. The interview warm-up."], ["hashmap", 242, "Valid Anagram", 1, "Frequency map or sorted key."]], "review": false}, {"n": 6, "date": "2026-09-19", "dow": "Sat", "label": "19 Sep", "tech": "ts", "techLabel": "TypeScript", "dsa": "hashmap", "problems": [["hashmap", 49, "Group Anagrams", 2, "Canonical key design is the whole prob /* ---------- quiz engine ---------- */
function quiz(mountId,pool,filterState){
  const mount=document.getElementById(mountId);
  function draw(){
    mount.innerHTML="";
    let list=pool;
    if(filterState.topic!=="all")list=list.filter(q=>q.t===filterState.topic);
    if(filterState.mode==="unseen")list=list.filter(q=>S.ans[q.id]===undefined);
    if(filterState.mode==="wrong")list=list.filter(q=>S.ans[q.id]!==undefined&&S.ans[q.id]!==q.c);
    if(!list.length){
      mount.appendChild(mk("div","empty",filterState.mode==="wrong"
        ?"No wrong answers here yet. Switch to <b>All</b> to keep drilling."
        :"Nothing left in this filter. Try <b>All</b> or another topic."));
      return;
    }
    let i=0;
    const card=mk("div","q");mount.appendChild(card);
    function paint(){
      const q=list[i];card.innerHTML="";
      const top=mk("div","qtop");
      top.appendChild(mk("span","tag",esc((TOPICS.find(t=>t[0]===q.t)||[,q.t])[1])));
      top.appendChild(mk("span","dots","●".repeat(q.d)+"○".repeat(3-q.d)));
      card.appendChild(top);
      card.appendChild(mk("div","qtext",q.q));
      const opts=mk("div","opts");
      const chosen=S.ans[q.id];
      q.o.forEach((o,idx)=>{
        const b=mk("button","opt");
        b.innerHTML="<kbd>"+"ABCD"[idx]+"</kbd><span>"+o+"</span>";
        if(chosen!==undefined){
          b.disabled=true;
          if(idx===q.c)b.classList.add("correct");
          else if(idx===chosen)b.classList.add("wrong");
        }else{
          b.onclick=()=>{S.ans[q.id]=idx;save();paint();};
        }
        opts.appendChild(b);
      });
      card.appendChild(opts);
      if(chosen!==undefined){
        const good=chosen===q.c;
        card.appendChild(mk("div","exp","<b>"+(good?"Correct.":"Not quite.")+"</b> "+q.e));
      }
      const nav=mk("div","qnav");
      const prev=mk("button","btn ghost","Back");prev.disabled=i===0;
      prev.onclick=()=>{i--;paint();};
      const next=mk("button","btn",i===list.length-1?"Done":"Next");
      next.onclick=()=>{if(i<list.length-1){i++;paint();}else draw();};
      nav.appendChild(prev);nav.appendChild(next);
      nav.appendChild(mk("span","muted","&nbsp;"+(i+1)+" / "+list.length));
      card.appendChild(nav);
    }
    paint();
  }
  return draw;
}

(function buildFilters(){
  const box=document.getElementById("tfilters");
  const add=(label,on,fn)=>{
    const b=mk("button","pill",label);b.setAttribute("aria-pressed",on);
    b.onclick=()=>{fn();sync();};box.appendChild(b);return b;
  };
  const modes=[["All","all"],["Unseen","unseen"],["Wrong","wrong"]];
  modes.forEach(([l,v])=>add(l,tState.mode===v,()=>tState.mode=v));
  add("— ",false,()=>{}).style.visibility="hidden";
  add("Every topic",tState.topic==="all",()=>tState.topic="all");
  TOPICS.forEach(([k,l])=>{
    if(TECH.some(q=>q.t===k))add(l,false,()=>tState.topic=k);
  });
  function sync(){
    const btns=[...box.children];
    btns.forEach(b=>{
      const l=b.textContent.trim();
      const m=modes.find(x=>x[0]===l);
      if(m)b.setAttribute("aria-pressed",tState.mode===m[1]);
      else if(l==="Every topic")b.setAttribute("aria-pressed",tState.topic==="all");
      else{const t=TOPICS.find(x=>x[1]===l);if(t)b.setAttribute("aria-pressed",tState.topic===t[0]);}
    });
    drawTech();
  }
})();

/* ---------- progress ---------- */
function renderProgress(){
  const all=TECH.concat(DQ);
  const answered=all.filter(q=>S.ans[q.id]!==undefined);
  const right=answered.filter(q=>S.ans[q.id]===q.c);
  const acc=answered.length?Math.round(right.length/answered.length*100):0;
  const os=document.getElementById("ostats");os.innerHTML="";
  [[answered.length+" / "+all.length,"Answered"],[acc+"%","Accuracy"],
   [Object.keys(S.probs).length+" / "+PROBS.length,"Problems"]].forEach(([v,l])=>{
    os.appendChild(mk("div","stat","<b>"+v+"</b><span>"+l+"</span>"));
  });

  const bt=document.getElementById("bytopic");bt.innerHTML="";
  TOPICS.concat([["dsa","DSA drills"]]).forEach(([k,l])=>{
    const qs=all.filter(q=>q.t===k);if(!qs.length)return;
    const a=qs.filter(q=>S.ans[q.id]!==undefined);
    const r=a.filter(q=>S.ans[q.id]===q.c);
    const pc=a.length?Math.round(r.length/a.length*100):null;
    const row=mk("div","trow");
    row.appendChild(mk("span",null,esc(l)));
    row.appendChild(mk("span","n",a.length+"/"+qs.length));
    const p=mk("span","pct",pc===null?"—":pc+"%");
    if(pc!==null)p.style.color=pc>=80?"var(--ok)":pc>=55?"var(--accent)":"var(--bad)";
    row.appendChild(p);
    bt.appendChild(row);
  });

  const wb=document.getElementById("wrongbox");wb.innerHTML="";
  const wrong=all.filter(q=>S.ans[q.id]!==undefined&&S.ans[q.id]!==q.c);
  if(!wrong.length){wb.appendChild(mk("p","lead","Nothing wrong yet. Once you miss a question it lands here so you can find it fast."));}
  else{
    wb.appendChild(mk("p","lead","<b>"+wrong.length+"</b> to revisit. Use the <b>Wrong</b> filter on the Tech tab to drill these."));
    wrong.slice(0,40).forEach(q=>{
      const row=mk("div","trow");row.style.gridTemplateColumns="1fr auto";
      row.appendChild(mk("span",null,q.q));
      row.appendChild(mk("span","tag",esc((TOPICS.find(t=>t[0]===q.t)||[,q.t])[1])));
      wb.appendChild(row);
    });
  }
}
document.getElementById("reset").onclick=()=>{
  S={ans:{},days:{},probs:{},theme:S.theme};save();
  renderDays();planBar();renderPats();probBar();drawTech();drawDsa();renderProgress();
};

renderDays();planBar();renderPats();probBar();
const t=document.querySelector(".day.today");
if(t)setTimeout(()=>t.scrollIntoView({block:"center",behavior:"instant"}),60);
</script>
