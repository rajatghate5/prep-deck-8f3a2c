<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interview Reboot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#EDF0F4; --border:#DCE2EA;
  --ink:#131A24; --ink-2:#4A5666; --ink-3:#7C8899;
  --accent:#9A5A0C; --accent-2:#B8720F; --accent-soft:#FBF1E1;
  --ok:#166534; --ok-soft:#E6F4EA; --ok-line:#A7D9B5;
  --bad:#A81F28; --bad-soft:#FBEBEB; --bad-line:#EBB6B6;
  --shadow:0 1px 2px rgba(19,26,36,.06),0 4px 12px rgba(19,26,36,.04);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E141D; --surface:#151D29; --surface-2:#1C2634; --border:#2B3748;
    --ink:#E9EEF5; --ink-2:#A5B2C4; --ink-3:#6F7E93;
    --accent:#E8A33D; --accent-2:#F3B75C; --accent-soft:#2A2013;
    --ok:#5FD98B; --ok-soft:#12271A; --ok-line:#2C5C3D;
    --bad:#F58585; --bad-soft:#2B1618; --bad-line:#5E2B2E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);
  }
}
:root[data-theme="dark"]{
  --bg:#0E141D; --surface:#151D29; --surface-2:#1C2634; --border:#2B3748;
  --ink:#E9EEF5; --ink-2:#A5B2C4; --ink-3:#6F7E93;
  --accent:#E8A33D; --accent-2:#F3B75C; --accent-soft:#2A2013;
  --ok:#5FD98B; --ok-soft:#12271A; --ok-line:#2C5C3D;
  --bad:#F58585; --bad-soft:#2B1618; --bad-line:#5E2B2E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Source Sans 3",ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.55; -webkit-text-size-adjust:100%;
}
h1,h2,h3,.dnum,.tabs button,.pill{font-family:Archivo,ui-sans-serif,system-ui,sans-serif}
h1,h2,h3{text-wrap:balance;margin:0}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace}
code{font-size:.86em;background:var(--surface-2);padding:.1em .34em;border-radius:4px;
  border:1px solid var(--border);word-break:break-word}
pre{margin:0;overflow-x:auto;padding:14px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:var(--r);font-size:12.5px;line-height:1.6}
pre code{background:none;border:none;padding:0;font-size:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 96px}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--border)}
.hrow{max-width:760px;margin:0 auto;padding:12px 14px 0;
  display:flex;align-items:center;gap:12px}
h1{font-size:17px;font-weight:700;letter-spacing:-.01em;flex:1}
h1 span{color:var(--accent);font-weight:600}
.iconbtn{background:var(--surface);border:1px solid var(--border);color:var(--ink-2);
  width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:15px;
  display:grid;place-items:center;flex:none}
.iconbtn:hover{color:var(--ink);border-color:var(--ink-3)}
.tabs{max-width:760px;margin:0 auto;padding:10px 14px 0;display:flex;gap:2px;
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:none;border-bottom:2px solid transparent;
  color:var(--ink-3);font-size:13.5px;font-weight:600;padding:7px 12px 9px;cursor:pointer;
  white-space:nowrap;letter-spacing:.01em}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink-2)}

/* countdown strip */
.countdown{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
  padding:14px 0 4px;color:var(--ink-3);font-size:13px}
.countdown b{font-family:Archivo;font-size:26px;color:var(--accent);font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1}

/* generic card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--ink-3);font-size:13px}
.lead{color:var(--ink-2);font-size:14px}

/* progress bar */
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;
  border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

/* stat grid */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:11px 12px}
.stat b{display:block;font-family:Archivo;font-size:20px;font-weight:700;
  font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}

/* day card */
.day{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:13px 14px;box-shadow:var(--shadow)}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
.day.done{opacity:.55}
.day.past:not(.done){border-left:3px solid var(--bad-line)}
.dnum{font-size:12px;font-weight:700;color:var(--ink-3);font-variant-numeric:tabular-nums;
  text-align:center;min-width:34px;padding-top:1px}
.dnum em{display:block;font-style:normal;font-size:10px;font-weight:500;color:var(--ink-3)}
.day.today .dnum{color:var(--accent)}
.dbody h3{font-size:14.5px;font-weight:600;margin-bottom:2px}
.dmeta{font-size:12.5px;color:var(--ink-3)}
.dprob{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.dprob a{font-size:12.5px;color:var(--ink-2);text-decoration:none;
  border-bottom:1px solid var(--border);width:fit-content}
.dprob a:hover{color:var(--accent);border-color:var(--accent)}
.chk{appearance:none;width:21px;height:21px;border:1.5px solid var(--border);border-radius:6px;
  background:var(--surface);cursor:pointer;flex:none;position:relative}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";position:absolute;left:6.5px;top:2.5px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.chk:focus-visible,button:focus-visible,select:focus-visible,a:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px}

/* pills / filters */
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{flex:none;background:var(--surface);border:1px solid var(--border);color:var(--ink-2);
  font-size:12.5px;font-weight:600;padding:6px 11px;border-radius:99px;cursor:pointer;
  white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .pill[aria-pressed="true"],
:root:not([data-theme="light"]) .pill[aria-pressed="true"]{color:#1A1206}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .pill[aria-pressed="true"]{color:#fff}}

/* MCQ */
.q{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;box-shadow:var(--shadow)}
.qtop{display:flex;gap:8px;align-items:center;margin-bottom:9px}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:5px;
  font-family:Archivo}
.dots{margin-left:auto;color:var(--ink-3);font-size:11px;letter-spacing:.1em}
.qtext{font-size:15.5px;font-weight:600;line-height:1.45;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  padding:11px 12px;cursor:pointer;font:inherit;font-size:14.5px;color:var(--ink);
  line-height:1.45}
.opt:hover:not(:disabled){border-color:var(--ink-3)}
.opt:disabled{cursor:default}
.opt kbd{font-family:Archivo;font-size:11px;font-weight:700;background:var(--surface-2);
  border:1px solid var(--border);border-radius:4px;padding:1px 6px;flex:none;margin-top:2px;
  color:var(--ink-3)}
.opt.correct{background:var(--ok-soft);border-color:var(--ok-line)}
.opt.correct kbd{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad-line)}
.opt.wrong kbd{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.exp{margin-top:12px;padding:12px 13px;background:var(--surface-2);
  border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:14px;
  color:var(--ink-2);line-height:1.55}
.exp b{color:var(--ink);font-weight:600}
.qnav{display:flex;gap:8px;align-items:center;margin-top:14px}
.btn{background:var(--accent);border:1px solid var(--accent);color:#fff;
  font:inherit;font-weight:600;font-size:14px;padding:9px 16px;border-radius:8px;cursor:pointer}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#1A1206}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--border)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* DSA pattern */
details.pat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden}
details.pat>summary{padding:14px 16px;cursor:pointer;list-style:none;
  display:flex;gap:10px;align-items:baseline}
details.pat>summary::-webkit-details-marker{display:none}
summary h3{font-size:15px;font-weight:600;flex:1}
.cx{font-family:"JetBrains Mono";font-size:11px;color:var(--accent);
  background:var(--accent-soft);padding:2px 7px;border-radius:5px;white-space:nowrap}
.patbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:11px}
.kv{font-size:14px;color:var(--ink-2)}
.kv b{color:var(--ink);font-weight:600}
.plist{display:flex;flex-direction:column;gap:1px;margin-top:2px}
.prow{display:flex;gap:10px;align-items:flex-start;padding:8px 2px;
  border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.prow .pi{flex:1;min-width:0}
.prow a{color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}
.prow a:hover{color:var(--accent)}
.prow .why{font-size:12.5px;color:var(--ink-3);line-height:1.45}
.lvl{font-family:Archivo;font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;
  flex:none;margin-top:2px;letter-spacing:.04em}
.lvl.e{background:var(--ok-soft);color:var(--ok)}
.lvl.m{background:var(--accent-soft);color:var(--accent)}
.lvl.h{background:var(--bad-soft);color:var(--bad)}

/* progress table */
.trow{display:grid;grid-template-columns:1fr 52px 46px;gap:10px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.trow:last-child{border-bottom:none}
.trow .n{font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:13px;text-align:right}
.trow .pct{font-family:Archivo;font-weight:700;font-variant-numeric:tabular-nums;
  text-align:right;font-size:14px}
h2{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);margin:22px 0 10px}
.empty{text-align:center;padding:44px 20px;color:var(--ink-3);font-size:14px}
.sec{display:none}
.sec.on{display:block}
@media(min-width:640px){
  .wrap{padding:0 20px 96px}
  .hrow,.tabs{padding-left:20px;padding-right:20px}
  h1{font-size:19px}
  .qtext{font-size:16.5px}
}
</style>

<header>
  <div class="hrow">
    <h1>Interview Reboot <span id="dleft"></span></h1>
    <button class="iconbtn" id="theme" aria-label="Toggle theme">◐</button>
  </div>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-sec="plan">Plan</button>
    <button role="tab" aria-selected="false" data-sec="tech">Tech MCQs</button>
    <button role="tab" aria-selected="false" data-sec="dsa">DSA</button>
    <button role="tab" aria-selected="false" data-sec="prog">Progress</button>
  </nav>
</header>

<div class="wrap">

  <section class="sec on" id="sec-plan">
    <div class="countdown"><b id="cd">—</b><span id="cdtext"></span></div>
    <div class="card" style="margin-bottom:6px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px">
        <span class="lead"><b id="daydone">0</b> of 54 days done</span>
        <span class="muted" id="daypct">0%</span>
      </div>
      <div class="bar"><i id="daybar" style="width:0%"></i></div>
      <p class="muted" style="margin:10px 0 0">30 min tech + 30 min DSA each day. Tick a day when both halves are done.</p>
    </div>
    <h2>Schedule</h2>
    <div class="stack" id="days"></div>
  </section>

  <section class="sec" id="sec-tech">
    <div class="filters" id="tfilters"></div>
    <div id="tquiz"></div>
  </section>

  <section class="sec" id="sec-dsa">
    <div class="card" style="margin:14px 0 6px">
      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px">
        <span class="lead"><b id="pdone">0</b> of <span id="ptotal">0</span> problems solved</span>
        <span class="muted" id="ppct">0%</span>
      </div>
      <div class="bar"><i id="pbar" style="width:0%"></i></div>
    </div>
    <h2>Patterns</h2>
    <div class="stack" id="pats"></div>
    <h2>Complexity drills</h2>
    <div id="dquiz"></div>
  </section>

  <section class="sec" id="sec-prog">
    <h2 style="margin-top:14px">Overall</h2>
    <div class="stats" id="ostats"></div>
    <h2>Accuracy by topic</h2>
    <div class="card" id="bytopic"></div>
    <h2>Wrong answers</h2>
    <div class="card" id="wrongbox"></div>
    <h2>Reset</h2>
    <div class="card">
      <p class="lead" style="margin:0 0 11px">Clears every answer, tick and solved problem on this device.</p>
      <button class="btn ghost" id="reset">Clear all progress</button>
    </div>
  </section>
</div>

<script>
const TECH=[{"t": "js", "d": 1, "q": "What does `Array.prototype.flat()` do with no argument?", "o": ["Flattens one level deep", "Flattens completely, all levels", "Removes empty slots only", "Returns a shallow copy"], "c": 0, "e": "Default depth is 1. Use `flat(Infinity)` to fully flatten. It also drops empty slots in sparse arrays as a side effect.", "id": "t0"}, {"t": "js", "d": 1, "q": "`typeof null` returns what, and why?", "o": ["`'null'`, it is its own type", "`'object'`, a bug kept for backwards compatibility", "`'undefined'`, null is unset", "`'boolean'`, null is falsy"], "c": 1, "e": "A legacy bug from the first JS implementation: values were tagged by type bits and null was the all-zero pointer, which matched the object tag. Never fixed because it would break the web.", "id": "t1"}, {"t": "js", "d": 2, "q": "What is the difference between `==` and `Object.is()` for `NaN`?", "o": ["Both say NaN equals NaN", "`==` says true, `Object.is` says false", "`==` says false, `Object.is` says true", "Both throw on NaN"], "c": 2, "e": "`NaN == NaN` is false (IEEE-754 rule). `Object.is(NaN, NaN)` is true. `Object.is` also distinguishes `+0` from `-0`, which `===` does not.", "id": "t2"}, {"t": "js", "d": 2, "q": "What does the optional chaining operator `a?.b` return when `a` is `null`?", "o": ["Throws TypeError", "`undefined`", "`null`", "An empty object"], "c": 1, "e": "Short-circuits to `undefined` for both `null` and `undefined`. Note it returns `undefined` even when `a` is `null`, which matters when you then check `=== null`.", "id": "t3"}, {"t": "js", "d": 2, "q": "In `const {a = 1} = obj`, when does the default `1` apply?", "o": ["When `obj.a` is falsy", "Only when `obj.a` is `undefined`", "When `obj.a` is `undefined` or `null`", "When `a` is not an own property"], "c": 1, "e": "Destructuring defaults trigger on `undefined` only. `{a: null}` gives you `null`, not `1`. This is a common source of bugs with API responses that send explicit nulls.", "id": "t4"}, {"t": "js", "d": 2, "q": "What is the output order? `console.log(1); setTimeout(()=>console.log(2),0); Promise.resolve().then(()=>console.log(3)); console.log(4);`", "o": ["1 2 3 4", "1 4 3 2", "1 4 2 3", "1 3 4 2"], "c": 1, "e": "Sync first (1, 4), then the microtask queue drains (3), then macrotasks (2). Promises are microtasks and always beat setTimeout, even at 0ms.", "id": "t5"}, {"t": "js", "d": 3, "q": "What does `await` do inside a `for...of` loop over an array of promises?", "o": ["Runs them all in parallel", "Runs them sequentially, one after another", "Throws, await is not allowed in loops", "Runs in parallel but resolves in order"], "c": 1, "e": "Each iteration waits. For parallelism use `await Promise.all(arr)`. This is the single most common accidental performance bug in Node services.", "id": "t6"}, {"t": "js", "d": 2, "q": "What is the difference between `Promise.all` and `Promise.allSettled`?", "o": ["`all` rejects on first failure; `allSettled` always resolves with per-promise status", "`allSettled` is faster", "`all` runs sequentially", "No difference, allSettled is an alias"], "c": 0, "e": "`all` short-circuits on the first rejection and you lose the other results. `allSettled` waits for every promise and gives you `{status, value|reason}` for each, which is what you want for independent operations.", "id": "t7"}, {"t": "js", "d": 3, "q": "Why does `this` behave differently in an arrow function?", "o": ["Arrows bind `this` to `globalThis`", "Arrows have no own `this`; it resolves lexically from the enclosing scope", "Arrows bind `this` to the caller", "Arrows always bind `this` to `undefined`"], "c": 1, "e": "Arrow functions never create their own `this` binding, so it resolves up the scope chain like any other variable. That is why `.bind()`, `.call()` and `.apply()` cannot change it.", "id": "t8"}, {"t": "js", "d": 2, "q": "What does a WeakMap give you that a Map does not?", "o": ["Faster lookups", "Keys held weakly, so entries can be garbage collected", "Ordered iteration", "String keys only"], "c": 1, "e": "WeakMap keys must be objects and are held weakly, so an entry disappears when the key is otherwise unreachable. Useful for attaching metadata without leaking. It is not iterable, precisely because entries can vanish.", "id": "t9"}, {"t": "js", "d": 2, "q": "What is the practical difference between `null` and `undefined` in an API contract?", "o": ["They are interchangeable", "`undefined` means the key was never set; `null` means explicitly set to no value", "`null` is only for numbers", "`undefined` cannot be serialized to JSON, `null` can"], "c": 1, "e": "Both are true of the semantic split, but the JSON point matters most in practice: `JSON.stringify({a: undefined})` drops the key entirely, while `null` survives. That is why APIs use null for 'explicitly empty'.", "id": "t10"}, {"t": "js", "d": 3, "q": "What does `structuredClone()` handle that `JSON.parse(JSON.stringify())` does not?", "o": ["Nothing, they are equivalent", "Dates, Maps, Sets, circular references", "Only circular references", "Only functions"], "c": 1, "e": "The JSON round-trip loses Dates (becomes string), Maps/Sets (becomes {}), undefined, and throws on cycles. `structuredClone` preserves all of those. It still cannot clone functions or DOM nodes.", "id": "t11"}, {"t": "ts", "d": 1, "q": "What is the difference between `interface` and `type` in TypeScript?", "o": ["Interfaces support declaration merging; types support unions and mapped types", "Types are faster to compile", "Interfaces cannot extend", "No difference at all"], "c": 0, "e": "Interfaces can be reopened and merged (useful for augmenting third-party types). Types can express unions, intersections, conditionals and mapped types that interfaces cannot. Prefer interface for object shapes you may extend, type for everything else.", "id": "t12"}, {"t": "ts", "d": 2, "q": "What does the `satisfies` operator do?", "o": ["Casts a value, suppressing errors", "Checks a value against a type without widening its inferred type", "Asserts non-null", "Marks a type as exhaustive"], "c": 1, "e": "`as` throws away the literal inference; `satisfies` validates against the constraint while keeping the narrow inferred type. Essential for config objects where you want both checking and precise key autocomplete.", "id": "t13"}, {"t": "ts", "d": 2, "q": "What is the difference between `unknown` and `any`?", "o": ["None, unknown is an alias", "`unknown` must be narrowed before use; `any` disables checking", "`any` is safer", "`unknown` only works on primitives"], "c": 1, "e": "`unknown` is the type-safe top type: you can assign anything to it, but must narrow before using it. `any` opts out of checking entirely and silently infects everything it touches. Prefer `unknown` at API boundaries.", "id": "t14"}, {"t": "ts", "d": 3, "q": "What does `Partial<Pick<User, 'name' | 'email'>>` produce?", "o": ["A type with all User fields optional", "An object with optional `name` and `email` only", "A union of name and email", "A readonly User"], "c": 1, "e": "`Pick` narrows to those two keys, `Partial` then makes each optional. Composing utility types like this is the standard way to type PATCH request bodies.", "id": "t15"}, {"t": "ts", "d": 3, "q": "Why does a discriminated union beat optional fields for modelling API states?", "o": ["It compiles faster", "It makes impossible states unrepresentable and enables exhaustive narrowing", "It produces smaller bundles", "It supports more fields"], "c": 1, "e": "`{status:'loading'} | {status:'error', error:E} | {status:'ok', data:D}` means you cannot have data and an error at once, and a `switch` on `status` narrows each branch. Optional fields let you express nonsense like loading-with-data.", "id": "t16"}, {"t": "ts", "d": 2, "q": "What does `as const` do to `const config = {mode: 'dark'} as const`?", "o": ["Freezes the object at runtime", "Narrows `mode` to the literal type `'dark'` and marks properties readonly", "Converts it to a class", "Makes it globally available"], "c": 1, "e": "It is compile-time only: no runtime freeze. Without it, `mode` widens to `string` and you lose literal-type checking. Pair with `satisfies` when you also want validation.", "id": "t17"}, {"t": "ts", "d": 3, "q": "What is a type guard function signature?", "o": ["`function isX(v: unknown): boolean`", "`function isX(v: unknown): v is X`", "`function isX<T>(v: T): T`", "`function isX(v: any): asserts X`"], "c": 1, "e": "The `v is X` return annotation tells the compiler to narrow the argument in the calling scope when the function returns true. A plain `boolean` return does not narrow anything.", "id": "t18"}, {"t": "react", "d": 1, "q": "Why does React need a stable `key` on list items?", "o": ["For CSS targeting", "To match elements between renders so state and DOM nodes are preserved correctly", "To sort the list", "Keys are optional and have no effect"], "c": 1, "e": "Keys identify which element is which across renders. Using array index as key breaks when items are inserted or reordered: React reuses the wrong DOM node and component state bleeds across rows.", "id": "t19"}, {"t": "react", "d": 2, "q": "What is the difference between `useMemo` and `useCallback`?", "o": ["`useMemo` caches a value, `useCallback` caches a function reference", "`useCallback` is for async only", "`useMemo` runs after paint", "They are identical"], "c": 0, "e": "`useCallback(fn, deps)` is exactly `useMemo(() => fn, deps)`. Both only matter when the consumer is memoized or the value feeds a dependency array; otherwise you are paying for caching you do not use.", "id": "t20"}, {"t": "react", "d": 2, "q": "When does `React.memo` fail to prevent a re-render?", "o": ["Never, it always prevents them", "When a prop is a new object or function reference each render", "When the component has no props", "Only in development mode"], "c": 1, "e": "`React.memo` does a shallow compare. An inline `{...}` or `() => {}` prop is a fresh reference every parent render, so the compare always fails. This is why memo and useCallback are usually needed together, or not at all.", "id": "t21"}, {"t": "react", "d": 2, "q": "What runs first: `useEffect` or `useLayoutEffect`?", "o": ["`useEffect`, before paint", "`useLayoutEffect`, synchronously after DOM mutation but before paint", "They run simultaneously", "Depends on the dependency array"], "c": 1, "e": "`useLayoutEffect` fires synchronously after DOM mutations and blocks paint, so it is the right place to read layout and mutate before the user sees anything. `useEffect` runs after paint and is the default choice.", "id": "t22"}, {"t": "react", "d": 3, "q": "Why might a `useEffect` with `[]` deps still run twice in development?", "o": ["A React bug", "StrictMode intentionally double-invokes to surface missing cleanup", "The dependency array is wrong", "Hot reload"], "c": 1, "e": "React 18 StrictMode mounts, unmounts and remounts components in dev to expose effects that are not idempotent or lack cleanup. It does not happen in production, and the fix is a correct cleanup function, not disabling StrictMode.", "id": "t23"}, {"t": "react", "d": 3, "q": "What problem does `useRef` solve that `useState` does not?", "o": ["It triggers re-renders more efficiently", "It holds a mutable value across renders without causing a re-render", "It persists to localStorage", "It is typed more strictly"], "c": 1, "e": "Writing `ref.current` does not schedule a render. Use it for timer IDs, previous values, DOM handles, and anything the UI does not read during render. Reading a ref during render is not safe under concurrent features.", "id": "t24"}, {"t": "react", "d": 3, "q": "What is the stale closure problem in hooks?", "o": ["A callback captures values from the render it was created in, which may now be outdated", "Refs leak memory", "Context re-renders too often", "Effects run out of order"], "c": 0, "e": "A `setInterval` created once captures the first render's state forever. Fixes: include the value in deps, use the functional updater `setX(prev => ...)`, or keep the live value in a ref.", "id": "t25"}, {"t": "react", "d": 2, "q": "Controlled vs uncontrolled inputs: what is the performance implication on a 40-field form?", "o": ["No difference", "Controlled re-renders on every keystroke; uncontrolled keeps the value in the DOM", "Uncontrolled re-renders more", "Controlled is always faster"], "c": 1, "e": "Controlled means React state holds the value, so every keystroke re-renders the form tree. Libraries like React Hook Form register inputs as uncontrolled refs, so typing causes zero renders until submit or validation.", "id": "t26"}, {"t": "react", "d": 3, "q": "Why does putting a value in Context still cause wide re-renders?", "o": ["Context is always slow", "Every consumer re-renders when the context value identity changes", "Context bypasses memo", "Context re-renders the whole app"], "c": 1, "e": "Consumers subscribe to the value's identity. An inline `value={{user, setUser}}` is a new object each render, so all consumers re-render. Memoize the value, or split into separate contexts for stable and volatile parts.", "id": "t27"}, {"t": "react", "d": 3, "q": "What does `useTransition` give you?", "o": ["Animation helpers", "Marks a state update as non-urgent so it can be interrupted, keeping input responsive", "Lazy loading", "Server-side rendering"], "c": 1, "e": "`startTransition(() => setQuery(v))` lets React keep the typed input responsive while an expensive filtered list re-renders in the background. `isPending` lets you show a subtle loading state without blocking.", "id": "t28"}, {"t": "react", "d": 2, "q": "What is the correct way to update state derived from previous state?", "o": ["`setCount(count + 1)`", "`setCount(prev => prev + 1)`", "`count++` then `setCount(count)`", "Either is always equivalent"], "c": 1, "e": "The functional updater reads the latest queued state, so batched or rapid updates do not clobber each other. `setCount(count + 1)` twice in one handler increments by 1, not 2.", "id": "t29"}, {"t": "react", "d": 3, "q": "What does a React error boundary NOT catch?", "o": ["Render errors in children", "Errors in event handlers, async code, and the boundary itself", "Lifecycle errors", "Constructor errors"], "c": 1, "e": "Boundaries catch errors during render, lifecycle and constructors of the tree below. Event handler and async errors need try/catch, because they are outside React's render phase.", "id": "t30"}, {"t": "react", "d": 2, "q": "Why is `dangerouslySetInnerHTML` named that way?", "o": ["It is slow", "It bypasses React's escaping, so unsanitized input becomes an XSS vector", "It breaks hydration", "It only works in dev"], "c": 1, "e": "React escapes interpolated strings by default, which kills most XSS. This prop opts out. If you must use it (rendering CMS HTML), sanitize server-side with something like DOMPurify first.", "id": "t31"}, {"t": "react", "d": 3, "q": "What causes a hydration mismatch in SSR React?", "o": ["Slow network", "Server-rendered HTML differing from the first client render", "Missing keys", "Too many components"], "c": 1, "e": "Common causes: `Date.now()`, `Math.random()`, `window` checks, locale formatting, or user-specific data rendered from a cached server response. React logs a mismatch and re-renders client-side, losing the SSR benefit.", "id": "t32"}, {"t": "next", "d": 1, "q": "In the App Router, what is a component by default?", "o": ["A Client Component", "A Server Component", "Static HTML", "An API route"], "c": 1, "e": "App Router components are Server Components unless the file starts with `'use client'`. Server Components can be async, can query the database directly, and ship zero JS to the browser.", "id": "t33"}, {"t": "next", "d": 2, "q": "What does `'use client'` actually mark?", "o": ["That the file runs only in the browser", "The boundary where the client bundle starts; the component and its imports ship to the browser", "That it uses hooks", "That it disables SSR"], "c": 1, "e": "It marks an entry point, not an exclusion. Client Components still server-render for the initial HTML, then hydrate. Everything imported below that boundary joins the client bundle, which is why you push it as deep as possible.", "id": "t34"}, {"t": "next", "d": 2, "q": "How do you pass a Server Component as a child of a Client Component without pulling it into the client bundle?", "o": ["Impossible", "Pass it as a `children` or prop slot from a Server Component parent", "Use dynamic import", "Use a context provider"], "c": 1, "e": "The composition pattern: a Server parent renders `<ClientShell><ServerContent/></ClientShell>`. The Server output is already-rendered payload, so it never enters the client bundle. This is how you keep providers thin.", "id": "t35"}, {"t": "next", "d": 3, "q": "What does `export const dynamic = 'force-dynamic'` do to a route?", "o": ["Enables client-side routing", "Opts out of static generation and caching, rendering per request", "Preloads the route", "Enables streaming"], "c": 1, "e": "Forces SSR on every request. Needed when the page reads cookies, headers or per-user data that must never be cached. The opposite problem, a page cached when it should not be, is a classic source of one user seeing another's data.", "id": "t36"}, {"t": "next", "d": 2, "q": "What is a Server Action?", "o": ["An API route", "A function marked `'use server'` that runs on the server and can be called from a client component", "A middleware", "A background job"], "c": 1, "e": "Server Actions let a form or handler invoke server code without you hand-writing an API route and fetch. They are POST endpoints under the hood, so they still need auth and validation, and the arguments are attacker-controlled.", "id": "t37"}, {"t": "next", "d": 3, "q": "Where does Next.js middleware run, and what is the main constraint?", "o": ["On Node, no constraints", "On the Edge runtime, so no Node APIs and a small bundle budget", "On the client", "In a worker thread"], "c": 1, "e": "Middleware runs on the Edge runtime before the request hits your route. No `fs`, no native Node modules, and heavy dependencies will blow the size limit. Ideal for auth redirects, rewrites and geo routing, not for database work.", "id": "t38"}, {"t": "next", "d": 2, "q": "What is the difference between `loading.tsx` and a Suspense boundary?", "o": ["They are unrelated", "`loading.tsx` is sugar that wraps the route segment in a Suspense boundary automatically", "`loading.tsx` blocks rendering", "Suspense only works on the client"], "c": 1, "e": "`loading.tsx` is a convention that Next wires into a Suspense boundary for that segment. Manual `<Suspense>` gives you finer control, letting fast parts of a page paint while a slow widget streams in.", "id": "t39"}, {"t": "next", "d": 3, "q": "Why did your multi-framework split (Svelte marketing, Astro content, Next.js app) make sense?", "o": ["Framework variety looks good", "Each surface has different traffic, content-workflow and security needs, so the right tool differs per surface", "Next.js cannot do marketing pages", "It was cheaper"], "c": 1, "e": "A marketing entry point wants tiny bundles and fast hydration; a content layer wants near-zero JS and CMS editing; an authenticated app wants SSR with hardened auth. Forcing one framework on all three means compromising on two. Be ready to defend the operational cost too.", "id": "t40"}, {"t": "node", "d": 1, "q": "Node is single-threaded. How does it handle thousands of concurrent connections?", "o": ["It spawns a thread per connection", "Non-blocking I/O plus an event loop; the OS does the waiting", "It queues requests and handles them one per second", "It uses Web Workers"], "c": 1, "e": "One JS thread runs your callbacks, but I/O is delegated to the kernel (epoll/kqueue) and libuv's thread pool. The thread is only busy when your code is actually running, so idle waiting costs nothing.", "id": "t41"}, {"t": "node", "d": 3, "q": "What blocks the Node event loop?", "o": ["Database queries", "Any long synchronous CPU work: JSON.parse on huge payloads, bcrypt with high cost, sync fs calls", "HTTP requests", "Timers"], "c": 1, "e": "I/O does not block, CPU does. A 200ms synchronous hash stalls every other request for 200ms. Move heavy CPU to worker threads, a queue, or a separate service.", "id": "t42"}, {"t": "node", "d": 2, "q": "Order of `process.nextTick` vs `Promise.then` vs `setImmediate`?", "o": ["nextTick, then Promise, then setImmediate", "Promise, nextTick, setImmediate", "setImmediate first", "All simultaneous"], "c": 0, "e": "`process.nextTick` drains before the promise microtask queue, and both drain before the loop moves to the check phase where `setImmediate` runs. Starving the loop with recursive nextTick is a real failure mode.", "id": "t43"}, {"t": "node", "d": 2, "q": "What does Express `next(err)` do?", "o": ["Retries the request", "Skips remaining handlers and jumps to error-handling middleware", "Ends the response", "Logs and continues"], "c": 1, "e": "Express routes to the first middleware with four arguments `(err, req, res, next)`. Async throws are NOT caught automatically in Express 4, so you need a wrapper or `express-async-errors`.", "id": "t44"}, {"t": "node", "d": 3, "q": "Why does NestJS use dependency injection?", "o": ["It is faster at runtime", "It decouples construction from use, so dependencies are swappable and unit-testable", "It reduces bundle size", "It is required by TypeScript"], "c": 1, "e": "Services declare what they need; the container supplies it. In a test you inject a mock repository instead of a real database. That is precisely the win over tangled Express controllers that `require` their dependencies directly.", "id": "t45"}, {"t": "node", "d": 2, "q": "In NestJS, what is the execution order for an incoming request?", "o": ["Guard, Interceptor, Pipe, Handler", "Middleware, Guard, Interceptor, Pipe, Handler, Interceptor", "Pipe, Guard, Handler", "Handler, Guard, Pipe"], "c": 1, "e": "Middleware runs first (Express-level), then Guards (authorization), then Interceptors (before), then Pipes (validation/transform), then the handler, then Interceptors again on the way out. Knowing the order matters for where to put auth vs validation.", "id": "t46"}, {"t": "node", "d": 2, "q": "What is the point of a NestJS DTO with class-validator?", "o": ["Documentation only", "Runtime validation of untrusted input, since TypeScript types vanish at compile time", "Faster serialization", "Database mapping"], "c": 1, "e": "TS types are erased at runtime, so a typed body proves nothing about the actual payload. `ValidationPipe` plus decorators enforces the shape at the boundary. Always set `whitelist: true` to strip unexpected fields.", "id": "t47"}, {"t": "node", "d": 3, "q": "What does clustering give you in Node, and what does it not?", "o": ["Shared memory between workers", "Multiple processes using all CPU cores; no shared memory, so state must be external", "Faster single requests", "Automatic load balancing across machines"], "c": 1, "e": "Cluster forks one process per core behind a shared socket. Each has its own heap, so in-memory sessions or caches diverge across workers. Anything stateful has to move to Redis or the database.", "id": "t48"}, {"t": "node", "d": 2, "q": "Why stream a large file response instead of reading it into memory?", "o": ["Streams are easier to write", "Constant memory use and the client starts receiving bytes immediately", "Streams compress automatically", "No reason, buffering is fine"], "c": 1, "e": "`fs.readFile` on a 2GB file allocates 2GB. A stream pipes fixed-size chunks, so memory stays flat and time-to-first-byte drops. Same principle underlies SSE and chunked responses.", "id": "t49"}, {"t": "db", "d": 1, "q": "What does a MongoDB compound index on `{status: 1, createdAt: -1}` support efficiently?", "o": ["Queries on createdAt alone", "Queries on status, and status+createdAt", "Any field combination", "Only exact matches on both"], "c": 1, "e": "The prefix rule: an index supports queries using a left-prefix of its fields. `status` alone works, `status`+`createdAt` works, `createdAt` alone does not. Field order is the whole design decision.", "id": "t50"}, {"t": "db", "d": 2, "q": "In an aggregation pipeline, why put `$match` before `$lookup`?", "o": ["Style preference", "It shrinks the document set before the expensive join, and can use an index", "`$lookup` requires it", "It does not matter, Mongo reorders"], "c": 1, "e": "`$match` early can use an index and cuts how many documents feed the join. Putting it after means you join everything then throw most away. Same logic applies to `$project` to drop unused fields early.", "id": "t51"}, {"t": "db", "d": 2, "q": "What is the risk of an unbounded array field in a MongoDB document?", "o": ["Nothing", "The 16MB document limit, plus rewrite cost as the array grows", "Slower indexes only", "It cannot be queried"], "c": 1, "e": "Documents cap at 16MB and growing arrays force relocations and large rewrites. Unbounded one-to-many (comments, events, order history) belongs in its own collection referencing the parent.", "id": "t52"}, {"t": "db", "d": 3, "q": "What does `$lookup` cost compared to a SQL JOIN?", "o": ["Identical performance", "Generally more expensive; no query planner join optimizations, and it is easy to make it unindexed", "Always faster", "It is not a join"], "c": 1, "e": "`$lookup` is a left outer join executed per input document. Without an index on the foreign field it is effectively a collection scan per document. Heavy relational access is a sign the data should have been modelled relationally.", "id": "t53"}, {"t": "db", "d": 2, "q": "What does a MongoDB transaction require?", "o": ["Nothing special", "A replica set or sharded cluster; standalone servers do not support them", "A special collection", "Version 3.0+"], "c": 1, "e": "Multi-document transactions need a replica set because they rely on the oplog. They also hold locks, so keep them short. Often the better answer is to model the data so a single-document atomic update suffices.", "id": "t54"}, {"t": "db", "d": 1, "q": "What is the difference between `WHERE` and `HAVING`?", "o": ["None", "`WHERE` filters rows before grouping; `HAVING` filters groups after aggregation", "`HAVING` is faster", "`WHERE` only works on indexed columns"], "c": 1, "e": "`WHERE` cannot reference aggregates because they do not exist yet. Filter as much as possible in `WHERE` so fewer rows reach the grouping step.", "id": "t55"}, {"t": "db", "d": 2, "q": "What is the N+1 query problem?", "o": ["A query that runs N+1 times slower", "Fetching N parent rows then issuing one query per parent for its children", "Too many indexes", "A deadlock pattern"], "c": 1, "e": "One query for the list, then N queries inside the loop. Fix with a JOIN, an `IN (...)` batch, or the ORM's eager loading. It is the single most common ORM performance bug and a very likely interview follow-up on your TypeORM work.", "id": "t56"}, {"t": "db", "d": 3, "q": "In `EXPLAIN ANALYZE`, what does a Seq Scan on a large table usually indicate?", "o": ["Optimal performance", "No usable index, or the planner estimates most rows match anyway", "A corrupted table", "A locking problem"], "c": 1, "e": "Sequential scan reads every row. On a big table it usually means a missing index, or a predicate the index cannot serve (leading wildcard LIKE, a function applied to the column). Note that on small tables a seq scan is genuinely correct.", "id": "t57"}, {"t": "db", "d": 2, "q": "What does an index NOT help with?", "o": ["Equality lookups", "Range scans", "`LIKE '%term'` with a leading wildcard", "Sorting by the indexed column"], "c": 2, "e": "A B-tree is ordered by prefix, so a leading wildcard has no starting point and must scan. Full-text search or a trigram (pg_trgm) index is the fix.", "id": "t58"}, {"t": "db", "d": 3, "q": "What isolation level is PostgreSQL's default, and what anomaly does it still allow?", "o": ["Serializable, none", "Read Committed; non-repeatable reads and phantom reads", "Repeatable Read; dirty reads", "Read Uncommitted; everything"], "c": 1, "e": "Read Committed sees a fresh snapshot per statement, so two reads in one transaction can differ. Use `SELECT ... FOR UPDATE` or a higher isolation level when you read-then-write, which is exactly the money-transfer scenario interviewers reach for.", "id": "t59"}, {"t": "db", "d": 3, "q": "Why can adding an index hurt?", "o": ["It never hurts", "Every write must update it, and it consumes storage and cache", "It locks reads permanently", "It breaks transactions"], "c": 1, "e": "Indexes are a read/write tradeoff. On write-heavy tables, redundant indexes cost measurable insert and update throughput. Also watch for duplicates: an index on `(a)` is redundant if `(a,b)` exists.", "id": "t60"}, {"t": "db", "d": 2, "q": "When would you choose PostgreSQL over MongoDB for a new module?", "o": ["Always", "When the data is relational with cross-entity integrity and you need transactions and ad-hoc joins", "When you need speed", "When the schema is unknown"], "c": 1, "e": "Payments, appointments and patient records are highly relational with hard consistency needs. That is the honest defence of your RxMen migration: the domain was relational, and the schema-flexibility argument for a document store did not apply.", "id": "t61"}, {"t": "auth", "d": 1, "q": "What are the three parts of a JWT?", "o": ["Header, payload, signature", "User, token, expiry", "Key, value, hash", "Issuer, subject, audience"], "c": 0, "e": "Base64url-encoded header and payload, plus a signature over both. Base64 is encoding, not encryption: anyone can read the payload, so never put secrets in it.", "id": "t62"}, {"t": "auth", "d": 2, "q": "Why is a short-lived access token paired with a refresh token?", "o": ["To reduce bandwidth", "A leaked access token expires quickly, while the refresh token lives in a safer store and can be revoked", "Refresh tokens are faster", "To support multiple devices"], "c": 1, "e": "JWTs are stateless so you cannot revoke them mid-life. Keeping the access token to minutes limits the blast radius; the refresh token is stored server-side or httpOnly and can be invalidated. Rotation plus reuse-detection is the strong version.", "id": "t63"}, {"t": "auth", "d": 3, "q": "Where should a JWT be stored in the browser?", "o": ["localStorage, it is simplest", "httpOnly Secure SameSite cookie, so JS cannot read it", "sessionStorage", "In a global variable"], "c": 1, "e": "localStorage is readable by any XSS payload. An httpOnly cookie is invisible to JS. The tradeoff is CSRF exposure, which you mitigate with `SameSite=Lax|Strict` and, for cross-site flows, a CSRF token.", "id": "t64"}, {"t": "auth", "d": 2, "q": "What is the difference between authentication and authorization?", "o": ["They are synonyms", "Authentication proves who you are; authorization decides what you may do", "Authorization happens first", "Authentication is only for APIs"], "c": 1, "e": "AuthN then AuthZ. RBAC is authorization. The classic bug is checking authentication but not ownership, so any logged-in user can read `/orders/123` by changing the ID. That is IDOR.", "id": "t65"}, {"t": "auth", "d": 3, "q": "Why enforce RBAC at the route/service layer rather than hiding UI elements?", "o": ["UI hiding is enough", "The API is the real boundary; hidden buttons do not stop a crafted request", "For better UX", "For faster rendering"], "c": 1, "e": "Hiding a button is a UX affordance, not a control. Anyone can call the endpoint directly. Declare the permission once and enforce it server-side, which is exactly the declarative route-layer model you used on Evify.", "id": "t66"}, {"t": "auth", "d": 2, "q": "What does SMS-based MFA protect against, and what is its known weakness?", "o": ["Everything; no weakness", "Protects against password compromise; weak to SIM swap and SS7 interception", "Protects against XSS", "Protects against CSRF"], "c": 1, "e": "It adds a second factor tied to something the user has, defeating credential stuffing. But SIM-swap attacks are real and regulators increasingly prefer TOTP or WebAuthn. Worth knowing since you built SMS MFA on Pinpoint.", "id": "t67"}, {"t": "auth", "d": 3, "q": "What makes bcrypt appropriate for password hashing and SHA-256 inappropriate?", "o": ["bcrypt is newer", "bcrypt is deliberately slow and salted; SHA-256 is fast, so it is cheap to brute-force", "SHA-256 is reversible", "bcrypt produces longer output"], "c": 1, "e": "Speed is the enemy. SHA-256 does billions of hashes per second on a GPU. bcrypt/scrypt/argon2 have a tunable cost factor and built-in salting. Note the flip side: a high cost factor blocks the Node event loop, so hash async.", "id": "t68"}, {"t": "auth", "d": 2, "q": "What is CORS actually protecting?", "o": ["Your server from load", "The user's browser from a malicious site reading responses from another origin using their credentials", "Data in transit", "API keys"], "c": 1, "e": "It is a browser-enforced policy, not server security. curl ignores it entirely. A permissive `Access-Control-Allow-Origin: *` combined with cookies is the dangerous combination, and browsers forbid that pairing for credentialed requests.", "id": "t69"}, {"t": "auth", "d": 3, "q": "How does parameterized SQL prevent injection?", "o": ["It escapes quotes", "The query plan is parsed before values bind, so input can never become executable syntax", "It validates types", "It encrypts input"], "c": 1, "e": "Structure and data travel separately. String concatenation lets input change the parse tree; a bound parameter is always a value. ORMs do this by default, which is why raw query builders are where injection creeps back in.", "id": "t70"}, {"t": "aws", "d": 1, "q": "What does AWS Cognito provide out of the box?", "o": ["A database", "User pools, sign-up/sign-in, token issuance and federation", "A CDN", "Message queues"], "c": 1, "e": "Cognito user pools manage the identity lifecycle and issue JWTs, so you are not hand-rolling credential storage and rotation. Identity pools are the separate feature that vends temporary AWS credentials.", "id": "t71"}, {"t": "aws", "d": 2, "q": "What is a Lambda cold start?", "o": ["The first request after deploy only", "Latency when a new execution environment must be initialized before handling a request", "A billing tier", "A timeout error"], "c": 1, "e": "AWS must provision the sandbox and run your init code. Worse with large bundles and VPC attachment. Mitigate with smaller packages, provisioned concurrency, and moving heavy setup outside the handler so it is reused on warm invocations.", "id": "t72"}, {"t": "aws", "d": 2, "q": "What is the correct way to let a browser upload directly to S3?", "o": ["Ship AWS keys to the client", "Have the server issue a presigned URL scoped to one object and a short expiry", "Make the bucket public", "Proxy the file through your API"], "c": 1, "e": "A presigned URL carries a time-limited signature for one specific operation. Traffic bypasses your server entirely, which saves bandwidth and memory. Proxying works but wastes compute; a public bucket is a data-leak headline.", "id": "t73"}, {"t": "aws", "d": 3, "q": "SNS vs SQS: what is the core difference?", "o": ["SNS is cheaper", "SNS is push pub/sub fan-out; SQS is a pull queue with durable buffering", "SQS is real-time", "They are interchangeable"], "c": 1, "e": "SNS pushes a message to many subscribers immediately with no retention if nobody listens. SQS holds messages until a consumer pulls and acknowledges. The common pattern is SNS fanning out into several SQS queues so each consumer buffers independently.", "id": "t74"}, {"t": "aws", "d": 2, "q": "Why is IAM least-privilege more than a checkbox?", "o": ["It reduces cost", "A compromised key or function is limited to exactly what its policy allows", "It speeds up requests", "It is required for HTTPS"], "c": 1, "e": "Blast radius. A Lambda that only needs `s3:GetObject` on one prefix should not carry `s3:*`. Interviewers probe this because over-broad roles are the most common real-world cloud misconfiguration.", "id": "t75"}, {"t": "rt", "d": 2, "q": "When is SSE a better fit than WebSockets?", "o": ["When you need bidirectional messaging", "When the server pushes and the client only listens; SSE is plain HTTP with auto-reconnect", "When you need binary frames", "Never, WebSockets are always better"], "c": 1, "e": "SSE is one-way over normal HTTP, so it passes proxies and load balancers cleanly, reuses your existing auth, and reconnects automatically with `Last-Event-ID`. A live dashboard is exactly its use case.", "id": "t76"}, {"t": "rt", "d": 2, "q": "What did replacing polling with SSE actually save?", "o": ["Client memory", "Redundant requests that mostly return unchanged data, plus the latency of the poll interval", "Bundle size", "Database storage"], "c": 1, "e": "Polling every 5s means 12 requests per minute per client, nearly all wasted, and up to 5s of staleness. Push sends only on change and arrives immediately. Quantify it if asked: requests per client per minute, times concurrent clients.", "id": "t77"}, {"t": "rt", "d": 3, "q": "What is the main operational limit of SSE over HTTP/1.1?", "o": ["No limit", "Browsers cap concurrent connections per origin (about 6), and each SSE stream holds one open", "It cannot use auth", "Messages are limited to 1KB"], "c": 1, "e": "Each open stream consumes one of the six per-origin connections, so several tabs can starve normal requests. HTTP/2 multiplexing removes this since streams share a connection. Server-side, each open stream also pins a connection/worker.", "id": "t78"}, {"t": "rt", "d": 3, "q": "How do you scale WebSockets or SSE across multiple server instances?", "o": ["You cannot", "Use a shared pub/sub backplane like Redis so any instance can reach a client connected elsewhere", "Sticky sessions solve everything", "Increase memory"], "c": 1, "e": "Connections are pinned to one process, so an event produced on instance B cannot reach a client on instance A without a backplane. Redis pub/sub or a managed service fans the event to all instances, each pushing to its own connections.", "id": "t79"}, {"t": "perf", "d": 2, "q": "What does LCP measure?", "o": ["Total load time", "Render time of the largest content element in the viewport", "JavaScript parse time", "Server response time"], "c": 1, "e": "Largest Contentful Paint marks when the main content is visibly painted. Good is under 2.5s. Usually dominated by a hero image or the server response, so preloading and trimming render-blocking work move it most.", "id": "t80"}, {"t": "perf", "d": 2, "q": "What causes a poor CLS score?", "o": ["Slow JavaScript", "Elements shifting after paint: unsized images, injected banners, late-loading fonts", "Large bundles", "Too many requests"], "c": 1, "e": "Cumulative Layout Shift measures visual instability. Fix by reserving space: width/height or aspect-ratio on media, placeholders for async content, and `font-display: optional|swap` with a metric-matched fallback.", "id": "t81"}, {"t": "perf", "d": 3, "q": "You cut page load ~30% by removing redundant re-renders and batching API calls. Which metric moved most?", "o": ["CLS", "Most likely INP and TTI from render work, and LCP from fewer sequential round-trips", "Only LCP", "Only CLS"], "c": 1, "e": "Fewer re-renders cuts main-thread work, improving interaction latency (INP) and time-to-interactive. Batching removes waterfall round-trips, pulling LCP in. Be ready to say how you measured it: Lighthouse, RUM, or the Performance panel.", "id": "t82"}, {"t": "perf", "d": 2, "q": "What is the difference between code splitting and tree shaking?", "o": ["They are the same", "Splitting defers chunks to load on demand; tree shaking removes unreachable exports at build time", "Tree shaking is runtime", "Splitting only works on CSS"], "c": 1, "e": "Tree shaking makes the bundle smaller; splitting makes the initial bundle smaller by deferring the rest. Tree shaking needs ES modules and no side effects, which is why `sideEffects: false` in package.json matters.", "id": "t83"}, {"t": "perf", "d": 3, "q": "Why can adding `useMemo` everywhere make an app slower?", "o": ["It cannot", "Every memo costs comparison and memory; if the computation is cheap you pay overhead for nothing", "It breaks hooks order", "It disables batching"], "c": 1, "e": "Memoization is a cache, and caches cost. For a cheap expression the dependency compare plus retained reference exceeds the saving. Profile first: memoize expensive computations and props feeding memoized children, not everything.", "id": "t84"}, {"t": "sd", "d": 2, "q": "What does idempotency mean for a payment API, and how do you implement it?", "o": ["The API never fails", "Repeating the same request has the same effect as once; implemented with a client-supplied idempotency key", "Requests are queued", "Requests are encrypted"], "c": 1, "e": "Networks retry. Without a key, a retried charge bills twice. The server stores the key with the result and returns the original response on replay. This is a near-certain question given fintech on your resume.", "id": "t85"}, {"t": "sd", "d": 2, "q": "What is the difference between horizontal and vertical scaling?", "o": ["Horizontal adds machines; vertical adds resources to one machine", "Horizontal is cheaper always", "Vertical is more reliable", "They are the same"], "c": 0, "e": "Vertical is simple but has a hard ceiling and a single point of failure. Horizontal scales further but forces you to handle statelessness, shared sessions, and distributed consistency.", "id": "t86"}, {"t": "sd", "d": 3, "q": "What is cache invalidation's hardest case in a user-specific dashboard?", "o": ["Cache size", "Serving one user's cached data to another, usually via a cache key missing the user dimension", "Expiry timing", "Compression"], "c": 1, "e": "A CDN or SSR cache keyed only on the URL will happily serve user A's portfolio to user B. The fix is user-scoped keys plus `Cache-Control: private`, or not caching authenticated responses at all.", "id": "t87"}, {"t": "sd", "d": 2, "q": "Why put a queue between an API and a slow downstream job?", "o": ["To reduce cost", "To decouple: the API responds immediately and the work is retried independently of the request lifecycle", "Queues are faster", "To avoid a database"], "c": 1, "e": "It converts a synchronous dependency into an asynchronous one. The request returns in milliseconds, work survives a consumer crash, and you get retries and backpressure. Tradeoff: eventual consistency, so the UI must reflect 'pending'.", "id": "t88"}, {"t": "sd", "d": 3, "q": "What is the CAP theorem's practical meaning during a network partition?", "o": ["You can have all three", "You must choose availability or consistency for that partition", "Partitions never happen", "Consistency is always chosen"], "c": 1, "e": "Partitions are a given, so the real choice is C or A when one occurs. A payment ledger picks consistency and refuses writes; a social feed picks availability and reconciles later. Naming which one your system picks is the expected answer.", "id": "t89"}, {"t": "ai", "d": 2, "q": "What is the main reason a compact DSL like OpenUI Lang beats JSON for LLM-generated UI?", "o": ["It is easier to read", "Far fewer tokens and a line-oriented format that can be parsed and rendered as it streams", "It is type-safe", "It supports comments"], "c": 1, "e": "JSON repeats keys on every object and is only valid once complete, so you cannot render partial output. A positional, line-oriented syntax cuts tokens substantially and lets each completed line render immediately.", "id": "t90"}, {"t": "ai", "d": 2, "q": "What does streaming a model response actually improve?", "o": ["Total generation time", "Perceived latency: time-to-first-token drops even though total time is unchanged", "Accuracy", "Token cost"], "c": 1, "e": "The model generates at the same rate; you just stop hiding it. Time-to-first-token is what users feel. Same principle as SSE on a dashboard, which is why both sit naturally on your resume.", "id": "t91"}, {"t": "ai", "d": 3, "q": "What is the biggest risk when an LLM generates UI that your frontend renders?", "o": ["Slow rendering", "Rendering unvalidated model output; you must whitelist components and props, never eval arbitrary output", "Large payloads", "Poor styling"], "c": 1, "e": "Model output is untrusted input. The renderer must map to a fixed component registry and reject unknown nodes or props, rather than interpreting arbitrary instructions. This is exactly the sort of boundary question a senior interviewer probes.", "id": "t92"}, {"t": "ai", "d": 2, "q": "Why is a low temperature appropriate for structured output?", "o": ["It is faster", "It reduces sampling randomness, making the model more likely to follow the required format", "It uses fewer tokens", "It improves reasoning"], "c": 1, "e": "Temperature scales the sampling distribution. Near 0 the model takes the highest-probability token, which is what you want for schema-conformant output. Creative copy wants the opposite.", "id": "t93"}, {"t": "cs", "d": 1, "q": "What is the time complexity of looking up a key in a hash map, average and worst case?", "o": ["O(1) and O(1)", "O(1) average, O(n) worst with collisions", "O(log n) both", "O(n) both"], "c": 1, "e": "Average O(1) with a good hash and load factor. Worst case degrades to O(n) when everything collides into one bucket. Modern implementations mitigate with tree-ified buckets, giving O(log n) worst case.", "id": "t94"}, {"t": "cs", "d": 2, "q": "What is the difference between a process and a thread?", "o": ["Nothing", "Processes have isolated memory; threads share the parent's address space", "Threads are slower", "Processes cannot communicate"], "c": 1, "e": "Isolation vs sharing. Threads are cheaper to create and share memory directly, which is why they need synchronization. Node's cluster module forks processes (no shared memory); worker_threads shares an ArrayBuffer.", "id": "t95"}, {"t": "cs", "d": 2, "q": "What happens during a TCP three-way handshake?", "o": ["SYN, SYN-ACK, ACK", "GET, 200, CLOSE", "HELLO, ACCEPT, DONE", "One packet each way"], "c": 0, "e": "Client SYN, server SYN-ACK, client ACK, then data flows. That is one full round-trip before any bytes move, which is why connection reuse (keep-alive, HTTP/2) matters so much for latency.", "id": "t96"}, {"t": "cs", "d": 2, "q": "What is the difference between HTTP 401 and 403?", "o": ["They are interchangeable", "401 means not authenticated; 403 means authenticated but not permitted", "401 is server error", "403 means not found"], "c": 1, "e": "401 invites you to authenticate and should carry `WWW-Authenticate`. 403 means credentials were understood and still refused. Some APIs deliberately return 404 instead of 403 to avoid confirming a resource exists.", "id": "t97"}, {"t": "cs", "d": 3, "q": "What does a database deadlock require, and how do you usually avoid it?", "o": ["Too many connections", "Two transactions holding locks the other needs; avoid by acquiring locks in a consistent order", "Slow queries", "Missing indexes"], "c": 1, "e": "Circular wait. The practical fix is ordering: always lock rows in the same sequence (for example by ascending ID) so a cycle cannot form. Keeping transactions short shrinks the window.", "id": "t98"}, {"t": "cs", "d": 2, "q": "What is the difference between an abstract class and an interface in OOP terms?", "o": ["None", "An abstract class can hold state and implementation; an interface is a pure contract", "Interfaces are faster", "Abstract classes allow multiple inheritance"], "c": 1, "e": "Abstract classes share code and fields with subclasses under single inheritance. Interfaces declare capability and a class can implement many. The practical rule: interface for 'can do', abstract class for 'is a, with shared behaviour'.", "id": "t99"}], PATS=[{"id": "two-pointers", "name": "Two Pointers", "when": "Sorted array, pair/triplet sums, in-place partitioning, palindromes, merging.", "tell": "You see a sorted input and a brute force that is a nested loop over pairs.", "cx": "O(n) time, O(1) space", "code": "// Pair summing to target in a SORTED array\nfunction twoSum(nums, target) {\n  let lo = 0, hi = nums.length - 1;\n  while (lo < hi) {\n    const sum = nums[lo] + nums[hi];\n    if (sum === target) return [lo, hi];\n    if (sum < target) lo++;      // need bigger -> move left pointer up\n    else hi--;                   // need smaller -> move right pointer down\n  }\n  return [-1, -1];\n}"}, {"id": "sliding-window", "name": "Sliding Window", "when": "Longest/shortest contiguous subarray or substring meeting a condition.", "tell": "The words 'contiguous' or 'substring' plus a constraint (at most K, no repeats, sum >= target).", "cx": "O(n) time, O(k) space", "code": "// Longest substring with no repeating characters\nfunction lengthOfLongestSubstring(s) {\n  const lastSeen = new Map();\n  let start = 0, best = 0;\n  for (let end = 0; end < s.length; end++) {\n    const ch = s[end];\n    // only move start forward, never backward\n    if (lastSeen.has(ch) && lastSeen.get(ch) >= start) {\n      start = lastSeen.get(ch) + 1;\n    }\n    lastSeen.set(ch, end);\n    best = Math.max(best, end - start + 1);\n  }\n  return best;\n}"}, {"id": "hashmap", "name": "Hash Map / Frequency", "when": "Counting, grouping, de-duplicating, or trading space for a lookup.", "tell": "A brute force that repeatedly asks 'have I seen this before?'", "cx": "O(n) time, O(n) space", "code": "// Group anagrams: canonical key -> bucket\nfunction groupAnagrams(words) {\n  const buckets = new Map();\n  for (const w of words) {\n    const key = [...w].sort().join('');   // O(k log k) per word\n    if (!buckets.has(key)) buckets.set(key, []);\n    buckets.get(key).push(w);\n  }\n  return [...buckets.values()];\n}"}, {"id": "prefix-sum", "name": "Prefix Sum", "when": "Repeated range-sum queries, or subarrays summing to a target.", "tell": "You need sum(i..j) many times, or 'count subarrays with sum k'.", "cx": "O(n) build, O(1) per query", "code": "// Count subarrays summing to k\nfunction subarraySum(nums, k) {\n  const seen = new Map([[0, 1]]);  // prefix 0 seen once, handles prefix === k\n  let running = 0, count = 0;\n  for (const n of nums) {\n    running += n;\n    count += seen.get(running - k) || 0;\n    seen.set(running, (seen.get(running) || 0) + 1);\n  }\n  return count;\n}"}, {"id": "binary-search", "name": "Binary Search", "when": "Sorted data, or any monotonic predicate — including 'search on the answer'.", "tell": "'Minimum X such that...' or a sorted array. If a candidate answer can be checked yes/no monotonically, binary search it.", "cx": "O(log n), or O(n log range) when searching on the answer", "code": "// Leftmost index where predicate becomes true\nfunction lowerBound(lo, hi, ok) {\n  while (lo < hi) {\n    const mid = lo + ((hi - lo) >> 1);   // avoids overflow, floors\n    if (ok(mid)) hi = mid;               // mid works, look left for smaller\n    else lo = mid + 1;\n  }\n  return lo;\n}\n// usage: min capacity to ship in D days\n// lowerBound(maxWeight, totalWeight, cap => daysNeeded(cap) <= D)"}, {"id": "stack", "name": "Stack / Monotonic Stack", "when": "Matching pairs, nesting, or 'next greater/smaller element'.", "tell": "Brackets, expression parsing, or needing the nearest larger value to the right.", "cx": "O(n) — each element pushed and popped at most once", "code": "// Next greater element to the right, -1 if none\nfunction nextGreater(nums) {\n  const res = new Array(nums.length).fill(-1);\n  const stack = [];                  // holds INDICES, decreasing values\n  for (let i = 0; i < nums.length; i++) {\n    while (stack.length && nums[stack[stack.length - 1]] < nums[i]) {\n      res[stack.pop()] = nums[i];\n    }\n    stack.push(i);\n  }\n  return res;\n}"}, {"id": "linked-list", "name": "Linked List (fast/slow)", "when": "Cycle detection, middle node, nth from end, reversal.", "tell": "No index access, and you want one pass with O(1) extra space.", "cx": "O(n) time, O(1) space", "code": "// Reverse a linked list iteratively\nfunction reverse(head) {\n  let prev = null, cur = head;\n  while (cur) {\n    const next = cur.next;   // save before overwriting\n    cur.next = prev;\n    prev = cur;\n    cur = next;\n  }\n  return prev;\n}\n// Cycle detection: slow = slow.next, fast = fast.next.next; meet => cycle"}, {"id": "trees", "name": "Trees: DFS & BFS", "when": "Any binary tree or n-ary traversal, depth, path, or level question.", "tell": "'Level order' means BFS with a queue. 'Path' or 'depth' usually means DFS recursion.", "cx": "O(n) time, O(h) space for DFS, O(w) for BFS", "code": "// Level-order traversal, one array per level\nfunction levelOrder(root) {\n  if (!root) return [];\n  const out = [], queue = [root];\n  while (queue.length) {\n    const size = queue.length;        // freeze this level's width\n    const level = [];\n    for (let i = 0; i < size; i++) {\n      const node = queue.shift();\n      level.push(node.val);\n      if (node.left) queue.push(node.left);\n      if (node.right) queue.push(node.right);\n    }\n    out.push(level);\n  }\n  return out;\n}"}, {"id": "heap", "name": "Heap / Top-K", "when": "K largest/smallest, streaming medians, merging sorted lists.", "tell": "'Top K' or 'Kth largest'. Sorting is O(n log n); a size-K heap is O(n log k).", "cx": "O(n log k) time, O(k) space", "code": "// Kth largest using a min-heap of size k (sketch; JS has no built-in heap)\n// Keep the k largest seen; the heap root is the kth largest.\nfunction kthLargest(nums, k) {\n  const heap = new MinHeap();\n  for (const n of nums) {\n    heap.push(n);\n    if (heap.size() > k) heap.pop();   // evict the smallest\n  }\n  return heap.peek();\n}\n// In an interview: state you would use a heap, then either\n// hand-roll siftUp/siftDown or sort if n is small. Say which and why."}, {"id": "backtracking", "name": "Backtracking", "when": "Generate all permutations, combinations, subsets; N-Queens; word search.", "tell": "'All possible...' with a branching choice at each step.", "cx": "Exponential: O(2^n) subsets, O(n!) permutations", "code": "// All subsets\nfunction subsets(nums) {\n  const out = [], path = [];\n  (function dfs(start) {\n    out.push([...path]);              // copy, not the live array\n    for (let i = start; i < nums.length; i++) {\n      path.push(nums[i]);\n      dfs(i + 1);\n      path.pop();                     // undo — this is the backtrack\n    }\n  })(0);\n  return out;\n}"}, {"id": "graphs", "name": "Graphs: BFS / DFS / Topo Sort", "when": "Grids, islands, shortest path on unweighted edges, dependency ordering.", "tell": "A grid is a graph. 'Prerequisites' or 'build order' means topological sort.", "cx": "O(V + E)", "code": "// Count islands in a grid (DFS flood fill)\nfunction numIslands(grid) {\n  if (!grid.length) return 0;\n  const rows = grid.length, cols = grid[0].length;\n  let count = 0;\n  const sink = (r, c) => {\n    if (r < 0 || c < 0 || r >= rows || c >= cols || grid[r][c] !== '1') return;\n    grid[r][c] = '0';                 // mark visited in-place\n    sink(r+1,c); sink(r-1,c); sink(r,c+1); sink(r,c-1);\n  };\n  for (let r = 0; r < rows; r++)\n    for (let c = 0; c < cols; c++)\n      if (grid[r][c] === '1') { count++; sink(r, c); }\n  return count;\n}"}, {"id": "dp", "name": "Dynamic Programming", "when": "Overlapping subproblems plus optimal substructure: counting ways, min cost, longest X.", "tell": "Recursion that recomputes the same arguments. Memoize first, then convert to a table if asked.", "cx": "O(states x transition cost)", "code": "// Climbing stairs -> the shape of almost every 1D DP\nfunction climbStairs(n) {\n  let prev = 1, cur = 1;              // ways to reach step 0 and 1\n  for (let i = 2; i <= n; i++) {\n    [prev, cur] = [cur, prev + cur];  // only last two states needed\n  }\n  return cur;\n}\n// Interview move: write the recurrence out loud first.\n// dp[i] = dp[i-1] + dp[i-2], base dp[0]=dp[1]=1"}, {"id": "intervals", "name": "Intervals", "when": "Merging, inserting, detecting overlap, meeting rooms.", "tell": "Input is pairs of start/end. Almost always: sort by start first.", "cx": "O(n log n) dominated by the sort", "code": "// Merge overlapping intervals\nfunction merge(intervals) {\n  intervals.sort((a, b) => a[0] - b[0]);\n  const out = [];\n  for (const [start, end] of intervals) {\n    const last = out[out.length - 1];\n    if (last && start <= last[1]) last[1] = Math.max(last[1], end);\n    else out.push([start, end]);\n  }\n  return out;\n}"}], PROBS=[["two-pointers", 167, "Two Sum II (sorted)", 1, "The canonical template. Do this one first."], ["two-pointers", 125, "Valid Palindrome", 1, "Pointer walk plus character filtering."], ["two-pointers", 283, "Move Zeroes", 1, "In-place partition with a write pointer."], ["two-pointers", 11, "Container With Most Water", 2, "Always move the shorter wall; argue why that is safe."], ["two-pointers", 15, "3Sum", 2, "Sort, fix one, two-pointer the rest. Duplicate skipping is the hard part."], ["two-pointers", 42, "Trapping Rain Water", 3, "Two pointers with running max from each side."], ["sliding-window", 3, "Longest Substring Without Repeating", 2, "The template above. Memorize it."], ["sliding-window", 643, "Maximum Average Subarray I", 1, "Fixed-size window, simplest case."], ["sliding-window", 209, "Minimum Size Subarray Sum", 2, "Variable window that shrinks while valid."], ["sliding-window", 424, "Longest Repeating Character Replacement", 2, "Window valid while len - maxFreq <= k."], ["sliding-window", 76, "Minimum Window Substring", 3, "The hard one. Two maps plus a 'formed' ry merge."], ["linked-list", 141, "Linked List Cycle", 1, "Floyd's fast/slow pointers."], ["linked-list", 876, "Middle of the Linked List", 1, "Fast/slow again."], ["linked-list", 19, "Remove Nth Node From End", 2, "Gap of n between two pointers."], ["linked-list", 146, "LRU Cache", 2, "Hashmap + doubly linked list. Asked constantly at senior level."], ["trees", 104, "Maximum Depth of Binary Tree", 1, "Base case plus recursion. Start here."], ["trees", 226, "Invert Binary Tree", 1, "The famous one."], ["trees", 102, "Binary Tree Level Order Traversal", 2, "BFS template above."], ["trees", 98, "Validate Binary Search Tree", 2, "Pass down min/max bounds, do not just compare children."], ["trees", 235, "Lowest Common Ancestor of a BST", 2, "Use the BST property to walk down."], ["trees", 236, "Lowest Common Ancestor of a Binary Tree", 2, "General case, post-order return."], ["trees", 124, "Binary Tree Maximum Path Sum", 3, "Return one branch, record the split. Classic hard."], ["heap", 703, "Kth Largest Element in a Stream", 1, "Size-k min-heap, exactly the template."], ["heap", 215, "Kth Largest Element in an Array", 2, "Heap, or quickselect if they push for O(n) average."], ["heap", 23, "Merge k Sorted Lists", 3, "Heap of list heads. Common at senior level."], ["heap", 295, "Find Median from Data Stream", 3, "Two heaps, max-heap low half, min-heap high half."], ["backtracking", 78, "Subsets", 2, "The template above."], ["backtracking", 46, "Permutations", 2, "Used-array or swap approach."], ["backtracking", 39, "Combination Sum", 2, "Reuse allowed, so recurse on i not i+1."], ["backtracking", 79, "Word Search", 2, "Grid DFS with visited marking and undo."], ["graphs", 200, "Number of Islands", 2, "Flood fill. The template above."], ["graphs", 133, "Clone Graph", 2, "Hashmap from original node to clone."], ["graphs", 207, "Course Schedule", 2, "Cycle detection via topological sort (Kahn's). Very common."], ["graphs", 417, "Pacific Atlantic Water Flow", 2, "Reverse the
