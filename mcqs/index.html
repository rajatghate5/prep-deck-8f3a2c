<!DOCTYPE html>
<html lang="en">
<head>

<title>Rajat Ghate — Interview MCQs</title>
<style>
  :root {
    --bg:#0f172a; --card:#1e293b; --card-hover:#334155; --text:#e2e8f0;
    --muted:#94a3b8; --accent:#38bdf8; --accent-2:#a78bfa;
    --green:#4ade80; --orange:#fb923c; --red:#f87171; --border:#334155;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.6;
  }
  header {
    background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);
    padding:20px 24px; border-bottom:2px solid var(--accent);
    position:sticky; top:0; z-index:100; backdrop-filter:blur(10px);
  }
  header h1 { margin:0 0 4px 0; font-size:22px; color:var(--accent); }
  header p { margin:0; color:var(--muted); font-size:13px; }
  .scorebar {
    display:flex; flex-wrap:wrap; gap:16px; align-items:center;
    margin-top:12px; font-size:13px;
  }
  .scorebar .stat { color:var(--muted); }
  .scorebar .stat b { color:var(--text); font-size:15px; }
  .scorebar .stat.correct b { color:var(--green); }
  .scorebar .stat.wrong b { color:var(--red); }
  .progress-track {
    flex:1; min-width:120px; height:6px; background:var(--border);
    border-radius:3px; overflow:hidden;
  }
  .progress-fill { height:100%; width:0%; background:var(--accent); transition:width .3s; }
  .container { max-width:900px; margin:0 auto; padding:24px; }
  .controls {
    display:flex; flex-direction:column; gap:10px; margin-bottom:24px;
    padding:16px; background:var(--card); border-radius:12px; border:1px solid var(--border);
  }
  .filter-row { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .filter-label { font-size:12px; color:var(--muted); margin-right:4px; text-transform:uppercase; letter-spacing:.5px; }
  .filter-btn {
    background:transparent; border:1px solid var(--border); color:var(--text);
    padding:6px 14px; border-radius:20px; cursor:pointer; font-size:13px; transition:all .2s;
  }
  .filter-btn:hover { background:var(--card-hover); }
  .filter-btn.active { background:var(--accent); color:#0f172a; border-color:var(--accent); font-weight:600; }
  .filter-btn.danger:hover { background:var(--red); color:#0f172a; border-color:var(--red); }
  .search-wrap { position:relative; display:flex; align-items:center; }
  #search {
    flex:1; background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:10px 76px 10px 14px; border-radius:8px; font-size:14px; width:100%;
  }
  #search:focus { outline:none; border-color:var(--accent); }
  .search-meta { position:absolute; right:10px; display:flex; gap:8px; align-items:center; font-size:11px; color:var(--muted); }
  .kbd { border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-size:10px; }

  .q-card {
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:18px; margin-bottom:16px;
  }
  .q-card.answered-correct { border-color:rgba(74,222,128,.5); }
  .q-card.answered-wrong { border-color:rgba(248,113,113,.5); }
  .q-meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:10px; }
  .badge {
    display:inline-block; padding:2px 8px; border-radius:4px; font-size:10px;
    font-weight:700; text-transform:uppercase; letter-spacing:.3px;
  }
  .badge.startup { background:rgba(74,222,128,.2); color:var(--green); }
  .badge.mid { background:rgba(251,146,60,.2); color:var(--orange); }
  .badge.mnc { background:rgba(248,113,113,.2); color:var(--red); }
  .badge.india { background:rgba(251,191,36,.18); color:#fbbf24; }
  .badge.sec { background:rgba(56,189,248,.15); color:var(--accent); }
  .q-num { margin-left:auto; font-size:11px; color:var(--muted); }
  .q-text { font-size:15px; font-weight:600; margin:0 0 14px 0; }
  .q-text code, .opt code, .explain code {
    background:rgba(148,163,184,.15); padding:1px 5px; border-radius:4px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.9em; color:var(--accent-2);
  }
  .opts { display:flex; flex-direction:column; gap:8px; }
  .opt {
    display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%;
    background:var(--bg); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; border-radius:8px; cursor:pointer; font-size:14px;
    font-family:inherit; line-height:1.5; transition:all .15s;
  }
  .opt:hover:not(:disabled) { background:var(--card-hover); border-color:var(--muted); }
  .opt:disabled { cursor:default; }
  .opt .key {
    flex-shrink:0; width:22px; height:22px; border-radius:5px; background:var(--border);
    color:var(--text); font-size:11px; font-weight:700; display:flex;
    align-items:center; justify-content:center; margin-top:1px;
  }
  .opt.correct { background:rgba(74,222,128,.14); border-color:var(--green); }
  .opt.correct .key { background:var(--green); color:#0f172a; }
  .opt.wrong { background:rgba(248,113,113,.14); border-color:var(--red); }
  .opt.wrong .key { background:var(--red); color:#0f172a; }
  .opt.dimmed { opacity:.55; }
  .explain {
    margin-top:14px; padding:12px 14px; border-radius:8px;
    background:rgba(56,189,248,.08); border-left:3px solid var(--accent);
    font-size:13.5px; color:var(--text);
  }
  .explain .lead { font-weight:700; color:var(--accent); margin-right:6px; }
  .explain .src { display:block; margin-top:8px; font-size:11px; color:var(--muted); }
  .no-results { display:none; text-align:center; padding:40px; color:var(--muted); }
  .no-results.visible { display:block; }
  mark { background:rgba(251,191,36,.35); color:inherit; border-radius:3px; padding:0 2px; }

  .results-panel {
    display:none; background:var(--card); border:1px solid var(--accent);
    border-radius:12px; padding:20px; margin-bottom:20px;
  }
  .results-panel.visible { display:block; }
  .results-panel h3 { margin:0 0 12px 0; color:var(--accent); font-size:18px; }
  .score-big { font-size:34px; font-weight:800; margin:6px 0; }
  .bd-row { display:flex; align-items:center; gap:10px; font-size:13px; margin:5px 0; }
  .bd-row .bd-name { flex:1; color:var(--muted); }
  .bd-bar { width:110px; height:6px; background:var(--border); border-radius:3px; overflow:hidden; }
  .bd-bar span { display:block; height:100%; background:var(--green); }
  .bd-score { width:52px; text-align:right; font-variant-numeric:tabular-nums; }

  footer { text-align:center; padding:30px 20px 50px; color:var(--muted); font-size:12px; }
  @media (max-width:600px) {
    .container { padding:14px; }
    header { padding:14px 16px; }
    header h1 { font-size:18px; }
    .q-card { padding:14px; }
    .opt { font-size:13.5px; padding:10px 12px; }
  }
</style>

<script>
const QUESTIONS = [
{s:"cheatsheet-fe",l:"mnc",t:"frontend",q:"In a fintech form with 40 fields, why does React Hook Form outperform a fully controlled form?",o:["RHF is uncontrolled — the DOM holds the value, so typing causes zero re-renders","RHF batches setState calls into a single render per keystroke","RHF compiles the form to WebAssembly for faster validation","RHF stores field values in localStorage instead of React state"],c:0,e:"Controlled = React holds the value (every keystroke re-renders). Uncontrolled = the DOM holds it. RHF registers inputs as uncontrolled refs, so a 40-field loan form doesn't re-render while the user types."},
{s:"cheatsheet-fe",l:"mnc",t:"frontend",q:"What is the correct statement about <code>useMemo</code> vs <code>useCallback</code>?",o:["<code>useMemo</code> caches a value; <code>useCallback</code> caches a function reference","<code>useMemo</code> caches a function; <code>useCallback</code> caches its return value","They are identical — <code>useCallback</code> is an alias kept for backwards compatibility","<code>useMemo</code> runs before render; <code>useCallback</code> runs after"],c:0,e:"<code>useMemo(fn, deps)</code> caches the <b>result</b> of calling fn. <code>useCallback(fn, deps)</code> caches the <b>function identity</b> itself. Both are only worth it when the child is memoized or the computation is genuinely expensive."},
{s:"cheatsheet-fe",l:"mnc",t:"frontend",q:"Why should you never use an array index as a React <code>key</code> in a reorderable list?",o:["Component state gets attached to the wrong row when items are reordered","React throws a runtime error for numeric keys","Indexes make the Virtual DOM diff run in O(n²)","Keys must be strings, so numbers are silently ignored"],c:0,e:"Keys tell React which element is which across renders. With index keys, deleting or reordering shifts every index, so React reuses the wrong component instance — local state (a focused input, a checkbox) sticks to the wrong row."},
{s:"cheatsheet-fe",l:"mnc",t:"frontend",q:"What is the Virtual DOM actually optimising?",o:["It reduces the number of real DOM writes by diffing a JS-object tree first","It makes JavaScript execution faster via JIT hints","It renders on the GPU instead of the CPU","It caches HTTP responses so components refetch less"],c:0,e:"The Virtual DOM is not inherently 'fast'. React builds a plain JS-object tree, diffs it against the previous one, and applies the minimal set of patches — the win is <b>fewer DOM writes</b>, not faster JS."},
{s:"cheatsheet-fe",l:"mnc",t:"frontend",q:"In TanStack Query, what does <code>staleTime</code> control?",o:["How long data is considered fresh before a refetch is allowed","How long unused data stays in the cache before garbage collection","The request timeout before the query aborts","How many times a failed query is retried"],c:0,e:"<code>staleTime</code> = how long the data is treated as fresh (no refetch). <code>gcTime</code> (formerly <code>cacheTime</code>) = how long <b>unused</b> data lingers in cache before it's garbage-collected. Mixing these two up is a classic interview trip-up."},
{s:"cheatsheet-fe",l:"mid",t:"frontend",q:"For a multi-step loan wizard using Zustand, what is <code>partialize</code> used for?",o:["To keep PII (like SSN) out of persisted storage while still saving the rest of the wizard state","To split the store into multiple independent slices","To lazily load each wizard step's reducer on demand","To make only part of the store reactive, reducing re-renders"],c:0,e:"<code>partialize</code> selects which slice of state the persist middleware writes to storage. In lending, you persist step progress and non-sensitive fields but deliberately exclude SSN/PII so it never lands in localStorage."},
{s:"cheatsheet-be",l:"mnc",t:"backend",q:"What is the correct order of the Node.js event loop phases?",o:["Timers → Pending → Idle/Prepare → Poll → Check → Close","Poll → Timers → Check → Pending → Close → Idle","Timers → Poll → Pending → Close → Check → Idle","Check → Timers → Poll → Idle → Pending → Close"],c:0,e:"Timers (<code>setTimeout</code>/<code>setInterval</code>) → Pending callbacks → Idle/Prepare → Poll (I/O) → Check (<code>setImmediate</code>) → Close. Microtasks (Promises, <code>queueMicrotask</code>) drain between <b>every</b> phase, and <code>process.nextTick</code> drains first."},
{s:"cheatsheet-be",l:"mnc",t:"backend",q:"Inside an I/O callback, what is the execution order?",o:["<code>process.nextTick</code> → Promise → <code>setImmediate</code> → <code>setTimeout</code>","<code>setTimeout</code> → <code>setImmediate</code> → Promise → <code>process.nextTick</code>","Promise → <code>process.nextTick</code> → <code>setTimeout</code> → <code>setImmediate</code>","<code>setImmediate</code> → <code>setTimeout</code> → <code>process.nextTick</code> → Promise"],c:0,e:"<code>nextTick</code> drains before the microtask queue, then Promises, then Check phase (<code>setImmediate</code>) fires before the loop wraps to Timers. Note: at the <b>top level</b> (outside I/O), <code>setImmediate</code> vs <code>setTimeout(0)</code> ordering is non-deterministic."},
{s:"cheatsheet-be",l:"mnc",t:"backend",q:"You need to run CPU-bound computer-vision inference in a Node service. Which primitive is correct?",o:["<code>worker_threads</code>","<code>cluster</code>","<code>child_process.spawn</code> of another Node binary","An <code>async</code> function with <code>await</code>"],c:0,e:"<code>worker_threads</code> = CPU-bound work in-process with shared memory (<code>SharedArrayBuffer</code>). <code>cluster</code> = N processes to scale <b>I/O</b> across cores. <code>child_process</code> = shelling out to external binaries like ffmpeg. <code>async/await</code> does nothing for CPU-bound work — it still blocks the loop."},
{s:"cheatsheet-be",l:"mnc",t:"backend",q:"What constraint governs Postgres connection pool sizing across Kubernetes pods?",o:["<code>pool.max</code> × pod_count must stay under Postgres <code>max_connections</code>","<code>pool.max</code> must equal the number of CPU cores per pod","<code>pool.max</code> must be a power of two for the pool's ring buffer","Pool size is irrelevant once you enable SSL"],c:0,e:"Every pod opens up to <code>pool.max</code> connections, so total = <code>pool.max</code> × pods. Exceed <code>max_connections</code> and new pods fail to connect. Past ~5 pods, put PgBouncer (transaction mode) in front and set <code>?pgbouncer=true</code> on the Prisma URL."},
{s:"cheatsheet-be",l:"mnc",t:"backend",q:"Why use the <code>globalThis</code> singleton pattern for PrismaClient?",o:["Hot-reload in dev otherwise creates a new client per reload, leaking connections until the pool is exhausted","Prisma requires a global to resolve its schema path at runtime","It enables Prisma's query cache, which is off by default","Without it, TypeScript can't infer the generated model types"],c:0,e:"In dev, every hot reload re-executes module code. Without stashing the client on <code>globalThis</code>, each reload spawns a fresh PrismaClient with its own pool — the classic pool-exhaustion trap."},
{s:"cheatsheet-be",l:"mnc",t:"backend",q:"How do you avoid deadlocks when two transactions update the same set of rows?",o:["Acquire locks in a consistent order (e.g. always ascending by id)","Use <code>READ UNCOMMITTED</code> isolation","Wrap each statement in its own transaction","Increase the statement timeout"],c:0,e:"Deadlock = two transactions each hold a lock the other wants. Locking rows in a globally consistent order (sort ids before <code>SELECT ... FOR UPDATE</code>) makes a cycle impossible. Lower isolation doesn't prevent write-write deadlocks."},
{s:"cheatsheet-be",l:"mid",t:"backend",q:"For Wobot AI's multi-tenant camera data (Goodwill, CureFit, What-A-Burger), which Postgres feature enforces isolation at the database layer?",o:["Row-Level Security (RLS) policies","A <code>tenant_id</code> column with an index","Separate schemas per tenant enforced in application code","<code>GRANT SELECT</code> on views per tenant"],c:0,e:"RLS pushes the tenant predicate into the database itself, so a forgotten <code>WHERE tenant_id = ?</code> in application code can't leak data across tenants. A plain indexed column relies entirely on every query being written correctly."},
{s:"cheatsheet-db",l:"mnc",t:"databases",q:"Which Postgres index type is designed for append-ordered time-series data like camera events?",o:["BRIN","GIN","GiST","Hash"],c:0,e:"BRIN (Block Range INdex) stores min/max per block range — tiny and extremely effective when physical row order correlates with the indexed column (timestamps in an append-only table). GIN is for JSONB/arrays/full-text, GiST for geo/ranges, Hash for equality only."},
{s:"cheatsheet-db",l:"mnc",t:"databases",q:"You have an index on <code>(a, b, c)</code>. Which query can NOT use it efficiently?",o:["<code>WHERE b = 5</code>","<code>WHERE a = 1</code>","<code>WHERE a = 1 AND b = 5</code>","<code>WHERE a = 1 AND b = 5 AND c = 9</code>"],c:0,e:"The leftmost-prefix rule: a composite index is usable for <code>a</code>, <code>a+b</code>, or <code>a+b+c</code> — but not for <code>b</code> alone, because the index is sorted by <code>a</code> first."},
{s:"cheatsheet-db",l:"mnc",t:"databases",q:"What is the SQL logical execution order?",o:["FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → DISTINCT → ORDER BY → LIMIT","SELECT → FROM → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT","FROM → WHERE → SELECT → GROUP BY → HAVING → ORDER BY → LIMIT","SELECT → WHERE → FROM → JOIN → GROUP BY → ORDER BY → LIMIT"],c:0,e:"This ordering explains two classic gotchas: you can't reference a <code>SELECT</code> alias in <code>WHERE</code> (SELECT runs later), and <code>WHERE</code> filters rows <b>before</b> grouping while <code>HAVING</code> filters groups <b>after</b>."},
{s:"cheatsheet-db",l:"mnc",t:"databases",q:"True or false: PostgreSQL has clustered indexes like InnoDB.",o:["False — Postgres uses heap tables; <code>CLUSTER</code> is a one-off physical reorder, not a maintained clustered index","True — the primary key is always the clustered index","True, but only for tables with a <code>BIGSERIAL</code> primary key","False — Postgres has no indexes at all on the heap, only on materialised views"],c:0,e:"InnoDB and MSSQL physically sort the table by the clustered key. Postgres stores rows in an unordered heap; all indexes are secondary and point at heap tuples. <code>CLUSTER</code> reorders once but does not maintain that order on subsequent writes."},
{s:"cheatsheet-db",l:"mnc",t:"databases",q:"What is a covering index (Postgres <code>INCLUDE</code>) buying you?",o:["An index-only scan — the extra columns ride along so no heap fetch is needed","Automatic deduplication of the indexed rows","Compression of the index pages","Enforcement of uniqueness across the included columns"],c:0,e:"<code>CREATE INDEX ... ON t (a) INCLUDE (b)</code> stores <code>b</code> in the leaf pages without making it part of the key. A query needing only <code>a</code> and <code>b</code> is answered from the index alone — no trip to the heap."},
{s:"cheatsheet-infra",l:"mnc",t:"infra",q:"Why does <code>COPY package*.json ./</code> come before <code>COPY . .</code> in a Dockerfile?",o:["So the <code>npm ci</code> layer stays cached when only application source changes","Because Docker requires manifest files before any other COPY","To reduce the final image size by excluding source from the layer","So npm can resolve the registry mirror before the network is sealed"],c:0,e:"Each Dockerfile line is a cached layer, invalidated by any change to its inputs. Copying just the manifests first means editing app code doesn't bust the dependency-install layer — order least-to-most-changing."},
{s:"cheatsheet-infra",l:"mnc",t:"infra",q:"A pod is alive but not yet ready to serve traffic. Which probe handles this?",o:["Readiness probe","Liveness probe","Startup probe","Termination probe"],c:0,e:"Liveness = restart the container if it's dead. Readiness = should this pod receive traffic right now. Startup = give slow-booting apps time before liveness kicks in. Getting readiness wrong sends requests to pods that can't serve them."},
{s:"cheatsheet-infra",l:"mnc",t:"infra",q:"Which workload type gives pods stable network identity and ordered startup — the right choice for a database?",o:["StatefulSet","Deployment","DaemonSet","Job"],c:0,e:"Deployment = interchangeable stateless replicas. StatefulSet = ordered, stable pod identity + stable per-pod storage (<code>db-0</code>, <code>db-1</code>). DaemonSet = exactly one pod per node, for log/metrics agents."},
{s:"cheatsheet-infra",l:"mnc",t:"infra",q:"Why is autoscaling purely on request rate a bad idea?",o:["Bursty traffic thrashes the autoscaler — scale on CPU/memory or a lag indicator like queue depth","Request rate isn't exposed by the Kubernetes metrics API at all","HPA only supports a single metric, and it must be CPU","Request rate scaling requires a service mesh, which adds latency"],c:0,e:"Request-rate scaling reacts to every spike, causing scale-up/scale-down oscillation. CPU/memory or a saturation signal like queue depth reflects actual pressure and damps the feedback loop."},
{s:"cheatsheet-nt",l:"mid",t:"non-tech",q:"Which \"biggest weakness\" answer is strongest in a senior interview?",o:["\"I used to over-engineer for hypothetical scale — I now ship the simple version and let load tell me what to optimise\"","\"I work too hard and struggle to switch off\"","\"I'm a perfectionist about code quality\"","\"I don't really have one that affects my work\""],c:0,e:"A real, bounded weakness plus the concrete correction you've made reads as self-aware. Humble-brags ('I work too hard', 'I'm a perfectionist') are transparent and cost you credibility."},
{s:"cheatsheet-nt",l:"mid",t:"non-tech",q:"What does the R in a STAR conflict story need to contain?",o:["The outcome, quantified where possible, plus what you learned","The other person's reaction and whether they apologised","A restatement of the situation for the interviewer's benefit","The reason the conflict was someone else's fault"],c:0,e:"Situation (one sentence) → Task → Action (specific and YOU-centric) → Result. Land a metric if you have one, and close on the lesson. Skipping the result turns the story into an anecdote with no payoff."},
{s:"cheatsheet-nt",l:"mnc",t:"non-tech",q:"Why is it effective to close an interview by naming something you <i>don't</i> know about their stack?",o:["It signals humility and curiosity, and prompts them to reveal their real conventions and onboarding process","It lowers their expectations so a weak offer feels justified","It fills time so they can't ask another technical question","It shifts the conversation away from your weaknesses"],c:0,e:"Asking \"if your team uses something I haven't touched — Fastify vs Express, TypeORM vs Prisma — how do you onboard someone into your conventions?\" reads as confident humility and gets them talking about how the team actually works."},
{s:"cheatsheet-univ",l:"mid",t:"frontend backend",q:"A request is authenticated but the user lacks permission for this resource. Which status code?",o:["403 Forbidden","401 Unauthorized","404 Not Found","422 Unprocessable Entity"],c:0,e:"401 = we don't know who you are (missing/bad token). 403 = we know exactly who you are and you still can't have it. Some APIs deliberately return 404 instead of 403 to avoid leaking resource existence."},
{s:"cheatsheet-univ",l:"mid",t:"frontend backend",q:"Which HTTP method is NOT idempotent?",o:["PATCH","PUT","DELETE","GET"],c:0,e:"GET, PUT, DELETE, HEAD and OPTIONS are idempotent — repeating them lands the same final state. POST is not (each call creates another resource) and PATCH generally isn't either, since a patch like <code>{balance: balance + 10}</code> compounds. Idempotency keys are how you make POST safe to retry."},
{s:"cheatsheet-univ",l:"mid",t:"frontend backend",q:"Which <code>Cache-Control</code> directive is correct for a response containing PII?",o:["<code>no-store</code>","<code>no-cache</code>","<code>private, max-age=0</code>","<code>immutable</code>"],c:0,e:"<code>no-store</code> means never write this to any cache, anywhere. <code>no-cache</code> is the confusing one — it <b>does</b> store the response, it just revalidates before reuse. For SSNs and account data you want <code>no-store</code>."},
{s:"cheatsheet-univ",l:"mid",t:"frontend backend",q:"Which cookie flag specifically mitigates token theft via XSS?",o:["<code>HttpOnly</code>","<code>Secure</code>","<code>SameSite=Lax</code>","<code>Domain</code>"],c:0,e:"<code>HttpOnly</code> makes the cookie invisible to <code>document.cookie</code>, so injected JS can't read it. <code>Secure</code> forces HTTPS-only transmission; <code>SameSite</code> is the CSRF control. They defend different attacks — name the right one."},
{s:"cheatsheet-univ",l:"mid",t:"frontend backend",q:"What does <code>Promise.any</code> do that <code>Promise.race</code> does not?",o:["It resolves on the first <b>fulfilled</b> promise, ignoring rejections","It waits for every promise regardless of outcome","It cancels the losing promises","It preserves input order in the resolved value"],c:0,e:"<code>all</code> = wait for all, fail fast. <code>allSettled</code> = wait for all, never reject. <code>race</code> = first to <b>settle</b>, success or failure. <code>any</code> = first to <b>fulfil</b>; it only rejects if every input rejects (with an <code>AggregateError</code>)."},
{s:"cheatsheet-univ",l:"mid",t:"frontend backend",q:"Why does a <code>var</code> loop counter break callbacks, while <code>let</code> works?",o:["<code>var</code> is function-scoped so every callback closes over the same binding; <code>let</code> creates a fresh binding per iteration","<code>var</code> is hoisted to the top of the file, escaping the function entirely","<code>let</code> copies the value into the callback by value","<code>var</code> callbacks execute synchronously, so the loop has already finished"],c:0,e:"With <code>var</code>, all callbacks share one variable that holds the final value by the time they run. <code>let</code> gets a new binding each iteration — the pre-ES6 workaround was an IIFE to capture the value."},
{s:"cheatsheet-univ",l:"mid",t:"frontend backend",q:"What is the Temporal Dead Zone?",o:["The window where a <code>let</code>/<code>const</code> binding is hoisted but unreachable until its declaration executes","The period after a promise settles but before its <code>.then</code> runs","The gap between a <code>setTimeout(0)</code> being queued and firing","The scope where <code>this</code> is <code>undefined</code> in strict mode"],c:0,e:"<code>let</code> and <code>const</code> <b>are</b> hoisted, but accessing them before the declaration line throws a <code>ReferenceError</code> rather than yielding <code>undefined</code> the way <code>var</code> does. That gap is the TDZ."},
{s:"cheatsheet-univ",l:"mid",t:"frontend backend",q:"When is <code>==</code> the idiomatic choice over <code>===</code>?",o:["<code>x == null</code>, to test for null or undefined in one comparison","When comparing a string to a number you know is numeric","When comparing two objects for structural equality","Never — <code>==</code> is deprecated in modern JS"],c:0,e:"<code>x == null</code> is true for exactly <code>null</code> and <code>undefined</code> — a genuinely useful idiom. Everywhere else, prefer <code>===</code>. Object comparison needs <code>lodash.isEqual</code> or a manual deep compare; <code>===</code> is reference equality."},
{s:"intro",l:"startup",t:"non-tech",q:"What is the recommended structure for \"Tell me about yourself\"?",o:["Present → Past → Future, under 90 seconds, ending with why you're interviewing","Chronological from your first internship to today","Education → certifications → hobbies → career goals","A list of every technology you've used, ranked by proficiency"],c:0,e:"Present (what you do now and your strengths) → Past (relevant prior roles) → Future (what you're looking for and why them). Keeping it under 90 seconds and landing on the 'why you' is what separates a crisp answer from a ramble."},
{s:"intro",l:"startup",t:"non-tech",q:"What is the right framing for \"why are you leaving your current company?\"",o:["Credit what you gained there, then point at a specific growth or scale you want next","Explain honestly that the pay was below market and management was weak","Say you're not actively looking and only responded to their recruiter","Focus on how much you disliked the codebase you inherited"],c:0,e:"Never bash your employer — interviewers hear it as how you'll one day talk about them. Acknowledge the growth (Antino: Developer → Senior in 18 months, fintech/healthcare/AI exposure), then name the concrete thing you want next and why <b>their</b> product offers it."},
{s:"intro",l:"mid",t:"non-tech",q:"In the TimeMoney STAR story, what is the Result?",o:["30% faster page loads, zero production auth incidents, 20% faster feature shipping","A migration from REST to GraphQL across three services","SEBI certification for the platform","A 40% reduction in AWS spend"],c:0,e:"S: SEBI-regulated data, 5s polling causing stale dashboards. T: own the multi-framework migration. A: Svelte (marketing), Astro (islands), Next.js App Router (auth app), SSE replacing polling, JWT + Cognito + Pinpoint MFA, shared component library. R: ~30% faster loads, zero auth incidents, 20% faster shipping."},
{s:"intro",l:"mid",t:"non-tech",q:"In the SSE-vs-polling disagreement story, what actually resolved the conflict?",o:["A small POC showing ~40% lower server load and sub-second updates","Escalating the decision to the engineering manager","Deferring to the teammate since he owned the backend","Citing the SSE specification in a design doc"],c:0,e:"The lesson to land is <b>disagreements are resolved with data, not opinions</b>. Running the POC, then walking him through EventSource, reconnection, and nginx proxy buffering — and pairing on the implementation — turns a disagreement into shared ownership."},
{s:"intro",l:"mnc",t:"non-tech",q:"Which is the strongest \"tell me about a time you failed\" answer?",o:["Shipping a Mongo schema change without an index, causing dashboard timeouts — rolled back, added a compound index, and adopted a schema-change checklist","\"I once worked so hard on a feature that I burned out\"","\"My team missed a deadline because QA was under-resourced\"","\"I haven't had a failure significant enough to be worth describing\""],c:0,e:"A real, bounded, recovered failure with a durable process change is the goal. Fake failures ('I work too hard') and blame-shifting ('QA was under-resourced') both read as evasion. The checklist — index strategy, <code>explain()</code> plan, staging load test — is what makes it convincing."},
{s:"javascript",l:"startup",t:"frontend backend",q:"Which statement about <code>const</code> is accurate?",o:["The binding can't be reassigned, but the object or array it points to is still mutable","The value is deeply frozen and cannot change","It behaves identically to <code>var</code> inside a function body","It can be re-declared in the same block"],c:0,e:"<code>const arr = [1,2]; arr.push(3)</code> works — you mutated the array. <code>arr = [4]</code> throws a <code>TypeError</code> — you tried to rebind. For genuine immutability you need <code>Object.freeze</code> (and even that is shallow)."},
{s:"javascript",l:"startup",t:"frontend backend",q:"What does this print?<br><code>console.log('1'); setTimeout(()=>console.log('2'),0); Promise.resolve().then(()=>console.log('3')); console.log('4');</code>",o:["1, 4, 3, 2","1, 2, 3, 4","1, 4, 2, 3","1, 3, 4, 2"],c:0,e:"Synchronous code first (1, 4). Then the microtask queue drains completely (3 — Promise callbacks). Only then does a macrotask run (2 — <code>setTimeout</code>). Microtasks always beat macrotasks, regardless of a 0ms delay."},
{s:"javascript",l:"startup",t:"frontend backend",q:"Which is a genuine real-world use of closures?",o:["Debounce/throttle utilities holding a private timer across calls","Making a function's parameters immutable","Allowing a function to be called before it is defined","Automatically binding <code>this</code> to the global object"],c:0,e:"A closure is a function plus its retained lexical scope. Debounce keeps a private <code>timer</code> that survives between invocations; React's <code>useState</code> uses the same mechanism internally to remember state across renders. Also used for data privacy and currying."},
{s:"javascript",l:"mid",t:"frontend backend",q:"Why is <code>NaN === NaN</code> false?",o:["IEEE 754 defines NaN as not equal to any value, including itself","<code>===</code> compares by reference and each NaN is a distinct object","NaN is coerced to <code>undefined</code> before comparison","It's a long-standing V8 bug kept for compatibility"],c:0,e:"NaN is the only JavaScript value not equal to itself, per IEEE 754. Test with <code>Number.isNaN(x)</code> (no coercion) or <code>Object.is(x, NaN)</code>. Avoid the global <code>isNaN()</code>, which coerces — <code>isNaN('foo')</code> is <code>true</code>."},
{s:"javascript",l:"mid",t:"frontend backend",q:"Which capability belongs to TypeScript <code>interface</code> but NOT to <code>type</code>?",o:["Declaration merging — re-opening the same name to add members","Union types","Mapped types","Tuple types"],c:0,e:"Declaring <code>interface User</code> twice merges the members; a <code>type</code> alias cannot be re-opened. Conversely, unions, intersections, tuples, mapped and conditional types are <code>type</code>-only. Rule of thumb: <code>interface</code> for public object/class shapes, <code>type</code> for unions and utilities."},
{s:"javascript",l:"mid",t:"frontend backend",q:"What do generics give you that <code>any</code> does not?",o:["The relationship between input and output types is preserved, so call sites stay fully typed","Faster runtime performance through monomorphisation","Automatic runtime validation of the returned shape","Smaller compiled JavaScript output"],c:0,e:"<code>async function apiGet&lt;T&gt;(url: string): Promise&lt;T&gt;</code> lets <code>apiGet&lt;Portfolio&gt;('/api/portfolio')</code> return a fully-typed <code>Portfolio</code>. With <code>any</code> you'd lose every downstream check. Note generics are erased at runtime — they validate nothing; that's Zod's job."},
{s:"javascript",l:"mnc",t:"frontend backend",q:"What is the behavioural difference between debounce and throttle?",o:["Debounce fires once after N ms of inactivity; throttle fires at most once per N ms during activity","Debounce fires immediately then blocks; throttle always delays the first call","Debounce drops calls; throttle queues and replays every call","They are the same — throttle is just the older name"],c:0,e:"Debounce suits a search input: wait until the user stops typing. Throttle suits a scroll or resize handler: guarantee a steady maximum rate while the event keeps firing. Picking the wrong one is a common interview stumble."},
{s:"javascript",l:"mnc",t:"frontend backend",q:"When hand-rolling <code>Promise.all</code>, why must you write results into <code>results[i]</code> rather than pushing?",o:["Results must preserve input order, and promises settle out of order","<code>push</code> is slower on large arrays","<code>push</code> would trigger array reallocation and lose the type","Pushing causes the promise to resolve before all inputs settle"],c:0,e:"<code>Promise.all</code> guarantees the output array matches the <b>input</b> order, not the settle order. Indexing by <code>i</code> preserves it. You also need the empty-array early return (<code>resolve([])</code>) and a <code>completed</code> counter — the first rejection short-circuits the whole thing."},
{s:"javascript",l:"mnc",t:"frontend backend",q:"Where do methods defined inside an ES6 <code>class</code> actually live?",o:["On <code>Class.prototype</code>, shared by every instance","On each instance, copied at construction time","In a hidden module-level closure","On <code>Object.prototype</code>, so all objects inherit them"],c:0,e:"Classes are syntactic sugar over prototypal inheritance. Methods sit on <code>Class.prototype</code> and are shared; property lookup walks the <code>[[Prototype]]</code> chain (<code>Object.getPrototypeOf()</code>) until it finds the key or hits <code>null</code>. Only fields assigned in the constructor are per-instance."},
{s:"javascript",l:"startup",t:"frontend backend",q:"<code>console.log(x); var x = 5;</code> prints <code>undefined</code>, but <code>console.log(y); let y = 5;</code> throws. Why?",o:["<code>var</code> is hoisted and initialised to <code>undefined</code>; <code>let</code> is hoisted but uninitialised (TDZ)","<code>var</code> is hoisted; <code>let</code> is not hoisted at all","<code>let</code> is evaluated at runtime while <code>var</code> is evaluated at compile time","<code>let</code> requires an explicit initialiser, <code>var</code> does not"],c:0,e:"Both are hoisted — the difference is initialisation. <code>var</code> gets <code>undefined</code> immediately; <code>let</code>/<code>const</code> sit in the Temporal Dead Zone and throw a <code>ReferenceError</code> until the declaration line runs. Function <i>declarations</i> hoist fully and are callable before their definition."},
{s:"javascript",l:"startup",t:"frontend backend",q:"Which <code>this</code>-binding rule wins when a regular function is called as <code>obj.method()</code>?",o:["Implicit binding — <code>this</code> is <code>obj</code>","Default binding — <code>this</code> is <code>undefined</code> in strict mode","Lexical binding — <code>this</code> comes from the enclosing scope","<code>new</code> binding — <code>this</code> is a fresh object"],c:0,e:"Precedence: <code>new</code> &gt; explicit (<code>call</code>/<code>apply</code>/<code>bind</code>) &gt; implicit (<code>obj.method()</code>) &gt; default. Arrow functions sit outside this system entirely — they inherit <code>this</code> lexically and cannot be re-bound, which is exactly why <code>.bind()</code> on an arrow is a no-op."},
{s:"javascript",l:"mid",t:"frontend backend",q:"<code>const b = {...a}</code> then <code>b.nested.y = 99</code>. What happens to <code>a.nested.y</code>?",o:["It becomes 99 — spread is a shallow copy, so <code>nested</code> is the same reference","It stays unchanged — spread deep-clones the object","It becomes <code>undefined</code> — the reference is severed","A <code>TypeError</code> is thrown for mutating a spread result"],c:0,e:"Spread copies only the top level; nested objects are shared references. For a true deep copy use <code>structuredClone(a)</code> (built-in, handles cycles). <code>JSON.parse(JSON.stringify(a))</code> works but silently drops <code>undefined</code>, functions, and turns <code>Date</code> into a string."},
{s:"javascript",l:"mid",t:"frontend backend",q:"Which array method folds a list down to a single value?",o:["<code>reduce</code>","<code>map</code>","<code>filter</code>","<code>forEach</code>"],c:0,e:"<code>map</code> transforms each element and returns an array of the <b>same length</b>. <code>filter</code> keeps matches, returning a shorter array. <code>reduce</code> folds to one value — a sum, a grouped object, anything. <code>forEach</code> returns nothing and exists only for side effects."},
{s:"javascript",l:"mid",t:"frontend backend",q:"Which TypeScript utility type makes every property of <code>User</code> optional?",o:["<code>Partial&lt;User&gt;</code>","<code>Pick&lt;User, keyof User&gt;</code>","<code>Readonly&lt;User&gt;</code>","<code>Record&lt;keyof User, unknown&gt;</code>"],c:0,e:"<code>Partial</code> = all optional (ideal for PATCH payloads). <code>Pick&lt;User,'id'|'name'&gt;</code> selects a subset, <code>Omit&lt;User,'email'&gt;</code> removes one, <code>Record&lt;'admin'|'user', string[]&gt;</code> builds a keyed map, <code>Readonly</code> freezes at the type level."},
{s:"javascript",l:"mnc",t:"frontend backend",q:"What does <code>infer</code> do in <code>type ReturnType&lt;T&gt; = T extends (...args:any[]) =&gt; infer R ? R : never</code>?",o:["It captures the matched type into a new type variable R usable in the true branch","It asserts at runtime that T is a function","It defers type resolution until the value is constructed","It widens R to <code>any</code> to avoid a circular reference"],c:0,e:"<code>infer</code> introduces a placeholder that TypeScript unifies during conditional-type matching. Same trick unwraps promises: <code>T extends Promise&lt;infer U&gt; ? U : T</code>. It's compile-time only — nothing survives to runtime."},
{s:"react",l:"startup",t:"frontend",q:"Why is diffing an in-memory tree cheaper than touching the real DOM?",o:["Real DOM mutations trigger layout and paint; diffing plain JS objects does neither","JS objects are stored on the GPU, so comparison is parallelised","The real DOM is synchronous while the Virtual DOM is asynchronous","Browsers rate-limit DOM reads to 60 per second"],c:0,e:"Each real DOM mutation can force style recalculation, layout and paint. React builds a new VDOM, reconciles it against the previous one, and flushes a minimal, batched set of mutations — fewer and better-grouped writes."},
{s:"react",l:"startup",t:"frontend",q:"When does a <code>useEffect</code> cleanup function run?",o:["Before the next effect run, and on unmount","Only on unmount","Immediately after the effect body, synchronously","Only when the dependency array is empty"],c:0,e:"Cleanup runs before each re-run of the effect <b>and</b> at unmount. That's why subscriptions look like <code>return () =&gt; sub.unsubscribe()</code> — when <code>userId</code> changes, the old subscription is torn down before the new one is created."},
{s:"react",l:"mid",t:"frontend",q:"What does <code>React.memo</code> do that <code>useMemo</code> does not?",o:["It skips a child component's re-render when its props are shallow-equal","It caches the result of an expensive calculation","It prevents the parent from re-rendering","It memoises a function reference across renders"],c:0,e:"<code>React.memo</code> wraps a <b>component</b> and compares props. <code>useMemo</code> caches a <b>value</b>, <code>useCallback</code> caches a <b>function identity</b>. They're usually used together: <code>useCallback</code> keeps the prop stable so <code>React.memo</code>'s shallow check actually passes."},
{s:"react",l:"mid",t:"frontend",q:"Which change did NOT contribute to the ~30% TimeMoney page-load win?",o:["Migrating the database from MongoDB to PostgreSQL","Splitting bloated context providers so unrelated subtrees stopped re-rendering","Code-splitting heavy chart panels via dynamic imports","Streaming SSR of the dashboard shell so skeletons appeared immediately"],c:0,e:"The wins compounded on the frontend: React Profiler to find wasted renders (<code>React.memo</code>, <code>useCallback</code>, context splitting), lifting and deduping fetches into React Query, dynamic imports for recharts/d3, <code>next/image</code> with AVIF/WebP, and streaming SSR."},
{s:"react",l:"mid",t:"frontend",q:"Which Next.js rendering strategy rebuilds a static page in the background after a revalidation window?",o:["ISR — Incremental Static Regeneration","SSG — Static Site Generation","SSR — Server-Side Rendering","CSR — Client-Side Rendering"],c:0,e:"SSG builds once at build time (fastest, great for marketing). SSR renders per request (needed for personalised/auth pages, slower TTFB). ISR is the middle ground — serve static, regenerate in the background after <code>revalidate</code> seconds. CSR ships a shell and hydrates."},
{s:"react",l:"mid",t:"frontend",q:"In the Next.js App Router, what is a component by default?",o:["A Server Component — you must add <code>'use client'</code> to opt into interactivity","A Client Component — you add <code>'use server'</code> to move it to the server","Isomorphic — it runs in both environments automatically","Static — it is pre-rendered unless you export <code>dynamic</code>"],c:0,e:"App Router (Next 13+) is server-first: RSC by default, nested layouts, streaming, parallel and intercepting routes, server actions. That shrinks the client bundle, but anything with state or event handlers needs the <code>'use client'</code> directive."},
{s:"react",l:"mnc",t:"frontend",q:"Which is a hard limitation of React Server Components?",o:["No <code>useState</code>, no event handlers, no browser APIs","They cannot query a database directly","They always increase the client JS bundle","They cannot be nested inside Client Components"],c:0,e:"RSCs render on the server and ship a serialised payload, not JS — so zero-bundle dependencies and direct DB/filesystem access. The trade is no state, no handlers, no <code>window</code>. Compose them with <code>'use client'</code> islands for interactivity."},
{s:"react",l:"mnc",t:"frontend",q:"Where should server state (API data, cache, revalidation) live?",o:["React Query / SWR — not Redux","Redux Toolkit, as the single source of truth","React Context, so any component can read it","<code>useState</code> lifted to the nearest common ancestor"],c:0,e:"Match the tool to the state: local UI → <code>useState</code>/<code>useReducer</code>; server state → React Query/SWR (caching, revalidation, dedup come free); global UI state → Zustand/Jotai/Context; complex derived client state → Redux Toolkit. Moving TimeMoney modules to React Query + Zustand cut ~70% of the boilerplate."},
{s:"react",l:"mid",t:"frontend",q:"Which trade-off correctly describes uncontrolled components?",o:["Less boilerplate and fewer re-renders, but harder to validate on every keystroke","More boilerplate, but a single source of truth","Identical to controlled, except they require <code>useRef</code>","They cannot be used inside a <code>&lt;form&gt;</code> element"],c:0,e:"Controlled: <code>&lt;input value={x} onChange={...}/&gt;</code> — React owns the value, easy validation, a re-render per keystroke. Uncontrolled: <code>&lt;input defaultValue ref={r}/&gt;</code> — the DOM owns it, read on submit. That's exactly why React Hook Form uses the uncontrolled approach for large forms."},
{s:"react",l:"mid",t:"frontend",q:"Why store an interval id in <code>useRef</code> rather than <code>useState</code>?",o:["Mutating a ref doesn't trigger a re-render — a timer id isn't rendered output","Refs persist across unmounts while state does not","<code>useState</code> cannot hold numbers returned by <code>setInterval</code>","Refs are synchronous while state updates are batched"],c:0,e:"<code>useRef</code> is a mutable box whose <code>.current</code> survives renders without causing one. Use it for DOM nodes, timer handles, previous values, and instance-like variables. If changing the value should update the UI, that's <code>useState</code>."},
{s:"react",l:"mid",t:"frontend",q:"In a <code>useDebounce</code> hook, why does the effect return <code>() => clearTimeout(t)</code>?",o:["Each new value cancels the pending timer, so only the last value after the quiet period is committed","It prevents a memory leak but has no effect on the debounce behaviour","It forces React to flush the state update synchronously","It resets the debounce delay to its default"],c:0,e:"Without the cleanup, every keystroke would schedule its own timeout and they'd all fire. Cleanup runs before the next effect, cancelling the superseded timer — that <i>is</i> the debounce. Same pattern powers <code>useOnClickOutside</code>, <code>useMediaQuery</code>, and friends."},
{s:"react",l:"mid",t:"frontend",q:"What can an Error Boundary NOT catch?",o:["Errors thrown in event handlers and async callbacks","Errors thrown during a child's render","Errors thrown in a child's <code>componentDidMount</code>","Errors thrown in a child's constructor"],c:0,e:"Boundaries catch errors during render and lifecycle in the child tree via <code>getDerivedStateFromError</code> (render fallback) and <code>componentDidCatch</code> (log to Sentry). Event handlers, async code, and SSR errors need explicit <code>try/catch</code>. Hooks still can't declare a boundary — use a class or <code>react-error-boundary</code>."},
{s:"react",l:"mnc",t:"frontend",q:"What does <code>startTransition</code> accomplish in React 18?",o:["It marks an update as non-urgent so React can interrupt it and keep typing responsive","It moves the update to a Web Worker","It batches multiple <code>setState</code> calls into one render","It delays the update by a fixed number of milliseconds"],c:0,e:"Concurrent React can interrupt a low-priority render. Keep <code>setFilter(e.target.value)</code> urgent so the input stays snappy, and wrap the expensive <code>setResults(heavyFilter(...))</code> in <code>startTransition</code>. <code>isPending</code> drives a spinner; <code>useDeferredValue</code> does the same for derived values."},
{s:"react",l:"mnc",t:"frontend",q:"Which of these reliably causes a hydration mismatch?",o:["Calling <code>Date.now()</code> or <code>Math.random()</code> during render","Fetching data inside <code>useEffect</code>","Using <code>React.memo</code> on a server-rendered component","Passing an inline arrow function as a prop"],c:0,e:"Hydration attaches handlers to server HTML and expects the markup to match. Non-deterministic values (<code>Date.now()</code>, <code>Math.random()</code>), reading <code>window</code>/<code>localStorage</code> in render, and timezone-dependent formatting all differ across the boundary. Gate browser-only code in <code>useEffect</code>; <code>suppressHydrationWarning</code> is a last resort."},
{s:"node",l:"startup",t:"backend",q:"How does single-threaded Node handle thousands of concurrent I/O operations?",o:["I/O is offloaded to libuv's thread pool and the OS; the event loop runs the callbacks on the main thread","Node spawns one OS thread per incoming request","V8 internally parallelises <code>await</code> expressions","Each Promise runs on its own microtask thread"],c:0,e:"JS execution is single-threaded, but file, DNS and crypto work goes to libuv's thread pool while network I/O uses OS primitives (epoll/kqueue). The loop polls for completion and runs your callback. CPU-bound work has no such escape hatch — it blocks, so reach for <code>worker_threads</code>."},
{s:"node",l:"startup",t:"backend",q:"How does Express recognise an error-handling middleware?",o:["It has four parameters: <code>(err, req, res, next)</code>","It is registered with <code>app.onError()</code>","It returns a rejected Promise","It is placed before all route handlers"],c:0,e:"Express inspects function arity — four parameters marks it as error middleware, and it must be registered <b>after</b> your routes. Normal middleware is <code>(req, res, next)</code>: call <code>next()</code> to continue, or send a response to short-circuit the chain."},
{s:"node",l:"mid",t:"backend",q:"What was the primary driver for moving RxMen from Express to NestJS?",o:["Modular architecture with DI giving clear boundaries between appointments, payments and patient records","Better raw request throughput than Express","Built-in support for MongoDB aggregation pipelines","Native WebSocket support that Express lacks"],c:0,e:"At 5+ modules and 10k+ monthly requests, minimal Express meant re-inventing structure per project. NestJS brought modules + DI, first-class TypeScript (DTOs, decorators, class-validator), trivially mockable dependencies, and convention over config — onboarding dropped from weeks to days, ~25% less complexity."},
{s:"node",l:"mid",t:"backend",q:"What is the main testing benefit of NestJS constructor-based DI?",o:["Dependencies can be swapped for mocks via the IoC container without touching the class","It removes the need for integration tests","It automatically generates test fixtures from DTOs","It makes every provider a singleton, so tests share state"],c:0,e:"Because <code>AppointmentsService</code> receives its repository and mailer through the constructor, a test module can provide fakes instead. That also makes the dependency graph explicit and lets you swap implementations per environment."},
{s:"node",l:"mid",t:"backend",q:"Why doesn't Express catch a rejected promise thrown inside an <code>async</code> route handler?",o:["Express predates async/await and only forwards errors passed to <code>next(err)</code>","The promise resolves on a different event loop phase","<code>async</code> handlers are executed outside the middleware chain","Express swallows all errors in production mode"],c:0,e:"An unhandled rejection never reaches the error middleware. Either <code>try/catch</code> and call <code>next(err)</code>, or wrap: <code>const asyncHandler = fn =&gt; (req,res,next) =&gt; Promise.resolve(fn(req,res,next)).catch(next)</code>. Express 5 finally handles this natively."},
{s:"node",l:"mnc",t:"backend",q:"Which is a prerequisite for horizontally scaling a Node service?",o:["Statelessness — sessions in JWT or Redis, never in process memory","Running the <code>cluster</code> module inside every container","Switching from Express to Fastify","Enabling HTTP/2 on the load balancer"],c:0,e:"In-memory session state breaks the moment a second replica exists — requests hit the wrong process. Externalise it. Then: containerise, load-balance, add caching layers (Redis/CDN/in-process LRU), push heavy work to a queue (SQS/BullMQ), pool DB connections, and instrument p50/p95/p99."},
{s:"node",l:"mnc",t:"backend",q:"Why prefer <code>setImmediate</code> over <code>process.nextTick</code> for deferring work?",o:["<code>nextTick</code> drains before the loop continues and can starve I/O if used recursively","<code>setImmediate</code> has higher timer resolution","<code>nextTick</code> is deprecated in Node 20","<code>setImmediate</code> runs on a separate thread"],c:0,e:"<code>process.nextTick</code> callbacks run before the event loop advances to the next phase — recursive use starves I/O entirely. <code>setImmediate</code> fires in the Check phase, after the current iteration's I/O callbacks, which is the safer default."},
{s:"node",l:"mid",t:"backend",q:"Which stream type modifies data as it passes through?",o:["Transform","Duplex","Readable","Writable"],c:0,e:"Readable = source, Writable = sink, Duplex = both with independent channels (a TCP socket), Transform = a Duplex where output is a function of input (<code>zlib</code>, <code>crypto</code>). Compose with <code>pipeline()</code> — it propagates errors and handles backpressure, which raw <code>.pipe()</code> does not."},
{s:"node",l:"mid",t:"backend",q:"What is the main advantage of presigned S3 URLs for uploads?",o:["The client uploads directly to S3 — your server never handles the bytes","They compress the file before transfer","They eliminate the need for MIME-type validation","They allow uploads larger than S3's object size limit"],c:0,e:"Presigned URLs keep large payloads off your Node process entirely — no memory pressure, no bandwidth cost. Still validate: check MIME type <b>and</b> magic bytes (never trust the extension), cap size, and virus-scan asynchronously via an S3 event → ClamAV Lambda for sensitive uploads."},
{s:"node",l:"mid",t:"backend",q:"How does NestJS turn a thrown exception into an HTTP response?",o:["An exception filter catches it and maps <code>HttpException</code> subclasses to their status codes","Each controller must wrap its handlers in <code>try/catch</code>","The DI container intercepts constructor errors only","Errors bubble to Express's default handler unchanged"],c:0,e:"Throw <code>NotFoundException</code>, <code>BadRequestException</code>, or any <code>HttpException</code> anywhere in the stack. A global <code>@Catch()</code> filter reads <code>exception.getStatus()</code> for known types and falls back to 500 for everything else, giving you one consistent error shape."},
{s:"node",l:"mnc",t:"backend",q:"What is the most common production hazard with EventEmitter?",o:["Listeners are easy to leak and failures are silent","Emitting is synchronous, so it blocks the event loop for seconds","Events are delivered out of order under load","It cannot carry more than one argument per event"],c:0,e:"EventEmitter buys decoupling at the cost of observability: a typo'd event name simply never fires, listeners accumulate if you forget to <code>off()</code>, and typing is awkward. Returning an unsubscribe function from <code>on()</code> — as in the sample implementation — makes cleanup much harder to forget."},
{s:"db",l:"startup",t:"databases",q:"What is the sensible default when choosing between Postgres and MongoDB today?",o:["Default to Postgres unless you have a genuine document use case — JSONB has narrowed the gap","Default to MongoDB for anything that might need to scale horizontally","Always match whatever the previous project used","Use MongoDB for reads and Postgres for writes"],c:0,e:"Postgres for relationships, ACID and complex joins — RxMen used it for appointments and payments because both demand strong consistency. Mongo for fast-evolving document shapes — Evify used it for rider/order data. With JSONB + GIN, Postgres now covers many document workloads outright."},
{s:"db",l:"mid",t:"databases",q:"Why did the RxMen schema use <code>deleted_at</code> soft deletes for medical records?",o:["Compliance — regulated records must remain recoverable and auditable","Soft deletes are faster than <code>DELETE</code> on indexed tables","It avoids foreign-key cascade errors","It reduces index bloat over time"],c:0,e:"Healthcare data can't simply vanish. The rest of the design: 3NF with foreign keys, TypeORM entities as the single source of truth, indexes on <code>patient_id</code>, <code>appointment_date</code> and composite <code>(doctor_id, date)</code> for slot lookups, and git-versioned migrations — never manual prod DDL."},
{s:"db",l:"mid",t:"databases",q:"Why is <code>OFFSET</code>-based pagination a problem on large tables?",o:["The database must scan and discard every skipped row, so deep pages get progressively slower","<code>OFFSET</code> ignores indexes entirely","<code>OFFSET</code> locks the rows it skips","Results can exceed the maximum result set size"],c:0,e:"<code>OFFSET 100000</code> still reads 100,000 rows before returning anything. Keyset (seek) pagination — <code>WHERE id &gt; :last_id ORDER BY id LIMIT 20</code> — stays constant-time. Start any slow-query investigation with <code>EXPLAIN ANALYZE</code> and look for sequential scans on big tables."},
{s:"db",l:"mid",t:"databases",q:"In a MongoDB aggregation pipeline, why should <code>$match</code> come before <code>$lookup</code>?",o:["It shrinks the document set first, so the expensive join runs over far fewer documents","<code>$lookup</code> is only valid as the first stage","<code>$match</code> can only use an index if it is the first stage","<code>$lookup</code> discards any <code>$match</code> applied after it"],c:0,e:"Each stage feeds the next, so filtering early is the single biggest pipeline win — and an early <code>$match</code> can use an index. The ERoomRent ranking pipeline was <code>$match</code> → <code>$lookup</code> → <code>$addFields</code> (weighted score) → <code>$sort</code> → <code>$limit</code>, cutting lookup time ~10%."},
{s:"db",l:"mnc",t:"databases",q:"Which workload genuinely tolerates BASE rather than ACID?",o:["A recommendation engine where slightly stale insights are acceptable","Portfolio transactions on a SEBI-regulated platform","Payment capture and settlement","Appointment slot booking with limited capacity"],c:0,e:"ACID is mandatory wherever money, inventory or regulated records are involved — TimeMoney's portfolio transactions have no tolerance for anomalies. BASE trades strict consistency for availability and scale, which is fine for feeds, recommendations and analytics."},
{s:"db",l:"mnc",t:"databases",q:"What is the expand-and-contract migration pattern?",o:["Add the new column → backfill → switch reads → drop the old column, across separate releases","Expand the connection pool during migration, then contract it after","Duplicate the table, migrate, then rename in a single transaction","Widen every column to <code>TEXT</code>, migrate data, then narrow the types"],c:0,e:"Each step is independently safe and reversible, and for one release the application handles both shapes — so a rollback never strands you. Pair it with <code>CREATE INDEX CONCURRENTLY</code>, avoid blocking DDL during business hours, and rehearse on production-scale data in staging."},
{s:"auth",l:"startup",t:"backend",q:"What is the single most important thing to remember about JWT payloads?",o:["They are signed, not encrypted — anyone can base64-decode and read them","They are encrypted with the server's secret key","They are compressed, so large payloads are safe","They cannot exceed 256 bytes"],c:0,e:"<code>header.payload.signature</code>, each base64url-encoded. The signature proves integrity and authenticity — it does <b>not</b> hide anything. Never put passwords, keys or sensitive PII in the claims. On verify, recompute the signature and check <code>exp</code>, <code>iss</code> and <code>aud</code>."},
{s:"auth",l:"startup",t:"backend",q:"Cognito verifies the login; an RBAC middleware then checks the user's role. Which is which?",o:["Cognito = authentication (who you are); RBAC = authorization (what you may do)","Cognito = authorization; RBAC = authentication","Both are authentication; authorization happens at the database","Both are authorization; authentication is the TLS handshake"],c:0,e:"AuthN answers <i>who are you</i> — login, password, MFA. AuthZ answers <i>what can you do</i> — RBAC/ABAC checks. At Evify that split was Cognito for AuthN plus middleware mapping JWT claims to route guards for Delivery Partner / Technician / Admin."},
{s:"auth",l:"mid",t:"backend",q:"What is the recommended JWT storage strategy used at TimeMoney?",o:["Short-lived access token in memory; refresh token in an <code>httpOnly</code> + <code>Secure</code> + <code>SameSite=Strict</code> cookie","Both tokens in <code>localStorage</code> for easy access across tabs","Both tokens in a single non-<code>httpOnly</code> cookie","Access token in <code>sessionStorage</code>, refresh token in a URL query parameter"],c:0,e:"<code>localStorage</code> is readable by any injected script, so XSS means token theft. An <code>httpOnly</code> cookie is invisible to JS but needs CSRF protection (<code>SameSite</code> + a CSRF token for cross-origin POSTs). Keeping the access token in memory means a stolen page has nothing durable to steal; silent refresh restores it."},
{s:"auth",l:"mid",t:"backend",q:"In the TimeMoney auth flow, what triggers AWS Pinpoint?",o:["Cognito returning an SMS MFA challenge, which the backend fulfils by sending an OTP","The initial <code>POST /auth/login</code>, before credentials are checked","A 401 on any protected route, to notify the user","The refresh-token rotation endpoint"],c:0,e:"Flow: login → Cognito verifies credentials → Cognito issues an MFA challenge → backend triggers Pinpoint to send the OTP → user submits it → Cognito returns ID/access/refresh tokens → backend mints its own short-lived JWT with RBAC claims and sets the refresh cookie. Result: zero auth incidents in production."},
{s:"auth",l:"mid",t:"backend",q:"Why check permissions rather than roles in access-control middleware?",o:["Permissions let you change who can do what without editing every route","Roles cannot be encoded in a JWT payload","Permission checks are faster than role lookups","Roles are deprecated in OAuth 2.1"],c:0,e:"<code>requireRole('admin')</code> hard-codes policy into routes, so every org-chart change is a code change. Granting a route a permission like <code>orders:write</code> and mapping roles→permissions in data means new roles ship without touching handlers. Either way, return <b>403</b> — the caller is authenticated, just not allowed."},
{s:"auth",l:"mnc",t:"backend",q:"Which OAuth 2.0 flow is correct for a browser SPA?",o:["Authorization Code with PKCE","Implicit flow","Client Credentials","Resource Owner Password Credentials"],c:0,e:"A SPA is a public client — it cannot hold a secret. PKCE adds a per-request code verifier/challenge so an intercepted authorization code is useless. Implicit is deprecated (tokens land in the URL), Client Credentials is server-to-server with no user, and password grant defeats the point of OAuth."},
{s:"auth",l:"mnc",t:"backend",q:"How do OAuth 2.0 and JWT relate?",o:["OAuth is an authorization framework; JWT is a token format OAuth often uses for access tokens","They are competing standards for the same problem","JWT is the successor to OAuth 2.0","OAuth requires JWT; a JWT cannot be used outside OAuth"],c:0,e:"They operate at different layers. OAuth defines the <i>flows</i> by which a third party gets delegated access without seeing credentials ('Login with Google'). JWT defines a compact signed <i>token format</i>. An OAuth access token may be a JWT or an opaque string."},
{s:"auth",l:"mid",t:"backend",q:"A refresh token that was already used is presented again. What should the server do?",o:["Invalidate the entire token family — reuse signals theft","Issue a new access token but log a warning","Silently ignore it and return the previous access token","Extend the original token's expiry"],c:0,e:"Refresh tokens should be single-use and rotated on every refresh. Replay of a consumed token means either the client or the attacker has a stale copy — you can't tell which, so you revoke the whole family and force re-login."},
{s:"auth",l:"mid",t:"backend",q:"Why is raw SHA-256 unacceptable for storing passwords?",o:["It's fast, so an attacker can brute-force billions of guesses per second — you need a slow, salted KDF","It's reversible if you know the input length","It produces collisions too frequently for password use","It cannot handle Unicode passwords"],c:0,e:"Speed is the flaw. Use <code>bcrypt</code>, <code>argon2</code> or <code>scrypt</code> — deliberately slow and salted per-user. Keep the three concepts distinct: encoding (base64) is reversible transport, encryption (AES/RSA) is reversible with a key, hashing is one-way."},
{s:"auth",l:"mnc",t:"backend",q:"In OIDC, what is the <code>id_token</code> for?",o:["It carries the user's identity; the <code>access_token</code> is for calling APIs","It refreshes the access token when it expires","It encrypts the access token in transit","It identifies the client application, not the user"],c:0,e:"OIDC is 'OAuth for authentication' — a thin identity layer on OAuth 2.0 where the <code>id_token</code> is a JWT describing the user. SAML 2.0 is the XML-based enterprise predecessor (Okta, Azure AD); OIDC is the modern, SPA- and mobile-friendly choice."},
{s:"auth",l:"mnc",t:"backend",q:"A user changes the id in <code>/api/orders/1234</code> and sees someone else's order. Which vulnerability is this?",o:["IDOR — Insecure Direct Object Reference","CSRF","SSRF","XSS"],c:0,e:"IDOR happens when the server trusts a client-supplied identifier without re-checking ownership. Hiding the link in the UI fixes nothing — the ownership check must run server-side on every request. Related defences: parameterised queries (SQLi), <code>SameSite</code> + tokens (CSRF), outbound allow-lists (SSRF), CSP + escaping (XSS)."},
{s:"auth",l:"mnc",t:"backend",q:"What is the correct mitigation for NoSQL injection in a Mongo query?",o:["Type-check and validate input before it reaches the query — reject objects where a string is expected","Escape single quotes in all user input","Use <code>$where</code> clauses instead of query operators","Store all user input as base64"],c:0,e:"Passing <code>{\"$gt\": \"\"}</code> where you expected a string turns a lookup into a match-anything. Strict validation (Zod, class-validator) at the boundary is the fix. Escaping is a SQL-shaped answer that doesn't apply here."},
{s:"aws",l:"startup",t:"infra",q:"Which AWS service handled face matching for Evify rider punch-in?",o:["Rekognition","Cognito","SNS","Pinpoint"],c:0,e:"Rekognition is managed computer vision. In the wider stack: Cognito = user pools/auth, S3 = object storage, Lambda = serverless cron, SNS = pub/sub and SMS OTP, Pinpoint = targeted comms (SMS MFA at TimeMoney), CloudWatch = logs/metrics/alarms."},
{s:"aws",l:"mid",t:"infra",q:"In the Rekognition punch-in flow, what happens if the face similarity falls below threshold?",o:["Fall back to OTP verification via SNS","The punch-in is silently rejected","The photo is re-captured automatically up to three times","The rider is marked absent for the shift"],c:0,e:"Reference photo indexed into a Rekognition collection at onboarding; at shift start a live selfie runs through <code>SearchFacesByImage</code>. Above ~92% similarity with high confidence → punch-in; otherwise OTP fallback. A Lambda cron reconciles attendance daily and flags anomalies. Key lesson: liveness detection matters."},
{s:"aws",l:"mid",t:"infra",q:"You need a browser to upload directly to a private S3 bucket without AWS credentials. What do you use?",o:["A presigned URL","A bucket policy granting <code>s3:PutObject</code> to <code>*</code>","An IAM user with keys embedded in the frontend","A CloudFront origin access identity"],c:0,e:"A presigned URL grants time-limited access to one specific object, keeping the bucket private. Bucket policies handle cross-account or public-read cases; IAM policies govern what AWS principals can do. Never ship IAM keys to a browser."},
{s:"aws",l:"mnc",t:"infra",q:"Which change most reliably reduces Lambda cold-start latency?",o:["Initialising SDK clients and DB connections outside the handler so they're reused across invocations","Increasing the function timeout","Adding more environment variables","Enabling X-Ray tracing"],c:0,e:"Code outside the handler runs once per container, not per invocation. Beyond that: keep the package small, pick a light runtime (Node ≪ Java), use Provisioned Concurrency for latency-sensitive paths, and avoid attaching to a VPC unless you must."},
{s:"aws",l:"mnc",t:"infra",q:"Why was Cognito the right choice over Auth0 for TimeMoney?",o:["Cheap at scale with native AWS audit trails, which suited SEBI compliance","Better developer experience and a fully customisable hosted UI","It was the only option supporting SMS MFA","It removes the need for any backend auth logic"],c:0,e:"Cognito wins on cost at scale and deep AWS integration (audit trail matters for SEBI) at the price of rougher DX and a constrained hosted UI. Auth0 has the better DX and enterprise SSO story but gets expensive. Rolling your own means owning compliance, password storage, MFA and recovery — rarely worth it."},
{s:"realtime",l:"startup",t:"frontend backend",q:"The TimeMoney dashboard needs live portfolio updates pushed from the server. Why SSE over WebSockets?",o:["The data flow is one-way server→client, and SSE gives auto-reconnect over plain HTTP","SSE has lower latency than WebSockets","WebSockets cannot carry JSON payloads","SSE supports binary frames that WebSockets do not"],c:0,e:"WebSockets are full-duplex and worth it for chat, multiplayer or collaborative editing. A dashboard only receives — SSE gives you that over ordinary HTTP with built-in reconnection and proxy-friendliness, at a fraction of the operational complexity."},
{s:"realtime",l:"mid",t:"frontend backend",q:"Which response header is essential for an SSE endpoint behind a proxy?",o:["<code>Cache-Control: no-cache, no-transform</code>","<code>Content-Encoding: gzip</code>","<code>Transfer-Encoding: chunked</code>","<code>Access-Control-Allow-Origin: *</code>"],c:0,e:"<code>no-transform</code> stops intermediaries buffering or rewriting the stream — the classic reason SSE 'works locally but not in prod' behind nginx. You also need <code>Content-Type: text/event-stream</code>, <code>Connection: keep-alive</code>, and cleanup on <code>req.signal</code> abort so subscriptions don't leak."},
{s:"realtime",l:"mid",t:"frontend backend",q:"What does Socket.io provide that raw WebSocket does not?",o:["Rooms, namespaces, ACKs, auto-reconnect, long-poll fallback and a Redis multi-server adapter","Lower per-message overhead","Native browser support with no client library","Guaranteed message ordering across reconnects"],c:0,e:"Raw WebSocket is the bare protocol — you build reconnection, rooms and fallbacks yourself. Socket.io ships all of it, at the cost of a client library and some framing overhead. Use raw WS when you control both ends and want minimal overhead."},
{s:"realtime",l:"mnc",t:"frontend backend",q:"How do you deliver a message to a client whose connection is held by a different server instance?",o:["Publish through a pub/sub backbone (Redis, NATS, Kafka) that every node subscribes to","Enable sticky sessions on the load balancer","Broadcast to all instances over HTTP in a fan-out loop","Store messages in Postgres and have clients poll"],c:0,e:"Any node can publish; every node delivers to the connections it owns. Sticky sessions help route a <i>client</i> consistently but don't solve cross-node fan-out. At large scale, offload to a dedicated gateway (Socket.io adapter, API Gateway WebSocket, Pusher/Ably), and drain connections gracefully on deploy."},
{s:"ai",l:"startup",t:"backend",q:"How was Claude used in the TimeMoney development workflow?",o:["Generating draft Playwright tests from component code and acceptance criteria, then reviewed before commit","Automatically executing portfolio trades based on market signals","Replacing code review entirely for frontend pull requests","Translating the Postgres schema into MongoDB collections"],c:0,e:"The pattern that works: LLM produces a reviewable draft, a human owns the commit. Also used for LLM-assisted ranking and insight summarisation in the recommendation engine, plus day-to-day Claude CLI / Copilot for boilerplate and refactors."},
{s:"ai",l:"mid",t:"backend",q:"Which technique most improves <i>perceived</i> LLM latency without reducing cost?",o:["Streaming the response token by token","Prompt caching of the system prompt","Switching to a smaller model tier","Using the Batch API"],c:0,e:"Streaming doesn't make generation faster — it makes the wait feel far shorter, which is often what users actually care about. For real cost control: prompt caching on long system prompts, model tiering (Haiku for classification, Sonnet/Opus only when needed), Batch APIs (~50% cheaper) for non-realtime work, and tight <code>max_tokens</code>."},
{s:"ai",l:"mnc",t:"backend",q:"In a RAG pipeline for regulated wealth content, what is the correct order?",o:["Chunk → embed → store in a vector DB → embed the query → retrieve top-K → optionally rerank → augment the prompt → generate","Embed the query → generate → retrieve → validate against sources","Store raw documents → prompt the LLM to search them → generate","Fine-tune the model on the documents → generate → cite sources"],c:0,e:"Ingest SEBI docs and prospectuses as ~500-token overlapping chunks, embed, store in pgvector/Pinecone. At query time embed, retrieve top-K, optionally rerank with a cross-encoder, then build a prompt with context + user risk profile. Guardrails matter here: mandatory citations, regulatory disclaimers, full Q&A logging, human review of high-risk advice, and never auto-execute trades."},
{s:"ai",l:"mnc",t:"backend",q:"What is the most robust defence against prompt injection in an agentic flow?",o:["Restrict tool capabilities to least privilege and require human approval for destructive actions","Instruct the model in the system prompt to ignore malicious instructions","Strip all punctuation from user input","Use a larger model, which is harder to manipulate"],c:0,e:"Prompt-level instructions help but are not a security boundary — a sufficiently clever input can talk past them. The durable controls are architectural: untrusted input never enters the system prompt, model output is schema-validated before it's acted on, tools are narrowly scoped, and destructive actions need a human. Plus logging and a kill switch."},
{s:"perf",l:"mid",t:"frontend backend",q:"Which Core Web Vital replaced First Input Delay, and what is its target?",o:["INP (Interaction to Next Paint), &lt; 200ms","TTFB (Time To First Byte), &lt; 800ms","TBT (Total Blocking Time), &lt; 300ms","FCP (First Contentful Paint), &lt; 1.8s"],c:0,e:"The trio to quote: LCP &lt; 2.5s, INP &lt; 200ms, CLS &lt; 0.1. INP measures responsiveness across the whole session rather than just the first interaction. Measure with Lighthouse and WebPageTest for lab data, and real-user metrics (PostHog) for field data."},
{s:"perf",l:"mid",t:"frontend backend",q:"A memoised child still re-renders every time. What is the most likely cause?",o:["The parent passes a new object, array or function identity on each render","<code>React.memo</code> only works on class components","The child uses <code>useState</code>, which bypasses memoisation","The dependency array is missing from the parent's <code>useEffect</code>"],c:0,e:"<code>React.memo</code> does a shallow prop comparison, and <code>{}</code> !== <code>{}</code>. Stabilise the offending prop at the source with <code>useMemo</code>/<code>useCallback</code>. Find it with the React Profiler's 'why did this render' indicator; for very long lists, virtualise instead of memoising."},
{s:"perf",l:"mid",t:"frontend backend",q:"Which technique specifically targets CLS?",o:["Setting explicit width and height on images so space is reserved before load","Preloading the hero image","Deferring non-essential JavaScript","Moving heavy computation into a web worker"],c:0,e:"CLS is layout instability — content jumping as assets arrive. Reserve space for images, ads and embeds, and never insert content above existing content. Preloading the hero targets LCP; deferring JS and using workers targets INP."},
{s:"perf",l:"mnc",t:"frontend backend",q:"Which swap gives the biggest Next.js bundle win for a date-heavy app?",o:["Replacing moment.js with date-fns","Replacing <code>next/image</code> with plain <code>&lt;img&gt;</code>","Converting Server Components back to Client Components","Adding more dynamic imports for above-the-fold widgets"],c:0,e:"moment.js is large and not tree-shakeable; date-fns imports per-function. Same idea applies to lodash (import individual functions). Then: <code>next/dynamic</code> for heavy below-the-fold components, <code>@next/bundle-analyzer</code> to find fat chunks, and Server Components for anything non-interactive."},
{s:"system",l:"mnc",t:"backend infra",q:"What is the correct first move in a system design interview?",o:["Clarify functional and non-functional requirements before drawing anything","Sketch the high-level architecture to show breadth quickly","Choose the database, since everything else depends on it","Estimate QPS and storage from assumed traffic"],c:0,e:"Requirements first — features plus scale, latency, consistency and availability targets. Then estimate (DAU, QPS, storage, bandwidth), then high-level design, then data model with partitioning key, then a deep dive on whichever bottleneck the interviewer picks, and close on trade-offs, failure modes and monitoring."},
{s:"system",l:"mnc",t:"backend infra",q:"In the TimeMoney design, what pattern gets portfolio writes onto Kafka reliably?",o:["A transactional outbox — write the event in the same DB transaction, then relay it","A post-commit hook that publishes directly to Kafka","Kafka Connect polling the positions table every second","Dual writes to Postgres and Kafka inside the application"],c:0,e:"Dual writes can leave the two stores inconsistent if the second call fails. The outbox writes the event atomically alongside the business row, and a relay ships it afterwards. Elsewhere in that design: Cognito + Pinpoint MFA, Redis holding latest prices with an SSE fan-out, nightly batch recommendations, and immutable S3/Glacier audit logs for SEBI."},
{s:"system",l:"mnc",t:"backend infra",q:"For a URL shortener, why is a KV store the natural primary datastore?",o:["The workload is overwhelmingly read-heavy point lookups of key → URL","Short URLs require full-text search over the target","Relational integrity between links and users is critical","KV stores are the only option that supports TTL expiry"],c:0,e:"DynamoDB/Redis fit a simple key→value read-heavy pattern, fronted by a CDN for hot links. Other choices worth naming: base62 of an auto-increment id (or Snowflake when distributed) for id generation, async analytics via Kafka into a warehouse, a separate uniqueness index for custom aliases, and rate limiting on create."},
