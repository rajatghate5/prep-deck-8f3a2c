{s:"system",l:"mnc",t:"backend infra",q:"Which rate-limiting algorithm allows short bursts while holding a long-run average?",o:["Token bucket","Leaky bucket","Fixed window counter","Sliding window log"],c:0,e:"Token bucket refills at a steady rate and permits a burst up to bucket size — the most common choice. Leaky bucket smooths to a constant rate. Fixed window is simplest but suffers boundary spikes; sliding window log is accurate but memory-hungry. Implement atomically in Redis and reject at the edge with 429 + <code>Retry-After</code>."},
{s:"projects",l:"mid",t:"non-tech",q:"What was the cost of TimeMoney's multi-framework architecture, and how was it mitigated?",o:["Three toolchains to maintain — mitigated with shared design tokens, shared types via an npm package, and a unified component library","Slower page loads — mitigated by adding a CDN","Duplicate authentication logic — mitigated by moving auth into Cognito","Higher AWS costs — mitigated by reserved instances"],c:0,e:"Svelte for the parent Karat Capital site (tiny bundles, SEO), Astro for TimeMoney marketing (islands, zero JS by default), Next.js for the auth app (SSR, complex stateful dashboards). Naming the maintenance cost <i>and</i> the mitigation is what makes this answer read as senior."},
{s:"projects",l:"mid",t:"non-tech",q:"In the recommendation engine, what is the LLM's actual role?",o:["Generating short personalised insight text for the top-N already-ranked items","Ranking the full candidate pool of funds from scratch","Deciding each user's KYC risk band","Executing the recommended trades once approved"],c:0,e:"Rules and scoring do the ranking over signals (risk band, sector preference, holding tenure); the LLM writes the human-readable insight for the top results. Results are cached per user with a TTL and refreshed on portfolio change, every response carries a compliance disclaimer, and trades are never auto-executed."},
{s:"projects",l:"mid",t:"non-tech",q:"Which factors fed the ERoomRent weighted score?",o:["Budget proximity, geo distance, amenity overlap and owner rating","Listing age, photo count and description length","Owner response time and message volume","Number of previous tenants and average stay duration"],c:0,e:"The pipeline was <code>$match</code> on hard filters (city, budget, gender, food preference) → <code>$lookup</code> for owner profile and verification → <code>$addFields</code> computing the weighted score → <code>$sort</code> → <code>$limit</code> 20. Indexed on city + price with a geo-index for location; ~10% faster average lookups."},
{s:"projects",l:"mnc",t:"non-tech",q:"Which reflection on rebuilding TimeMoney best signals seniority?",o:["Consolidating to one framework unless the marketing-page perf wins were genuinely measurable","Rewriting the backend in Go for throughput","Replacing Cognito with a self-hosted auth service","Moving from Postgres to a document database for flexibility"],c:0,e:"Questioning your own architectural choice against measured benefit is the senior move. The other honest answers in that list: React Query from day one, OpenTelemetry tracing earlier (CloudWatch logs alone make cross-service debugging painful), feature flags for MFA/RBAC rollouts, and contract tests against the Cognito SDK."},
{s:"hr",l:"startup",t:"non-tech",q:"What is the right way to answer \"what are your salary expectations?\"",o:["Give a researched range, framed against total package, and avoid revealing current CTC first","Give a single precise number so you appear decisive","State your current CTC and ask for a 30% hike","Say it's negotiable and let them make the first offer"],c:0,e:"Research the market first (levels.fyi, Glassdoor, AmbitionBox, peers). A range anchors the conversation without boxing you in, and framing around the whole package — base, variable, ESOPs, learning — keeps options open. Leading with current CTC anchors <i>against</i> you."},
{s:"hr",l:"startup",t:"non-tech",q:"What makes the \"why should we hire you?\" answer land?",o:["Mapping already-shipped work (regulated fintech PII, real-time dashboards, AI integration) onto what this role needs","Emphasising willingness to work long hours","Listing every framework you've ever used","Stating that you're the strongest candidate they'll see"],c:0,e:"Evidence over adjectives: production fintech with regulated PII, real-time dashboards, AI integration — then the learning proof point (picked up NestJS, Astro and Svelte on the job and shipped them). Close on 'I'd hit the ground running here'."},
{s:"hr",l:"mid",t:"non-tech",q:"Which weakness answer follows the right structure?",o:["\"I used to dive into implementation before confirming requirements — I now write a short design note first, which cut rework\"","\"I'm too detail-oriented, which some people find intense\"","\"I struggle with time zones when working with distributed teams\"","\"I don't know Kubernetes yet\""],c:0,e:"Real weakness + the specific corrective habit + the observed effect. A pure skill gap ('I don't know Kubernetes') isn't a weakness, it's a training item, and dressed-up strengths read as evasion."},
{s:"hr",l:"mid",t:"non-tech",q:"What is the strongest \"where do you see yourself in 5 years?\" answer for an IC track?",o:["Growing into Staff/Principal — owning architecture across services and mentoring, while staying close to the code","Moving into engineering management within two years","Starting your own company once you've learned enough","Wherever the company needs you most"],c:0,e:"Name the level, name the leverage (architecture ownership, mentoring, being called into hard problems), and be explicit that you want technical leadership rather than people management. Vagueness reads as no plan; 'starting my own company' reads as a short stay."},
{s:"hr",l:"startup",t:"non-tech",q:"Which is the best question to ask your interviewer?",o:["\"How are technical decisions made — RFC docs, design reviews, or informally?\"","\"How many employees does the company have?\"","\"What products do you sell?\"","\"When will I hear back about the offer?\""],c:0,e:"Have 3–5 ready and avoid anything Googleable. Strong ones probe how the team actually operates: what success looks like at 6 months, team structure, the biggest current technical challenge, on-call and incident culture, tech-debt vs features, and the growth path from this level."},
{s:"cs",l:"india",t:"frontend backend databases",q:"Which OOP pillar is 'one interface, many forms'?",o:["Polymorphism","Abstraction","Encapsulation","Inheritance"],c:0,e:"Polymorphism comes in two flavours: compile-time (overloading) and runtime (overriding via virtual dispatch). Encapsulation bundles data with methods and hides internals; abstraction exposes what matters and hides the how; inheritance derives behaviour from a parent — useful but coupling-heavy, so prefer composition."},
{s:"cs",l:"india",t:"frontend backend databases",q:"What can an abstract class do that a classic interface cannot?",o:["Hold implemented methods, state and a constructor","Be implemented by more than one class","Declare method signatures without bodies","Be used as a type annotation"],c:0,e:"An abstract class carries implementation and state but is limited to single inheritance in most languages. An interface is a pure contract and a class can implement many. In TypeScript specifically, an interface is erased at runtime while an abstract class emits real JS."},
{s:"cs",l:"india",t:"frontend backend databases",q:"NestJS's dependency injection is the clearest application of which SOLID principle?",o:["Dependency Inversion — depend on abstractions, not concretions","Single Responsibility","Open/Closed","Interface Segregation"],c:0,e:"Services declare what they need via constructor parameters and the IoC container supplies an implementation, so high-level modules never bind to concrete classes. The rest: SRP (one reason to change), OCP (extend without modifying), LSP (subclasses substitutable for their base), ISP (many small interfaces beat one fat one)."},
{s:"cs",l:"india",t:"frontend backend databases",q:"A table is in 2NF but a non-key column depends on another non-key column. Which normal form does it violate?",o:["3NF — transitive dependency","BCNF","1NF","It violates none; this is allowed in 2NF"],c:0,e:"1NF = atomic values, no repeating groups. 2NF = no partial dependency on part of a composite key. 3NF = no transitive dependency — non-key attributes must depend only on the primary key. BCNF is stricter still: every determinant must be a candidate key. Normalise to 3NF, then denormalise selectively for read performance."},
{s:"cs",l:"india",t:"frontend backend databases",q:"Which join returns every row from both tables, with NULLs where there's no match?",o:["FULL OUTER JOIN","CROSS JOIN","INNER JOIN","SELF JOIN"],c:0,e:"INNER = matches only. LEFT = all left rows plus matches. RIGHT = the mirror. FULL OUTER = everything from both sides. CROSS = Cartesian product (no condition). SELF = a table joined to itself, the classic employee → manager query."},
{s:"cs",l:"india",t:"frontend backend databases",q:"What distinguishes a UNIQUE key from a PRIMARY key?",o:["A UNIQUE key permits one NULL and a table may have several; a PRIMARY key is NOT NULL and there is only one","A UNIQUE key is not indexed","A UNIQUE key cannot be referenced by a foreign key","A PRIMARY key permits duplicate values if they are NULL"],c:0,e:"Primary key: uniquely identifies a row, NOT NULL, exactly one per table, and in InnoDB/MSSQL it becomes the clustered index. Unique key: enforces uniqueness, allows a NULL, multiple per table. Foreign key: references another table's key and enforces referential integrity."},
{s:"cs",l:"india",t:"frontend backend databases",q:"What is the fundamental trade-off an index makes?",o:["Faster reads in exchange for slower writes and extra storage","Faster writes in exchange for slower reads","Lower memory use in exchange for higher CPU","Stronger consistency in exchange for higher latency"],c:0,e:"Every INSERT/UPDATE must also maintain each index. Index the columns you filter, join or sort on frequently — and leave the rest alone. A clustered index means the table's physical order <i>is</i> the index order, so there can only be one per table."},
{s:"cs",l:"india",t:"frontend backend databases",q:"What distinguishes a thread from a process?",o:["Threads share the parent process's memory; processes have isolated address spaces","Threads always run on separate CPU cores; processes do not","Processes are lighter to create than threads","Threads cannot perform I/O"],c:0,e:"Shared memory makes threads cheap to switch between but requires synchronisation; process isolation is safer but heavier. Node runs your JavaScript on one main thread while libuv's pool handles I/O underneath."},
{s:"cs",l:"india",t:"frontend backend databases",q:"Which of the four Coffman conditions does consistent lock ordering eliminate?",o:["Circular wait","Mutual exclusion","Hold-and-wait","No preemption"],c:0,e:"All four must hold simultaneously for deadlock: mutual exclusion, hold-and-wait, no preemption, and circular wait. Always acquiring locks in the same order (say, ascending by id) makes a cycle impossible. Other tools: timeouts and active deadlock detection."},
{s:"cs",l:"india",t:"frontend backend databases",q:"Why do modern operating systems use paging rather than pure segmentation?",o:["Fixed-size pages eliminate external fragmentation","Paging requires no hardware support","Segmentation cannot support virtual memory","Paging allows variable-size allocations"],c:0,e:"Paging divides memory into fixed-size pages mapped to physical frames — no external fragmentation, though internal fragmentation within a page remains. Segmentation uses variable-size logical units (code, data, stack) that match a programmer's mental model but fragment memory externally."},
{s:"cs",l:"india",t:"frontend backend databases",q:"TLS operates at which OSI layer?",o:["Presentation (layer 6)","Transport (layer 4)","Session (layer 5)","Application (layer 7)"],c:0,e:"Physical → Data Link → Network → Transport → Session → Presentation → Application. The Presentation layer handles encoding and encryption, which is where TLS and JSON sit. Mnemonic: \"Please Do Not Throw Sausage Pizza Away\"."},
{s:"cs",l:"india",t:"frontend backend databases",q:"Why does DNS use UDP rather than TCP?",o:["Queries are small and low-overhead; the connectionless model avoids handshake latency","UDP guarantees ordered delivery for small packets","DNS requires the congestion control UDP provides","TCP cannot carry DNS record types"],c:0,e:"TCP is connection-oriented and reliable (ACKs, retransmits, ordering, congestion control) — right for HTTP, SSH and email. UDP is connectionless with no guarantees but minimal overhead, which suits DNS, VoIP, gaming and video streaming."},
{s:"cs",l:"india",t:"frontend backend databases",q:"In \"what happens when you type a URL\", what immediately follows the TCP handshake on an HTTPS site?",o:["The TLS handshake — certificate exchange and key agreement","The HTTP request is sent","DNS resolution begins","The browser builds the DOM"],c:0,e:"Parse URL → DNS resolution (browser cache → OS cache → resolver → root → TLD → authoritative) → TCP handshake (SYN, SYN-ACK, ACK) → TLS handshake → HTTP request → response → parse HTML into DOM, fetch subresources → CSSOM + DOM → render tree → layout → paint → composite."},
{s:"cs",l:"india",t:"frontend backend databases",q:"What does HTTP/3 fix that HTTP/2 could not?",o:["TCP head-of-line blocking — HTTP/3 runs over QUIC on UDP","Lack of header compression","The one-request-per-connection limit","Absence of binary framing"],c:0,e:"HTTP/2 added binary framing, multiplexing and HPACK header compression — but all streams still share one TCP connection, so a single lost packet stalls every stream. QUIC moves to UDP with per-stream delivery, plus faster handshakes and better behaviour on lossy networks."},
{s:"html",l:"startup",t:"frontend",q:"What is the main practical benefit of semantic HTML?",o:["Screen readers and search engines can interpret document structure","It renders faster than <code>&lt;div&gt;</code>-based markup","It removes the need for CSS resets","It automatically makes the page responsive"],c:0,e:"<code>&lt;header&gt;</code>, <code>&lt;nav&gt;</code>, <code>&lt;main&gt;</code>, <code>&lt;article&gt;</code>, <code>&lt;section&gt;</code>, <code>&lt;aside&gt;</code>, <code>&lt;footer&gt;</code> describe meaning rather than appearance. That buys accessibility, SEO, readability, and sensible defaults that respect user preferences."},
{s:"html",l:"startup",t:"frontend",q:"With <code>box-sizing: border-box</code>, what does <code>width: 300px</code> include?",o:["Content + padding + border","Content only","Content + padding + border + margin","Content + margin"],c:0,e:"The default <code>content-box</code> makes width mean content alone, so padding and borders push the element wider — the classic layout surprise. <code>border-box</code> folds padding and border into the declared width. Margin is always outside, in both modes."},
{s:"html",l:"startup",t:"frontend",q:"Which selector has the highest specificity?",o:["<code>#sidebar</code>","<code>.nav .item.active</code>","<code>div span a</code>","<code>a:hover</code>"],c:0,e:"Specificity is the tuple (inline, IDs, classes/attributes/pseudo-classes, elements/pseudo-elements). One ID is 0,1,0,0 and beats any number of classes (0,0,3,0). <code>!important</code> trumps the lot but is a code smell — fix the cascade instead."},
{s:"html",l:"mid",t:"frontend",q:"You're laying out a dashboard with both rows and columns. Which tool?",o:["Grid for the page skeleton, Flexbox for the components inside","Flexbox alone — it handles two dimensions","Grid alone — Flexbox is deprecated","Absolute positioning for precise control"],c:0,e:"Flexbox is one-dimensional (a row <b>or</b> a column) and shines for nav bars, button groups and aligning card content. Grid is two-dimensional and suits page-level layouts. Combining them is the normal answer, not a compromise."},
{s:"html",l:"mid",t:"frontend",q:"An element with <code>position: absolute</code> is positioned relative to what?",o:["The nearest positioned ancestor","The viewport","Its parent element, always","Its own normal-flow position"],c:0,e:"'Positioned' means any ancestor with <code>position</code> other than <code>static</code> — forget to set <code>relative</code> on the parent and the element escapes to the initial containing block. <code>fixed</code> is viewport-relative; <code>sticky</code> acts <code>relative</code> until a scroll threshold, then <code>fixed</code>."},
{s:"html",l:"mid",t:"frontend",q:"Which is a pseudo-element rather than a pseudo-class?",o:["<code>::before</code>","<code>:hover</code>","<code>:nth-child(2)</code>","<code>:focus</code>"],c:0,e:"Pseudo-classes (<code>:hover</code>, <code>:focus</code>, <code>:nth-child</code>) select elements in a particular <b>state</b>. Pseudo-elements (<code>::before</code>, <code>::after</code>, <code>::first-line</code>) create a virtual element that doesn't exist in the DOM. The double colon is the modern convention that marks the difference."},
{s:"html",l:"mid",t:"frontend",q:"Why are <code>transform</code> and <code>opacity</code> the cheapest properties to animate?",o:["They skip layout and paint, going straight to GPU compositing","They are throttled to 30fps, halving the work","They bypass the render tree entirely","They are computed once and cached for the page lifetime"],c:0,e:"Critical rendering path: DOM + CSSOM → render tree → layout → paint → composite. Animating <code>width</code> or <code>top</code> forces layout for every frame; <code>transform</code> and <code>opacity</code> only affect the composite step, which the GPU handles."},
{s:"html",l:"mnc",t:"frontend",q:"What is layout thrashing?",o:["Reading a layout property like <code>offsetHeight</code> after a DOM mutation, forcing a synchronous reflow each time","Applying too many CSS animations at once","Repainting a large area of the screen repeatedly","Loading stylesheets after the body has parsed"],c:0,e:"The browser batches style changes until you read a geometry property — then it must flush layout immediately. Interleaving reads and writes in a loop forces a reflow per iteration. Batch all reads, then all writes, prefer <code>transform</code> over <code>top</code>/<code>left</code>, and debounce resize handlers."},
{s:"html",l:"mid",t:"frontend",q:"What is the main advantage of event delegation?",o:["One listener on a parent handles dynamically added children and uses less memory","It stops events from bubbling up the tree","It runs handlers before the capture phase","It guarantees handler execution order"],c:0,e:"Attach once to the container and check <code>e.target.matches('li')</code> inside. Children added later are handled automatically — no rebinding — and you avoid hundreds of individual listeners. It relies on bubbling, it doesn't prevent it."},
{s:"html",l:"mnc",t:"frontend",q:"What is the first rule of accessibility?",o:["Use semantic HTML — a button should be a <code>&lt;button&gt;</code>, not a clickable <code>&lt;div&gt;</code>","Add ARIA roles to every interactive element","Ensure colour contrast is at least 4.5:1","Provide alt text on every image, including decorative ones"],c:0,e:"Native elements bring keyboard support, focus management and correct screen-reader semantics for free. ARIA is the patch for when semantics genuinely fall short — 'no ARIA is better than bad ARIA'. Decorative images take <code>alt=\"\"</code>, not descriptive text."},
{s:"html",l:"mid",t:"frontend",q:"What is the main trade-off of CSS Modules versus styled-components?",o:["Zero runtime cost, but no native support for prop-driven dynamic styles","Smaller bundles, but no scoping","Dynamic styling, but requires extra SSR setup","Faster iteration, but verbose markup"],c:0,e:"CSS Modules scope class names at build time — nothing ships at runtime, but styling from props needs inline styles or CSS variables. styled-components/emotion give prop-driven styles and automatic scoping at a runtime cost plus SSR setup. Tailwind (used at TimeMoney) is fast to iterate with a tiny purged bundle, at the cost of verbose markup."},
{s:"testing",l:"startup",t:"infra",q:"According to the testing pyramid, which layer should be most numerous?",o:["Unit tests — fast, isolated, run on every PR","E2E tests — they cover real user journeys","Integration tests — they catch contract bugs","Manual QA passes before release"],c:0,e:"Many unit, fewer integration, few E2E — E2E is slow and flaky, so reserve it for golden paths. Worth naming the counterpoint: Kent C. Dodds' 'testing trophy' argues React apps get more value from a heavier integration layer."},
{s:"testing",l:"mid",t:"infra",q:"When Claude drafts a Playwright test, which output should you always replace?",o:["<code>page.waitForTimeout(...)</code> — swap it for an assertion that auto-retries","Any use of <code>test.describe</code> blocks","Arrow-function test callbacks","<code>expect</code> assertions on text content"],c:0,e:"Fixed sleeps are the number one source of flake. <code>expect(locator).toBeVisible()</code> retries until the timeout instead. The wider workflow: feed component code + acceptance criteria + an example test as a style reference, ask for happy path plus 2–3 edge cases, then verify every locator against the real DOM. Treat the output as a draft."},
{s:"testing",l:"mid",t:"infra",q:"How do you flush out test-order dependencies in CI?",o:["Randomise test execution order","Run the suite twice and compare results","Increase the global timeout","Run all tests in a single worker"],c:0,e:"Order dependency hides when the sequence is stable. Shuffling exposes it. The other flake sources: race conditions (use auto-retrying assertions, not sleeps), shared state (isolate fixtures, reset the DB), network instability (mock or retry with backoff), and animations or clocks (freeze time)."},
{s:"testing",l:"mid",t:"infra",q:"What is the golden rule of rebasing?",o:["Never rebase a branch other people are working on","Never rebase more than three commits at a time","Always rebase before every commit","Rebase only after merging to main"],c:0,e:"Rebase rewrites commit hashes; if someone else has those commits, their history diverges from yours. The safe pattern is rebase your own local work to keep it linear, then merge into <code>main</code>. Merge preserves history exactly and is always safe on shared branches."},
{s:"testing",l:"mid",t:"infra",q:"Which Git command recovers a commit lost after a bad reset?",o:["<code>git reflog</code>","<code>git revert</code>","<code>git stash pop</code>","<code>git cherry-pick</code>"],c:0,e:"<code>reflog</code> records where HEAD has pointed, so the 'lost' commit is still reachable by hash. <code>revert</code> creates a new commit undoing an old one (safe on shared branches), <code>cherry-pick</code> copies a single commit across branches, and <code>stash</code> parks uncommitted work."},
{s:"testing",l:"mid",t:"infra",q:"Why is Docker faster and lighter than a virtual machine?",o:["Containers share the host kernel instead of booting a full guest OS","Containers run natively on the GPU","Docker images are always smaller than 100MB","Containers skip the filesystem layer entirely"],c:0,e:"A VM virtualises hardware and boots its own kernel; a container is an isolated process tree sharing the host kernel. That gives reproducible 'runs everywhere' images with near-native startup — and it's the foundation Kubernetes orchestrates."},
{s:"testing",l:"mid",t:"infra",q:"In a multi-stage Dockerfile, what does <code>COPY --from=builder</code> accomplish?",o:["It pulls built artifacts into a clean runtime image, leaving build tools and source behind","It caches the build stage for subsequent builds","It copies files from the host into the container","It merges both stages into a single layer"],c:0,e:"Stage one installs dev dependencies and builds; stage two starts from a fresh <code>node:20-alpine</code> and takes only <code>dist</code> plus production <code>node_modules</code>. Typically 5–10× smaller and a much smaller attack surface. Adding <code>USER node</code> drops root privileges."},
{s:"testing",l:"mnc",t:"infra",q:"Which stage belongs on tag/release rather than on every PR?",o:["Canary deploy to production with manual approval and auto-rollback","Lint and typecheck","Unit tests","Preview deployment"],c:0,e:"PR: install → lint → typecheck → unit tests → build → preview deploy. Merge to main: adds integration tests → Docker build → registry push → staging → smoke tests. Tag: production with manual approval, canary first, then full rollout with auto-rollback on an error-rate spike."},
{s:"dsa",l:"startup",t:"frontend backend",q:"What is the time complexity of an efficient comparison sort?",o:["O(n log n)","O(n)","O(log n)","O(n²)"],c:0,e:"Merge, heap and average-case quicksort are O(n log n) — the proven lower bound for comparison sorts. O(1) = hash lookup or array index; O(log n) = binary search; O(n) = single pass; O(n²) = nested loops; O(2ⁿ) = naive recursive Fibonacci; O(n!) = permutations. Always state space alongside time."},
{s:"dsa",l:"mid",t:"frontend backend",q:"Two Sum with a hash map — what is the time and space complexity?",o:["O(n) time, O(n) space","O(n log n) time, O(1) space","O(n²) time, O(1) space","O(n) time, O(1) space"],c:0,e:"One pass: for each <code>nums[i]</code> compute <code>need = target - nums[i]</code>, return if <code>need</code> is already in the map, otherwise store <code>nums[i] → i</code>. The map is the space cost — that's the classic time-for-space trade against the O(n²) brute force."},
{s:"dsa",l:"mid",t:"frontend backend",q:"Reversing a singly linked list iteratively requires how many pointers?",o:["Three — previous, current and next","One — current only","Two — head and tail","Four — head, tail, previous and next"],c:0,e:"You need <code>prev</code>, <code>curr</code>, and a saved <code>next</code> before you overwrite <code>curr.next</code>, or you lose the rest of the list. O(n) time, O(1) space. Reversing a string array is the simpler two-pointer swap from both ends."},
{s:"dsa",l:"mid",t:"frontend backend",q:"What is the first check in an anagram comparison?",o:["Whether the two strings have the same length","Whether both strings are lowercase","Whether the first characters match","Whether either string is empty"],c:0,e:"Different lengths means not an anagram, and it's an O(1) exit before any counting. Then count characters in <code>s</code>, decrement for <code>t</code>, and fail the moment a count would go negative. For Group Anagrams, the sorted string (or a 26-slot count) becomes the hash key."},
{s:"dsa",l:"mid",t:"frontend backend",q:"In the longest-substring-without-repeats sliding window, what happens on a duplicate character?",o:["Shrink from the left until the duplicate is removed from the window","Reset both pointers to the current index","Skip the character and continue","Restart the scan from the position after the first occurrence"],c:0,e:"Expand <code>r</code>; when <code>s[r]</code> is already in the set, advance <code>l</code> and remove characters until it isn't. Update <code>best = max(best, r - l + 1)</code> after each insert. Each character enters and leaves the window once — O(n) time, O(min(n, charset)) space."},
{s:"dsa",l:"mid",t:"frontend backend",q:"In Container With Most Water, which pointer do you move inward?",o:["The shorter one — the taller side can only lose width","The taller one — it has more room to improve","Whichever is further from the centre","Both simultaneously, one step each"],c:0,e:"Area = <code>min(left, right) × width</code>. Moving the taller line in shrinks the width while the height stays capped by the shorter side, so it can never improve. Moving the shorter one is the only move with upside. O(n) time, O(1) space."},
{s:"dsa",l:"mid",t:"frontend backend",q:"Why must Floyd's tortoise and hare meet if a cycle exists?",o:["Inside the cycle the fast pointer gains exactly one node per step, so it closes any gap","The fast pointer always reaches the cycle entry first","Both pointers wrap to the head simultaneously","The gap doubles each iteration until it overflows the cycle"],c:0,e:"Once both are inside the cycle, the relative speed is 1 node per step, so the gap shrinks by one each iteration and they meet within at most cycle-length steps. If there's no cycle, <code>fast</code> hits <code>null</code>. O(n) time, O(1) space — beating the hash-set approach on space."},
{s:"dsa",l:"mid",t:"frontend backend",q:"In Valid Parentheses, what must be true after the whole string is scanned?",o:["The stack must be empty","The stack must contain exactly one element","The last popped bracket must be a closing one","The stack size must equal the string length divided by two"],c:0,e:"A non-empty stack means unclosed openings — <code>\"(((\"</code> never fails mid-scan. Push on open, pop and verify the match on close, fail immediately on mismatch, then check emptiness at the end. O(n) time and space."},
{s:"dsa",l:"mid",t:"frontend backend",q:"In binary search, why is the update <code>l = m + 1</code> rather than <code>l = m</code>?",o:["<code>m</code> has already been checked, and keeping it can cause an infinite loop","It skips duplicate values","It keeps the range size a power of two","It compensates for integer division rounding down"],c:0,e:"<code>nums[m]</code> was compared already, so excluding it guarantees the range shrinks every iteration. With <code>l = m</code> and a two-element range, <code>m</code> can stay put and the loop never terminates. O(log n) time, O(1) space."},
{s:"dsa",l:"mid",t:"frontend backend",q:"Which traversal of a BST produces sorted output?",o:["In-order (left → root → right)","Pre-order (root → left → right)","Post-order (left → right → root)","Level-order (BFS)"],c:0,e:"The three DFS orders differ only in <b>where</b> you visit the root. On a BST, in-order yields ascending values — a useful invariant and the basis for validating a BST. Pre-order is natural for serialising a tree; post-order for freeing or evaluating children before the parent."},
{s:"dsa",l:"mid",t:"frontend backend",q:"Max depth is <code>1 + max(left, right)</code>. What is the space complexity?",o:["O(h), where h is the tree height — the recursion stack","O(n), one frame per node","O(1) — no extra structures are allocated","O(log n) regardless of tree shape"],c:0,e:"Space is the recursion depth. A balanced tree gives O(log n), but a degenerate skewed tree gives O(n) — so O(h) is the precise answer. Diameter reuses the same recursion, tracking <code>left + right</code> edges at each node while returning depth upward."},
{s:"dsa",l:"mnc",t:"frontend backend",q:"What is the classic bug when validating a BST?",o:["Comparing each node only to its immediate children instead of passing down min/max bounds","Forgetting to handle the empty tree","Using in-order traversal instead of pre-order","Comparing values with <code>&lt;=</code> instead of <code>&lt;</code>"],c:0,e:"A local parent-child check passes on trees where a deep descendant violates ordering — node 3 in the right subtree of 5 is smaller than 5 but larger than its own parent. Pass <code>(min, max)</code> bounds down: the left subtree inherits <code>max = node.val</code>, the right inherits <code>min = node.val</code>."},
{s:"dsa",l:"mnc",t:"frontend backend",q:"In Number of Islands, why mark visited land cells as '0' in place?",o:["It avoids a separate visited structure and prevents re-counting the same island","It compresses the grid to save memory","It guarantees the DFS visits cells in row-major order","It converts the problem from DFS to BFS"],c:0,e:"Flood-fill sinks each island as you count it, so the next '1' you meet must belong to a new one. O(rows × cols) time; O(rows × cols) worst-case recursion stack. Mention that mutating the input may need a caveat if the caller still needs it."},
{s:"dsa",l:"mnc",t:"frontend backend",q:"In Kahn's algorithm, what does an incomplete result indicate?",o:["A cycle exists — some nodes never reached in-degree zero","The graph is disconnected","The starting node was chosen badly","The in-degree array was computed incorrectly"],c:0,e:"Build edges b → a for 'a depends on b', compute in-degrees, queue everything at zero, and decrement dependents as you pop. If the count of processed nodes is less than <code>numCourses</code>, the remainder sit in a cycle where every node waits on another. O(V + E)."},
{s:"dsa",l:"mnc",t:"frontend backend",q:"What are the four steps of the DP framework?",o:["Define the state → write the transition → set the base case → extract the answer","Sort the input → memoise → recurse → cache","Find the greedy choice → prove it → implement → optimise","Build a graph → topologically sort → relax edges → read the result"],c:0,e:"Climbing Stairs: <code>ways(n) = ways(n-1) + ways(n-2)</code> — Fibonacci, computable in O(n) time and O(1) space with two rolling variables. House Robber and Coin Change follow the same four steps with different transitions."},
{s:"dsa",l:"mnc",t:"frontend backend",q:"What does <code>tails[k]</code> hold in the O(n log n) LIS solution?",o:["The smallest possible tail value of an increasing subsequence of length k+1","The k-th element of the longest increasing subsequence","The number of subsequences of length k+1","The largest element seen in the first k positions"],c:0,e:"Patience sorting: for each value, binary-search <code>tails</code> for the first element ≥ it and overwrite. The array's <b>length</b> is the LIS length — its contents are not necessarily a valid subsequence. The O(n²) DP alternative is <code>dp[i] = 1 + max(dp[j])</code> for <code>j &lt; i</code> where <code>nums[j] &lt; nums[i]</code>."},
{s:"dsa",l:"mnc",t:"frontend backend",q:"Which structures give an LRU cache O(1) <code>get</code> and <code>put</code>?",o:["A hash map plus a doubly linked list","A single sorted array","A min-heap keyed by access time","A balanced binary search tree"],c:0,e:"The map gives O(1) lookup to a node; the doubly linked list allows O(1) unlink and move-to-front, with the tail as the eviction victim. A heap would make access-order updates O(log n). In JS, <code>Map</code> preserves insertion order, which makes a neat shortcut worth mentioning."},
{s:"dsa",l:"mnc",t:"frontend backend",q:"What is the third step of the backtracking template?",o:["Undo the choice before returning","Sort the remaining candidates","Memoise the current path","Prune branches that exceed the target"],c:0,e:"Make a choice → recurse → <b>undo</b> the choice. Skipping the undo leaks state into sibling branches. Subsets take the skip-or-take decision at each index (2ⁿ), Permutations swap or track used elements (n!), and N-Queens adds constraint pruning on columns and diagonals."},
{s:"dsa",l:"mnc",t:"frontend backend",q:"What must you do before merging intervals?",o:["Sort them by start time","Sort them by end time","Deduplicate identical intervals","Convert them to a sweep-line event list"],c:0,e:"Sorting by start makes one linear pass sufficient: if the current start ≤ the last result's end, extend that end, otherwise push a new interval. Touching intervals like <code>[1,4]</code> and <code>[4,5]</code> merge to <code>[1,5]</code>. O(n log n), dominated by the sort."},
{s:"dsa",l:"mnc",t:"frontend backend",q:"To find the k-th largest element, why use a min-heap of size k rather than a max-heap?",o:["The root is the smallest of the k kept, so it's both the answer and the cheapest element to evict","A max-heap cannot be bounded to size k","Min-heaps have better cache locality","A max-heap would return the k-th smallest instead"],c:0,e:"Push each number; when the heap exceeds k, pop the root (the smallest). What remains is the k largest, and the root is precisely the k-th largest. O(n log k) time, O(k) space — better than sorting when k ≪ n."},
{s:"dsa",l:"mnc",t:"frontend backend",q:"Facing an unfamiliar problem, what comes immediately after clarifying constraints?",o:["Walk through 2–3 concrete examples by hand, including an edge case","Start coding the optimal solution","Announce the target time complexity","Ask the interviewer for a hint"],c:0,e:"Clarify → examples by hand → state the brute force (prove you can solve it before optimising) → name candidate patterns aloud (hashmap? two pointers? DP? graph?) → optimise → code cleanly → dry-run and cover edge cases → state time and space. Silent coding is the mistake; think out loud."},
{s:"india-service",l:"india",t:"non-tech",q:"Which SDLC model uses continuous flow with WIP limits rather than fixed-length iterations?",o:["Kanban","Scrum","Waterfall","Spiral"],c:0,e:"Kanban pulls work continuously and caps work-in-progress. Scrum uses time-boxed sprints (2 weeks at Antino). Waterfall is linear and rigid, still common in government and heavily regulated projects. DevOps isn't an SDLC model as such — it's dev+ops collaboration with CI/CD and infra as code."},
{s:"india-service",l:"india",t:"non-tech",q:"Which Agile ceremony produces action items for the next sprint?",o:["Retrospective","Sprint Review","Sprint Planning","Daily Stand-up"],c:0,e:"Retro = what went well, what didn't, what we'll change. Sprint Review = demo to stakeholders and gather feedback. Planning = pick and commit to stories. Stand-up = 15-minute yesterday/today/blockers sync. Backlog grooming refines upcoming stories."},
{s:"india-service",l:"india",t:"non-tech",q:"In Scrum, who owns and prioritises the backlog?",o:["The Product Owner","The Scrum Master","The Development Team collectively","The Engineering Manager"],c:0,e:"Product Owner owns and prioritises the backlog. Scrum Master facilitates, removes blockers and runs ceremonies — a servant-leader role, not a manager. The Dev Team is 5–9 people, self-organising, delivering increments against a definition of done, usually estimating in Fibonacci story points."},
{s:"india-service",l:"india",t:"non-tech",q:"Which approach to \"2nd highest salary\" correctly handles ties?",o:["<code>DENSE_RANK() OVER (ORDER BY salary DESC)</code> filtered to rank 2","<code>ORDER BY salary DESC LIMIT 1 OFFSET 1</code>","<code>SELECT MAX(salary) WHERE salary &lt; (SELECT MAX(salary) ...)</code>","<code>ORDER BY salary DESC LIMIT 2</code>"],c:0,e:"<code>DENSE_RANK</code> gives tied salaries the same rank and doesn't skip the next value, so 'second highest distinct salary' is exactly rank 2. <code>LIMIT/OFFSET</code> works only with <code>DISTINCT</code>, and the <code>MAX</code>-subquery approach also works but doesn't generalise to N-th."},
{s:"india-service",l:"india",t:"non-tech",q:"Which clause filters groups after aggregation when finding duplicate emails?",o:["<code>HAVING COUNT(*) &gt; 1</code>","<code>WHERE COUNT(*) &gt; 1</code>","<code>GROUP BY COUNT(*)</code>","<code>DISTINCT ON (email)</code>"],c:0,e:"<code>WHERE</code> runs before <code>GROUP BY</code>, so aggregates aren't available to it yet — <code>HAVING</code> is the post-aggregation filter. To delete duplicates keeping the lowest id, self-join on the duplicate column with <code>u1.id &gt; u2.id</code>."},
{s:"india-service",l:"india",t:"non-tech",q:"Which window function cleanly returns the highest-paid employee per department?",o:["<code>RANK() OVER (PARTITION BY dept ORDER BY salary DESC)</code> filtered to 1","<code>ROW_NUMBER() OVER (ORDER BY salary DESC)</code> filtered to 1","<code>MAX(salary) OVER ()</code>","<code>COUNT(*) OVER (PARTITION BY dept)</code>"],c:0,e:"<code>PARTITION BY</code> restarts the ranking per department. Use <code>RANK</code> if you want all tied top earners, <code>ROW_NUMBER</code> if you want exactly one. The correlated-subquery form works too but is usually slower and harder to read."},
{s:"india-service",l:"india",t:"non-tech",q:"Which statement about TRUNCATE is correct?",o:["It's DDL — removes all rows, takes no WHERE clause, is minimally logged and resets identity","It's DML and can be filtered with WHERE","It removes the table structure along with the data","It is slower than DELETE because it rebuilds indexes"],c:0,e:"DELETE is DML: row-by-row, supports <code>WHERE</code>, fully logged, rollback-able, slower. TRUNCATE is DDL: all rows, no filter, minimally logged, resets identity/sequence, much faster. DROP removes the table entirely — structure and data."},
{s:"india-service",l:"india",t:"non-tech",q:"Why can't JavaScript support method overloading natively?",o:["Functions are dispatched by name only, not by parameter type or arity","JavaScript has no concept of methods on classes","Overloading requires static typing, which TypeScript strips at runtime","Only interpreted languages support overloading"],c:0,e:"Overloading is compile-time polymorphism resolved by signature; JS keeps one binding per name, so a later definition simply replaces the earlier one. Emulate with default arguments, rest parameters or runtime type checks. Overriding — a subclass replacing a parent method, calling <code>super.method()</code> — works fine."},
{s:"india-service",l:"india",t:"non-tech",q:"How should you answer a question about your notice period?",o:["State the exact contractual period and mention buyout or leave-burn as options for early release","Say it's flexible and can be as short as needed","Understate it slightly to seem more available","Say you'll resign only after the offer letter arrives"],c:0,e:"Background verification will surface the truth, so never shade it. Know your exact clause (typically 60–90 days), then offer the realistic levers: negotiated early release, buyout funded by the new company, or burning accrued leave."},
{s:"india-service",l:"india",t:"non-tech",q:"What is a normal hike expectation when switching within the Indian market?",o:["30–60% for a typical switch; 80–100% when moving to a top product company with strong performance","10–15%, matching annual appraisal cycles","Always exactly double your current CTC","Whatever the recruiter first offers, since ranges are fixed"],c:0,e:"Anchor with real data — AmbitionBox, Glassdoor, LinkedIn Salary, levels.fyi India, and peers. State fixed and variable separately and be exact, because payslips get verified. Then give a range framed around total compensation."},
{s:"india-service",l:"india",t:"non-tech",q:"What should you do when a service company presents a 2-year bond?",o:["Read the terms carefully — buyouts are typically ₹50k–1L and the clause is often negotiable","Refuse outright, as bonds are unenforceable","Sign it, since bond terms are fixed by industry regulation","Accept but plan to leave without paying the buyout"],c:0,e:"Service agreements are contracts with real financial consequences. Know the buyout figure and whether the new employer will cover it. Same principle for the adjacent questions: be honest and specific about relocation constraints and night-shift availability rather than agreeing to everything."},
{s:"india-service",l:"india",t:"non-tech",q:"What should never be the sole stated reason for switching companies?",o:["Salary","Wanting larger-scale systems","Wanting earlier involvement in design","A stronger engineering culture"],c:0,e:"Compensation is almost always a factor and everyone knows it, but leading with it makes you sound purely transactional and easy to counter-offer. Lead with growth and scope, then let the package conversation happen on its own terms."},
{s:"india-service",l:"india",t:"non-tech",q:"What is the right structure for \"explain your project in 2 minutes\"?",o:["Domain → your role → tech stack → highlights → result","Full chronology of every sprint you worked on","A list of all technologies, then the team structure","Challenges faced, then a request for feedback"],c:0,e:"TimeMoney has the strongest narrative: SEBI-regulated wealth platform → Senior Software Developer owning architecture, frontend, auth and AI tooling → Svelte/Astro/Next.js in TS, Node, Cognito + Pinpoint, SSE → 30% page-load improvement, zero auth incidents, AI-generated Playwright tests → faster releases with compliant data handling."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"In a 2025 Razorpay/CRED machine-coding round, what is primarily assessed?",o:["Clean, extensible design — the interviewer adds a feature live to test it","Raw typing speed and IDE shortcut fluency","Knowledge of the company's actual production stack","Optimal time complexity of every helper function"],c:0,e:"Machine coding runs 90–120 minutes with vanilla code and in-memory data. They grade cleanliness, extensibility and SOLID — the live feature addition is the real test. The wider loop: OA (2 DSA, ~85% cutoff), DSA-1 medium, DSA-2 hard with emphasis on articulating the approach first, machine coding, then LLD."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"In Splitwise's <code>simplifyDebts</code>, what does the greedy algorithm do at each step?",o:["Match the largest creditor with the largest debtor and settle the smaller of the two amounts","Settle every original transaction in the order received","Pair each debtor with the geographically nearest creditor","Split each debt equally across all creditors"],c:0,e:"First compute each person's net balance, then repeatedly pair max-creditor with max-debtor, settling <code>min(|debt|, credit)</code> — that zeroes at least one party per transaction. On <code>[['A','B',100],['B','C',50],['C','A',30]]</code> the nets are A −70, B +50, C +20, giving A→B 50 and A→C 20."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"A payment retry arrives while the original request is still in STARTED state. What is correct?",o:["Wait with a timeout, or return 409 Conflict — the same request is still in flight","Process it as a new payment","Return the cached response from the previous attempt","Delete the idempotency record and start over"],c:0,e:"The state machine is NEW → STARTED (row inserted under a unique <code>Idempotency-Key</code>) → COMPLETED (response cached) or FAILED (error cached). A retry in STARTED means the first attempt hasn't finished; treating it as new double-charges. There's no cached response to return yet, so wait or 409."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"What is the defining rule of a double-entry ledger?",o:["Ledger tables are append-only — you insert journal entries and re-derive balances, never UPDATE a balance row","Every account must maintain a non-negative balance","Each transaction touches exactly one account","Balances are recomputed nightly from the PSP's statement"],c:0,e:"Every debit has an equal and opposite credit, and history is immutable — which is what makes reconciliation and audit possible. This is how Razorpay and Stripe work. Updating a balance column in place destroys the audit trail and makes discrepancies untraceable."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"In a UPI collect flow, which actor prompts the payer for their mPIN?",o:["The payer's own bank, pushed into their UPI app","The merchant's payment gateway","NPCI directly","PhonePe's backend"],c:0,e:"Push = you pay someone; collect = someone requests money from you, which needs payer 2FA. The chain is merchant → PhonePe → payer PSP → NPCI → payer's bank; the bank raises the mPIN prompt, verifies it, and debits its leg. NPCI is the switch between banks, not the authenticator."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"How does Zepto pick a dark store per order in under 100ms?",o:["Geohash the customer location and look up a pre-computed store-reachability table","Compute road distance to all 3000 stores in real time","Always route to the store with the most inventory","Ask the customer to select their nearest store"],c:0,e:"Customer lat/lng → geohash at resolution 6 (~1.2km) → pre-computed <code>store_reachability</code> mapping. The second hard problem is over-sell prevention when two orders race for the last unit — that needs an atomic decrement, not a read-then-write."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"How does Swiggy narrow the rider candidate pool for a new order?",o:["Look up the order's S2 cell plus its 8 neighbours in Redis sorted sets of live rider locations","Query Postgres for all riders within a 5km radius","Broadcast the order to every online rider and take the first accept","Use a nightly-precomputed rider-to-restaurant assignment"],c:0,e:"The city is partitioned into S2 cells at level 15 (~200m); riders <code>ZADD</code> their location into <code>live_riders:{cell_id}</code>. For an order you <code>ZRANGE</code> the cell and its 8 neighbours, union, then filter and score on proximity, rating, current load, SLA and restaurant prep time — two-sided optimisation inside a 2-second budget."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"A CRED user spent reward coins that are later revoked by a chargeback. How does the ledger handle it?",o:["Append a reversal journal entry — the balance may legitimately go negative and is recovered later","Update the original grant row to zero","Delete the grant and all downstream burn entries","Block the user's account until the balance is repaid"],c:0,e:"Rewards are money-adjacent, so the same append-only double-entry rules apply: <code>coin_journal</code> rows carry a signed amount and a reason (<code>reward_grant</code>, <code>burn_offer</code>, <code>expiry</code>, reversal). Mutating or deleting history destroys auditability and turns every dispute into a support ticket."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"Why implement a distributed rate limiter as a Redis Lua script?",o:["The whole check-and-increment runs atomically, so 10 pods can't collectively exceed the limit","Lua executes faster than Redis native commands","It avoids needing a Redis connection pool","Lua scripts are automatically replicated to every replica synchronously"],c:0,e:"Separate <code>ZREMRANGEBYSCORE</code> / <code>ZCARD</code> / <code>ZADD</code> calls interleave across pods, letting each see a stale count — the classic '3× the limit' bug. A single Lua script runs atomically on the server: drop entries older than the window, count, and admit or reject in one step."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"In an LRU cache with TTL, what does \"lazy expiry\" mean?",o:["Entries are checked for expiry on access rather than swept by a background timer","Expired entries are removed only when the cache is full","TTL is extended automatically on every read","Expiry runs on a separate thread every second"],c:0,e:"Checking <code>expiresAt</code> when a key is touched keeps <code>get</code>/<code>put</code> at O(1) with no timer overhead. The trade is that unaccessed expired entries hold memory until evicted by LRU pressure. Structure stays hash map + doubly linked list."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"In a Flipkart flash sale, what stops 10M users from ever reaching the inventory service?",o:["An edge waiting room that dispenses only ~2× inventory in tokens — no token means \"sold out\" at the door","Aggressive autoscaling of the inventory pods","A CAPTCHA on the product page","Rate limiting per user account"],c:0,e:"You cannot scale your way through 10M concurrent requests for 1M units — you shed load before it arrives. CloudFront or Cloudflare Workers admit N users/sec and hold the rest behind a countdown; token dispensing caps who can even try. Behind that, Redis holds the counter with atomic <code>DECR</code> per SKU."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"Which window frame produces a running balance per user?",o:["<code>SUM(amount) OVER (PARTITION BY user_id ORDER BY ts ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)</code>","<code>SUM(amount) OVER (PARTITION BY user_id)</code>","<code>SUM(amount) OVER (ORDER BY ts)</code> with no partition","<code>SUM(amount) GROUP BY user_id, ts</code>"],c:0,e:"<code>PARTITION BY user_id</code> restarts the running total per user, <code>ORDER BY ts</code> defines the accumulation order, and the explicit frame makes it cumulative rather than the whole partition. Omitting the partition sums across all users; omitting <code>ORDER BY</code> gives a partition-wide total on every row."},
{s:"india-product",l:"india",t:"backend databases frontend",q:"In a toast-queue machine-coding round, what is the interviewer really testing?",o:["Whether your design absorbs live feature additions — undo buttons, promise-based toasts, dedup by id","Whether you can write CSS keyframe animations from memory","Whether you know the internals of <code>createPortal</code>","Whether you can avoid using any state library"],c:0,e:"The brief (max 3 visible, auto-dismiss after 3s, new toasts push older ones out) is the starting point, not the destination. A Zustand store plus a portal and CSS transitions gives clean separation, so bolting on new behaviour touches one layer instead of rewriting the component."},
{s:"practice",l:"startup",t:"frontend backend",q:"What is the correct <code>reduce</code> for summing a <code>value</code> field?",o:["<code>data.reduce((sum, obj) =&gt; sum + obj.value, 0)</code>","<code>data.reduce((sum, obj) =&gt; sum + obj.value)</code>","<code>data.reduce((sum, obj) =&gt; { sum + obj.value }, 0)</code>","<code>data.map((obj) =&gt; obj.value).reduce(0)</code>"],c:0,e:"Two things to get right every time: pass the initial value <code>0</code> (without it, reduce uses the first <b>object</b> as the seed), and actually <b>return</b> the accumulator — a braced arrow body with no <code>return</code> yields <code>undefined</code>."},
{s:"practice",l:"startup",t:"frontend backend",q:"To total <code>quantity × price</code> across products, what goes in the reducer body?",o:["<code>sum + obj.price * obj.quantity</code>","<code>sum + obj.price + obj.quantity</code>","<code>sum * obj.price * obj.quantity</code>","<code>sum + (obj.price ?? obj.quantity)</code>"],c:0,e:"Multiply within each item, then add to the accumulator: 2×800 + 5×20 + 1×50 = 1750. The same shape covers 'total including shipping' — just add both fields per item: <code>sum + obj.total + obj.shippingCost</code>."},
{s:"practice",l:"startup",t:"frontend backend",q:"Why compute the average as <code>sum / data.length</code> after reduce rather than dividing inside it?",o:["Dividing inside the reducer applies the division on every step, producing the wrong result","<code>data.length</code> isn't available inside a reducer callback","Reduce cannot return a floating-point number","It avoids a division-by-zero error on empty arrays"],c:0,e:"Accumulate the total first, then divide once. (90 + 78 + 92) / 3 = 86.67. Dividing per iteration compounds and gives nonsense — and it's a genuinely common bug in interview code."},
{s:"practice",l:"mid",t:"frontend backend",q:"How do you handle credit and debit inside a single reduce?",o:["Branch on the type: <code>obj.transactionType === 'credit' ? sum + obj.amount : sum - obj.amount</code>","Filter to credits, reduce, then subtract the debit count","Use <code>Math.abs</code> on every amount before adding","Sort by type first, then reduce each group separately"],c:0,e:"A ternary inside the reducer keeps it one pass. +100 −30 +50 −20 = 100. The same conditional-accumulator shape covers running a max: <code>data.reduce((max, obj) =&gt; Math.max(max, obj.salary), 0)</code>, or the one-liner <code>Math.max(...data.map(d =&gt; d.salary))</code>."},
{s:"practice",l:"mid",t:"frontend backend",q:"To count students per course from <code>{name, courses: []}</code>, what does the reducer do?",o:["Iterate each student's <code>courses</code> array and bump <code>counts[course]</code>, seeded with <code>{}</code>","Flatten all courses first, then use <code>Set</code> to count","Reduce into an array of pairs and convert with <code>Object.entries</code>","Sort courses alphabetically, then count consecutive runs"],c:0,e:"An inner <code>forEach</code> over each student's courses with <code>counts[course] = (counts[course] || 0) + 1</code>. The <code>|| 0</code> handles the first sighting of a key. Same nested shape totals hours per employee or sales per product — an inner reduce over the array field."},
{s:"practice",l:"mid",t:"frontend backend",q:"What is the single most important argument in the group-and-sum reduce pattern?",o:["The initial value <code>{}</code> — without it reduce seeds with the first element and crashes","The index parameter, needed to detect the first iteration","The <code>thisArg</code>, which sets the accumulator context","The array reference, to look ahead at the next element"],c:0,e:"<code>data.reduce((acc, cur) =&gt; { acc[cur.name] = (acc[cur.name] || 0) + cur.sal; return acc; }, {})</code>. Omit the <code>{}</code> and the first object becomes the accumulator, so you mutate your input and produce garbage. This grouping pattern is worth memorising — it appears in nearly every JS interview."},
{s:"practice",l:"startup",t:"frontend backend",q:"Which palindrome check uses O(1) extra space?",o:["Two pointers converging from both ends","<code>str === str.split('').reverse().join('')</code>","Pushing every character to a stack and popping","Building a reversed copy with a <code>for</code> loop"],c:0,e:"The two-pointer walk compares in place and exits early on the first mismatch. The <code>split/reverse/join</code> one-liner is fine to state for readability but allocates a full array and a new string — worth naming the trade-off out loud."},
{s:"practice",l:"startup",t:"frontend backend",q:"What is the caveat with <code>Math.max(...arr)</code> on a large array?",o:["Spreading exceeds the call-stack argument limit around ~100k elements","It returns <code>NaN</code> for arrays longer than 1000","It sorts the array as a side effect","It only considers the first 65,536 elements"],c:0,e:"Spread passes each element as a separate argument, and engines cap argument count. For big arrays use a loop or <code>reduce</code>. Related one-liners worth knowing: <code>[...new Set(arr)]</code> for unique elements, and <code>Array.from(new Set(arr))</code> as the equivalent."},
{s:"practice",l:"mid",t:"frontend backend",q:"Why does a primality check only need to test divisors up to √n?",o:["If n = a·b with a ≤ b, then a ≤ √n — so any factor pair has its smaller member below the root","Numbers above √n are always prime themselves","It's an approximation that trades accuracy for speed","Beyond √n the modulo operation overflows"],c:0,e:"Any composite has a factor at or below its square root, so finding none proves primality. The optimised loop handles <code>n &lt; 2</code>, special-cases 2, rejects even numbers, then steps <code>i += 2</code> from 3 while <code>i * i &lt;= n</code>."},
{s:"practice",l:"mid",t:"frontend backend",q:"Which counts character occurrences in a string?",o:["<code>for (const c of str) count[c] = (count[c] || 0) + 1</code>","<code>str.split('').map(c =&gt; count[c]++)</code>","<code>new Set(str).size</code>","<code>str.reduce((a, c) =&gt; a + c, {})</code>"],c:0,e:"The <code>|| 0</code> seeds each key on first sight. Strings are iterable, so <code>for...of</code> walks characters directly. <code>Set</code> gives distinct count, not per-character frequency, and strings have no <code>reduce</code>."},
{s:"practice",l:"startup",t:"frontend backend",q:"Which dedupe approach preserves first-occurrence order and works without <code>Set</code>?",o:["<code>arr.filter((item, i) =&gt; arr.indexOf(item) === i)</code>","<code>arr.sort().filter((x, i, a) =&gt; x !== a[i-1])</code>","<code>Object.keys(arr)</code>","<code>arr.reverse().filter(Boolean)</code>"],c:0,e:"<code>indexOf</code> returns the <b>first</b> match, so keeping only items whose index equals it drops later duplicates. It's O(n²) though — <code>[...new Set(arr)]</code> is O(n) and also order-preserving, so prefer it and mention the filter version as the pre-ES6 fallback."},
{s:"practice",l:"mid",t:"frontend backend",q:"Why does <code>[10, 2, 1].sort()</code> return <code>[1, 10, 2]</code>?",o:["The default sort converts elements to strings and compares lexicographically","<code>sort</code> only handles arrays of length 2 or more correctly","It sorts descending by default","<code>sort</code> mutates the array, corrupting the indices mid-pass"],c:0,e:"Always pass a comparator for numbers: <code>[...arr].sort((a, b) =&gt; a - b)</code>. Note <code>sort</code> mutates in place, hence the spread copy. The built-in is O(n log n) TimSort; bubble sort, the interview-friendly manual version, is O(n²)."},
{s:"practice",l:"mid",t:"frontend backend",q:"What is the one-liner for the largest value in a nested array?",o:["<code>Math.max(...arr.flat())</code>","<code>Math.max(arr.flat())</code>","<code>arr.flat().sort().pop()</code>","<code>Math.max(...arr)</code>"],c:0,e:"<code>flat()</code> collapses one level, then spread passes each number as a separate argument. Without spread, <code>Math.max</code> receives one array and returns <code>NaN</code>. Use <code>flat(Infinity)</code> for arbitrary depth."},
{s:"practice",l:"mid",t:"frontend backend",q:"In the best buy-sell profit problem, what do you track in a single pass?",o:["The running minimum so far and the best difference seen","The maximum and minimum of the whole array","The index of the largest element","A sorted copy of the prices"],c:0,e:"For each price: if it's below the running minimum, update the minimum; otherwise check whether <code>price - min</code> beats the best. On <code>[4,20,30,25,15]</code> that gives 30 − 4 = 26. O(n) time, O(1) space — the answer to give instead of the O(n²) nested loop."},
{s:"practice",l:"mid",t:"frontend backend",q:"Which is the O(n) way to find the second-smallest element?",o:["One pass tracking <code>first</code> and <code>second</code>, both seeded to <code>Infinity</code>","Sort ascending and take index 1","Remove the minimum, then take the new minimum","Build a min-heap and pop twice"],c:0,e:"When a value beats <code>first</code>, demote <code>first</code> into <code>second</code>; otherwise update <code>second</code> if the value sits between them and differs from <code>first</code>. Sorting is O(n log n) and fine to mention, but the two-tracker pass is what interviewers want."},
{s:"practice",l:"startup",t:"frontend backend",q:"Why initialise a max-finding loop with <code>-Infinity</code> rather than <code>0</code>?",o:["<code>0</code> returns the wrong answer for an array of all negative numbers","<code>-Infinity</code> is faster to compare against","<code>0</code> causes a type error when compared to floats","<code>-Infinity</code> makes the loop exit early on the first element"],c:0,e:"With <code>max = 0</code>, an array like <code>[-5, -2, -9]</code> wrongly returns 0. Use <code>-Infinity</code> or <code>arr[0]</code>. This exact bug appears in the original code in the notes — a good one to catch out loud in an interview."},
{s:"practice",l:"startup",t:"frontend backend",q:"What does <code>arr.filter(Boolean)</code> remove?",o:["All falsy values — <code>null</code>, <code>undefined</code>, <code>0</code>, <code>\"\"</code>, <code>false</code>, <code>NaN</code>","Only <code>null</code> and <code>undefined</code>","Only <code>false</code> values","Everything except booleans"],c:0,e:"<code>Boolean</code> used as the callback coerces each element, so only truthy values survive. Careful: it also drops legitimate <code>0</code> values — if zero is meaningful, filter explicitly with <code>x != null</code> instead."},
{s:"practice",l:"mid",t:"frontend backend",q:"When zip-merging two arrays of different lengths, what governs the loop bound?",o:["<code>Math.max(a.length, b.length)</code>, with a length guard before each push","<code>Math.min(a.length, b.length)</code>, dropping the remainder","<code>a.length</code>, since the first array leads","The sum of both lengths"],c:0,e:"Loop to the longer length and guard each push with <code>if (i &lt; a.length)</code> so leftovers from the longer array still land. Using <code>min</code> silently truncates. Plain concatenation (<code>[...a, ...b]</code>) is a different operation — not interleaved."},
{s:"practice",l:"startup",t:"frontend backend",q:"What is the cleanest single-pass way to split an array into odds and evens?",o:["<code>reduce</code> into <code>{oddArr: [], evenArr: []}</code>, pushing into the right bucket","Two separate <code>filter</code> calls","<code>sort</code> by parity, then <code>slice</code> at the boundary","<code>Object.groupBy</code> with a numeric key"],c:0,e:"<code>(n % 2 === 0 ? acc.evenArr : acc.oddArr).push(n)</code> touches each element once. Two <code>filter</code> passes are perfectly readable and fine for small arrays — just name the trade-off if the interviewer asks about large inputs."},
{s:"practice",l:"mid",t:"frontend backend",q:"In a random-string generator, what should <code>Math.random()</code> be multiplied by?",o:["<code>chars.length</code> — the size of the character set","<code>length</code> — the desired output length","<code>26</code>, the size of the alphabet","<code>1</code>, then scaled with <code>toFixed</code>"],c:0,e:"You're picking an index into the charset, so the multiplier must be the charset size. Multiplying by the output length is the bug in the original code — it restricts you to the first N characters of the charset and produces a much weaker string."},
{s:"practice",l:"mid",t:"frontend backend",q:"What is the O(1)-space way to get the n-th Fibonacci number?",o:["Two rolling variables updated with <code>[a, b] = [b, a + b]</code>","Recursion with a base case at <code>n &lt; 2</code>","Building the full sequence array and indexing it","Binet's formula with <code>Math.pow</code>"],c:0,e:"Rolling variables avoid both the O(n) array and the O(2ⁿ) blowup of naive recursion. If you need the whole sequence, seed <code>[0, 1]</code> and push <code>seq[i-1] + seq[i-2]</code>. Memoised recursion is the middle ground worth naming."},
{s:"practice",l:"startup",t:"frontend backend",q:"What is the modern idiomatic way to swap two variables in JS?",o:["<code>[a, b] = [b, a]</code> — array destructuring","<code>a = a ^ b; b = a ^ b; a = a ^ b</code>","<code>a += b; b = a - b; a -= b</code>","<code>[a, b].reverse()</code>"],c:0,e:"Destructuring is clear and works for any type. The XOR trick only works on integers and breaks if both names reference the same variable; the arithmetic version risks overflow and float precision. Mention them as trivia, use destructuring."},
{s:"practice",l:"mid",t:"frontend backend",q:"What are the three states of a Promise?",o:["Pending → fulfilled or rejected","Created → running → finished","Idle → active → settled → cleared","Open → resolved → closed"],c:0,e:"A promise starts pending and settles exactly once, into fulfilled (<code>.then</code>) or rejected (<code>.catch</code>) — it can never change again. <code>async/await</code> is sugar over the same object: <code>await</code> unwraps the fulfilled value or throws the rejection into your <code>try/catch</code>."},
{s:"jwt-notes",l:"startup",t:"backend",q:"Which RFC defines JWT?",o:["RFC 7519","RFC 6749","RFC 2616","RFC 8446"],c:0,e:"RFC 7519 defines the JWT format. (RFC 6749 is OAuth 2.0 and RFC 8446 is TLS 1.3 — worth not confusing in an interview.) The defining property is self-containment: the token carries identity and claims, so the server needn't hit the database on every request."},
{s:"jwt-notes",l:"startup",t:"backend",q:"Which JWT part specifies the signing algorithm?",o:["The header","The payload","The signature","A separate <code>alg</code> query parameter"],c:0,e:"Header = metadata (<code>alg</code> like HS256/RS256, <code>typ</code>). Payload = claims (user id, roles, <code>exp</code>, <code>iat</code>) — Base64URL-encoded, not encrypted, so readable by anyone holding the token. Signature = header + payload signed with a secret (HMAC) or private key (RSA)."},
{s:"jwt-notes",l:"mid",t:"backend",q:"What does the server typically store in its database regarding JWTs?",o:["Only a revocation blacklist and refresh-token records — never the access tokens","Every issued access token, for verification","A hash of each access token","Nothing at all, under any design"],c:0,e:"Access tokens stay client-side (memory, <code>localStorage</code>, or an <code>httpOnly</code> cookie), and the server verifies them by signature alone — that's the whole point of statelessness. What you do persist is the state you need for revocation: a blacklist and refresh-token family records."},
{s:"jwt-notes",l:"mid",t:"backend",q:"How does the server verify a JWT signature?",o:["Re-sign the received header and payload with the same key and compare against the token's signature","Decrypt the signature to recover the payload and compare","Look the token up in a signature table","Ask the issuer's server to confirm the token"],c:0,e:"Verification is recomputation, not decryption — a signature isn't encrypted content. A mismatch means the payload was tampered with or a different key signed it, so you reject. <code>jwt.verify(token, SECRET)</code> also checks <code>exp</code> and throws on expiry."},
{s:"jwt-notes",l:"mnc",t:"backend",q:"Why is RS256 required once multiple services verify tokens?",o:["Verifiers only need the public key, so they can't forge tokens the way a shared HS256 secret would allow","RS256 tokens are smaller over the wire","HS256 doesn't support expiry claims","RS256 is faster to verify than HS256"],c:0,e:"With HS256 the same secret signs and verifies, so any service that can check a token can also mint one — one compromised service compromises everything. RS256 keeps the private key in the auth service and distributes the public key (often via a JWKS endpoint). It's slower, and that's the accepted trade."},
{s:"mongo-notes",l:"startup",t:"databases",q:"In what format does MongoDB physically store documents?",o:["BSON — Binary JSON","Plain JSON text","Protocol Buffers","Avro"],c:0,e:"BSON is binary-encoded, which adds types JSON lacks (<code>ObjectId</code>, <code>Date</code>, <code>Decimal128</code>) and makes traversal faster. The dynamic schema means documents in one collection can differ in shape — which is exactly why TimeMoney used it for transaction history sourced from varied integrations."},
{s:"mongo-notes",l:"startup",t:"databases",q:"In the SQL vs NoSQL comparison, which pairing is correct?",o:["SQL follows ACID and scales vertically; NoSQL is framed by CAP and scales horizontally","SQL scales horizontally; NoSQL scales vertically","Both follow ACID; only the query language differs","NoSQL is better for complex joins than SQL"],c:0,e:"SQL: fixed schema, strong joins, vertical scaling, ACID (Postgres, MySQL, Oracle). NoSQL: dynamic schema, hierarchical data, horizontal scaling, CAP trade-offs (Mongo, Cassandra, Neo4j). The line to use: 'Mongo for variable-shape data, Postgres for ledger consistency.'"},
{s:"mongo-notes",l:"startup",t:"databases",q:"Which shell command switches to — and creates if absent — a database?",o:["<code>use myDB</code>","<code>show dbs</code>","<code>db.createDatabase(\"myDB\")</code>","<code>db.getSiblingDB(\"myDB\").init()</code>"],c:0,e:"<code>use</code> is lazy: the database materialises only once you write to it. Companions worth knowing cold: <code>show dbs</code>, <code>show collections</code>, <code>db.createCollection()</code>, <code>db.users.insertOne/insertMany/find/findOne/updateOne</code>, <code>db.users.drop()</code>, <code>db.dropDatabase()</code>."},
{s:"mongo-notes",l:"mid",t:"databases",q:"When must a MongoDB field name be quoted?",o:["When it contains a dot, space or special character, starts with a digit, or is a reserved word","Only when the value is a string","Always — Mongo rejects unquoted keys","Only inside <code>insertMany</code> calls"],c:0,e:"Mongo accepts unquoted JS-style keys otherwise. The dot case matters most: <code>\"address.city\"</code> is interpreted as a nested path, not a literal key with a dot in it — a subtle source of bugs when importing external data."},
{s:"mongo-notes",l:"mid",t:"databases",q:"By default, what happens if one document fails during <code>insertMany</code>?",o:["The insert is ordered, so remaining documents are skipped","All documents are rolled back atomically","The failing document is skipped and the rest continue","The entire collection is locked until resolved"],c:0,e:"Default is <code>{ordered: true}</code> — it stops at the first error. Pass <code>{ordered: false}</code> to keep going and collect the failures, which is what you want for bulk imports. Note neither mode is a transaction: successfully inserted documents stay inserted."},
{s:"git-notes",l:"startup",t:"infra",q:"Which statement about Git and GitHub is accurate?",o:["Git is the distributed VCS and runs locally; GitHub is a hosting platform built around it","GitHub is the VCS and Git is its command-line client","They are the same product under two names","Git requires GitHub to track branches"],c:0,e:"Git works entirely offline — history, branches and merges are local. GitHub adds remote hosting, pull requests, code review, Actions and Issues. You can use Git with GitLab, Bitbucket or a self-hosted remote; the dependency only runs one way."},
{s:"git-notes",l:"startup",t:"infra",q:"What does omitting <code>--global</code> from <code>git config</code> do?",o:["Applies the setting only to the current repository","Makes the setting temporary until the shell exits","Applies it system-wide to all users","Has no effect — <code>--global</code> is the default"],c:0,e:"Repo-local config overrides global, which is exactly how you use a work email on one project and a personal one elsewhere. Verify with <code>git config --list</code>."},
{s:"git-notes",l:"startup",t:"infra",q:"A tracked file has edits that haven't been <code>git add</code>ed. What state is it in?",o:["Modified","Untracked","Staged","Unmodified"],c:0,e:"The four states: untracked (Git doesn't know it), modified (tracked, edited, not staged), staged (queued via <code>git add</code>), unmodified (matches the last commit). <code>git status</code> reports all of them — make reading it a reflex before <code>git add .</code>."},
{s:"git-notes",l:"mid",t:"infra",q:"Which command creates a branch and switches to it in one step?",o:["<code>git checkout -b feature/x</code>","<code>git branch feature/x</code>","<code>git branch -M feature/x</code>","<code>git merge -b feature/x</code>"],c:0,e:"<code>git branch</code> alone creates without switching; <code>-M</code> renames the current branch; <code>-d</code> deletes safely and <code>-D</code> forces. Modern Git offers the clearer <code>git switch -c feature/x</code>, which is worth mentioning as the current idiom."},
{s:"git-notes",l:"mid",t:"infra",q:"Why are pull requests preferred over merging locally into main?",o:["They add review, CI gates and an audit trail, and prevent accidentally merging unreviewed code","They produce smaller diffs","They avoid merge conflicts entirely","They are faster than a local merge"],c:0,e:"A local <code>checkout main → pull → merge → push</code> works, but nothing verifies the change. A PR runs CI, collects review, records the discussion, and can be protected by branch rules. Conflicts still happen either way."},
{s:"git-notes",l:"mid",t:"infra",q:"After manually fixing conflict markers, what completes the merge?",o:["<code>git add</code> each resolved file, then <code>git commit</code>","<code>git merge --continue</code> only, with no staging","<code>git reset --hard</code> then re-merge","<code>git stash</code> then <code>git pull</code>"],c:0,e:"Staging is how you signal a file is resolved; the commit then closes the merge with an auto-filled message. Remember to delete all three markers — <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>. For gnarly conflicts, <code>git mergetool</code> or VS Code's 3-way diff."},
{s:"git-notes",l:"mid",t:"infra",q:"Which <code>git reset</code> mode discards uncommitted work in the working directory?",o:["<code>--hard</code>","<code>--soft</code>","<code>--mixed</code>","<code>--keep</code>"],c:0,e:"<code>--soft</code> moves HEAD and keeps both staging and working directory. <code>--mixed</code> (the default) clears staging but keeps your files. <code>--hard</code> clears both — the changes are gone. Find your target hash with <code>git log --oneline</code> first, and remember <code>git reflog</code> can rescue committed work."},
{s:"git-notes",l:"mid",t:"infra",q:"After forking a repo, how do you pull in later upstream changes?",o:["Add the original as an <code>upstream</code> remote, then fetch and merge <code>upstream/main</code>","Delete the fork and re-fork it","Open a PR from upstream into your fork","Run <code>git pull --force origin main</code>"],c:0,e:"<code>git remote add upstream &lt;original-url&gt;</code>, then <code>fetch upstream</code>, <code>merge upstream/main</code>, and push to your <code>origin</code>. The open-source loop: fork → clone your fork → branch → push → PR back to upstream."},
{s:"git-notes",l:"mid",t:"infra",q:"What does <code>git diff --staged</code> show?",o:["Staged changes compared against the last commit","Unstaged working-tree changes","Differences between two branches","Every change since the branch was created"],c:0,e:"Plain <code>git diff</code> shows what you haven't staged yet; <code>--staged</code> (or <code>--cached</code>) shows what's queued for the next commit. Reviewing it before committing is the habit that catches stray <code>.env</code> files and build artifacts."},
{s:"js-react-notes",l:"startup",t:"frontend",q:"What keeps <code>count</code> alive between calls to the function returned by <code>counter()</code>?",o:["The closure over the outer function's scope","A global variable created implicitly","The function's <code>prototype</code> chain","JavaScript's garbage collector deferring cleanup"],c:0,e:"The inner function retains a reference to its defining scope, so <code>count</code> survives after <code>counter()</code> returns and isn't collected. That mechanism powers memoisation, currying, private state, and every debounce implementation you'll write."},
{s:"js-react-notes",l:"mid",t:"frontend",q:"Which argument to <code>addEventListener</code> enables the capture phase?",o:["<code>true</code> as the third argument","<code>false</code> as the third argument","<code>{ once: true }</code>","<code>{ passive: true }</code>"],c:0,e:"Capturing runs root → target and is opt-in; bubbling runs target → root and is the default (<code>false</code>). Event delegation relies on bubbling. <code>passive</code> and <code>once</code> are unrelated options controlling scroll-blocking and auto-removal."},
{s:"js-react-notes",l:"startup",t:"frontend",q:"What does this print?<br><code>var a = 10; { var a = -10; } let b = a; { let b = -20; } console.log(b);</code>",o:["-10","-20","10","<code>undefined</code>"],c:0,e:"<code>var</code> is function-scoped, so the block's <code>var a = -10</code> overwrites the outer <code>a</code>. <code>b</code> is then assigned −10. The inner <code>let b = -20</code> is block-scoped and never leaks out, leaving the outer <code>b</code> at −10."},
