{s:"js-react-notes",l:"startup",t:"frontend",q:"Which array method returns a single element rather than an array?",o:["<code>find()</code>","<code>filter()</code>","<code>map()</code>","<code>slice()</code>"],c:0,e:"<code>find</code> returns the first match or <code>undefined</code>; <code>filter</code> always returns an array, possibly empty. Also keep the mutating/non-mutating split straight: <code>splice</code>, <code>push</code>, <code>sort</code> and <code>reverse</code> mutate; <code>map</code>, <code>filter</code>, <code>slice</code> and <code>concat</code> don't."},
{s:"js-react-notes",l:"startup",t:"frontend",q:"Why can you call a function declaration before its definition but not a function expression?",o:["Declarations are fully hoisted with their body; expressions only hoist the variable binding","Expressions are compiled lazily at first call","Declarations are cached by the JIT","Expressions require an explicit <code>return</code>"],c:0,e:"<code>function foo() {}</code> is hoisted whole, so <code>foo()</code> works above it. <code>const foo = function () {}</code> hoists only <code>foo</code> — which sits in the TDZ with <code>const</code>/<code>let</code>, or is <code>undefined</code> with <code>var</code>, so calling it throws either way."},
{s:"js-react-notes",l:"startup",t:"frontend",q:"What does <code>0 == '0'</code> evaluate to, and why?",o:["<code>true</code> — <code>==</code> coerces the string to a number","<code>false</code> — different types never compare equal","<code>true</code> — both are falsy","<code>false</code> — strings are compared by reference"],c:0,e:"Loose equality coerces, so <code>0 == '0'</code> is <code>true</code> while <code>0 === '0'</code> is <code>false</code>. The one special case worth remembering: <code>null == undefined</code> is <code>true</code>, but <code>null === undefined</code> is <code>false</code>. ESLint's <code>eqeqeq</code> rule enforces the strict form."},
{s:"js-react-notes",l:"startup",t:"frontend",q:"What is the layout difference between <code>visibility: hidden</code> and <code>display: none</code>?",o:["<code>visibility: hidden</code> keeps the element's space; <code>display: none</code> removes it from flow","They are identical except for screen-reader behaviour","<code>display: none</code> keeps the space; <code>visibility: hidden</code> removes it","Neither affects layout — both are paint-only"],c:0,e:"<code>visibility: hidden</code> leaves a gap where the element was; <code>display: none</code> makes the layout reflow to close it. <code>opacity: 0</code> also preserves space but, unlike <code>visibility: hidden</code>, still receives pointer events."},
{s:"js-react-notes",l:"startup",t:"frontend",q:"Which is true of margin but not padding?",o:["It can be negative and can be set to <code>auto</code>","The background colour extends into it","It sits inside the border","It cannot be set per-side"],c:0,e:"Margin is outside the border: negative values and <code>auto</code> (the centring trick) both work, and the background never reaches it. Padding is inside the border: always non-negative, no <code>auto</code>, and the background colour does extend through it."},
{s:"react-qa-notes",l:"startup",t:"frontend",q:"What is the standard \"limitation of React\" answer?",o:["It's a library, not a framework — you bring your own routing and state management","It cannot handle forms without a third-party library","It only works with class components","It requires a build step that other frameworks avoid"],c:0,e:"React ships the view layer; routing, state and data fetching are your choices. The other honest limitations: no SEO out of the box for a client-rendered SPA (which is what Next.js solves), and documentation that goes stale because the ecosystem moves fast."},
{s:"react-qa-notes",l:"startup",t:"frontend",q:"What exactly is prop drilling?",o:["Passing props through intermediate components that don't use them, purely to reach a deeper child","Passing too many props to a single component","Mutating props inside a child component","Passing props upward from child to parent"],c:0,e:"The intermediate components become couriers for data they don't care about, so any shape change ripples through all of them. Fixes: <code>useContext</code> for app-wide values, component composition via <code>children</code>, or a store like Zustand or Redux."},
{s:"react-qa-notes",l:"mid",t:"frontend",q:"When is Context API the better choice over Redux?",o:["For low-frequency state like theme or locale in a smaller app","For high-frequency updates needing time-travel debugging","For caching server responses with automatic revalidation","For any state shared by more than two components"],c:0,e:"Context re-renders every consumer when the value changes, so it suits infrequently-changing values. Redux adds structure, devtools and time-travel for large apps with frequent updates. Neither is right for server state — that's React Query or SWR."},
{s:"react-qa-notes",l:"mid",t:"frontend",q:"In Redux, what is a reducer?",o:["A pure function of <code>(state, action)</code> that returns the next state","An object describing what happened","The single source of truth holding all app state","A middleware that handles async side effects"],c:0,e:"The three pieces: <b>action</b> = a plain object saying what happened (<code>{type, payload}</code>) — the what, not the how; <b>reducer</b> = the pure <code>(state, action) =&gt; newState</code> function; <b>store</b> = the single source of truth. Purity is what makes time-travel debugging possible."},
{s:"react-qa-notes",l:"mid",t:"frontend",q:"What is the constraint on where hooks can be called?",o:["Only at the top level of a function component or another custom hook","Only inside <code>useEffect</code> callbacks","Only after the first render completes","Only in components that are default exports"],c:0,e:"React matches hooks to state by call order, so conditions, loops, nested functions and class components all break the mapping. Hooks (React 16.8+) exist to give function components the state and lifecycle features that used to be class-only."},
{s:"react-qa-notes",l:"mid",t:"frontend",q:"Which statement about state and props is correct?",o:["State is mutable and owned by the component; props are immutable and come from the parent","Both are mutable, but only state triggers re-renders","Props are mutable; state is frozen after the first render","Neither can change after mount"],c:0,e:"State is updated through its setter and belongs to the component. Props flow down and must never be mutated by the child — to change them, the parent updates its own state and re-renders. That one-way data flow is what keeps React predictable."},
{s:"react-qa-notes",l:"mid",t:"frontend",q:"What is a Higher Order Component?",o:["A function that takes a component and returns a new, enhanced component","A component rendered above all others in the tree","A component that only renders other components","A class component wrapping a function component"],c:0,e:"<code>withAuth(Component)</code> is the classic shape — it wraps and adds behaviour. Typical uses: auth guards, logging, theming, drag-and-drop. Custom hooks have largely replaced HOCs for logic reuse, which is a good point to raise unprompted."},
{s:"react-qa-notes",l:"mid",t:"frontend",q:"What does <code>React.lazy</code> require alongside it?",o:["A <code>&lt;Suspense&gt;</code> boundary with a fallback","A <code>useEffect</code> to trigger the import","An error boundary, which is mandatory","A <code>'use client'</code> directive"],c:0,e:"<code>React.lazy(() =&gt; import('./Dashboard'))</code> returns a component that suspends while its chunk loads, so <code>&lt;Suspense fallback={...}&gt;</code> must be above it. Pairs naturally with route-based code splitting. An error boundary is strongly recommended for failed chunk loads but isn't required."},
{s:"react-qa-notes",l:"mid",t:"frontend",q:"Why use a Fragment instead of a wrapper <code>&lt;div&gt;</code>?",o:["It groups children without adding a node to the DOM","It renders faster than a <code>div</code>","It automatically applies flex layout","It scopes CSS to its children"],c:0,e:"Extra wrapper elements break layouts that depend on direct parent-child relationships — table rows, flex and grid children, list items. <code>&lt;&gt;...&lt;/&gt;</code> is the short form; use the long <code>&lt;React.Fragment key={...}&gt;</code> when you need a key in a list."},
{s:"react-qa-notes",l:"mid",t:"frontend",q:"What does <code>props.children</code> enable?",o:["Composition — a component renders arbitrary JSX passed in by its parent","Two-way data binding between parent and child","Access to the parent component's state","Automatic prop forwarding to nested components"],c:0,e:"<code>&lt;Card&gt;&lt;h3&gt;Title&lt;/h3&gt;&lt;/Card&gt;</code> lets <code>Card</code> provide structure and styling without knowing its contents. It's also the cleanest fix for prop drilling — pass the rendered subtree down rather than the data it needs."},
{s:"react-qa-notes",l:"mid",t:"frontend",q:"Why does the notes' answer still use a class component for error boundaries?",o:["Hooks have no equivalent to <code>getDerivedStateFromError</code> / <code>componentDidCatch</code>","Class components render faster in error states","Function components can't hold state during an error","Error boundaries must be class-based to access refs"],c:0,e:"Boundaries remain the one genuine reason to reach for a class — or use <code>react-error-boundary</code>, which wraps that class for you. Otherwise function components win: no <code>this</code>, no constructor, and logic reuse through custom hooks."},
{s:"react-qa-notes",l:"mid",t:"frontend",q:"When closing a modal by clicking the overlay, what must the inner content do?",o:["Stop click propagation, so clicks inside don't bubble to the overlay handler","Register its own overlay handler","Use <code>preventDefault</code> on the overlay","Render into a separate portal from the overlay"],c:0,e:"The overlay's <code>onClick</code> sets <code>open</code> to false; without <code>e.stopPropagation()</code> on the modal body, any click inside bubbles up and closes it immediately. The two intended close paths are the button and the overlay itself."},
{s:"mixed-prep",l:"mid",t:"backend databases",q:"What is the cache-aside pattern?",o:["Check the cache first; on a miss, read the database, store the result, then return it","Write to the cache and database simultaneously on every request","Let the cache load data from the database automatically on a miss","Refresh the entire cache on a fixed schedule"],c:0,e:"The application owns the cache logic — hit returns immediately, miss falls through to the database and back-fills. Contrast with read-through (the cache fetches for you) and write-through / write-behind on the write path. Redis is the usual backing store."},
{s:"mixed-prep",l:"mid",t:"backend databases",q:"What distinguishes concurrency from parallelism?",o:["Concurrency interleaves tasks, possibly on one core; parallelism runs them simultaneously on multiple cores","Concurrency needs multiple cores; parallelism doesn't","They are synonyms in modern usage","Concurrency applies to I/O; parallelism applies only to networking"],c:0,e:"One chef alternating between two dishes is concurrency; two chefs cooking at once is parallelism. Node is concurrent by default via the event loop, and reaches actual parallelism only through <code>worker_threads</code> or <code>cluster</code>."},
{s:"mixed-prep",l:"startup",t:"backend databases",q:"Why can't <code>WHERE</code> filter on <code>COUNT(*)</code>?",o:["<code>WHERE</code> runs before grouping, so aggregates don't exist yet — that's what <code>HAVING</code> is for","<code>COUNT(*)</code> returns a string that <code>WHERE</code> can't compare","Aggregates are only valid in the <code>SELECT</code> list","<code>WHERE</code> can filter aggregates, but only with a subquery"],c:0,e:"Execution order is FROM → WHERE → GROUP BY → HAVING → SELECT. <code>WHERE Salary &gt; 50000</code> filters rows; <code>HAVING COUNT(*) &gt; 1</code> filters the groups that grouping produced."},
{s:"mixed-prep",l:"mid",t:"backend databases",q:"Which Postgres JSON type supports GIN indexing?",o:["<code>JSONB</code> — the binary format","<code>JSON</code> — it preserves the original text","Both, identically","Neither; you must extract to a generated column first"],c:0,e:"<code>JSON</code> stores the text verbatim including whitespace and key order — fine for archival, slow to query. <code>JSONB</code> parses to a binary form: faster containment and path queries, and it's the one you can index with GIN. Default to JSONB."},
{s:"mixed-prep",l:"startup",t:"backend databases",q:"What is the clearest one-line distinction between React and Next.js?",o:["React is a UI library; Next.js is a React framework adding routing, SSR/SSG/ISR and full-stack features","Next.js is a newer version of React","React handles the client and Next.js handles the server, and both are required","Next.js replaces React's rendering engine"],c:0,e:"React gives you components and leaves routing, rendering strategy and data fetching to you. Next.js supplies file-based routing, four rendering modes, API routes and image/font optimisation — and better SEO, since the HTML arrives rendered."},
{s:"mixed-prep",l:"mid",t:"backend databases",q:"Which runtime executes Next.js server-side rendering?",o:["Node.js — or the Edge Runtime for routes configured to use it","The browser's JavaScript engine","Deno, since Next 13","A Rust-based runtime bundled with the framework"],c:0,e:"The Node server executes your React component, fetches any data, converts the tree to HTML and ships it; React then hydrates in the browser to attach handlers. Individual routes can opt into the Edge Runtime, which is a restricted V8 environment closer to the user."},
{s:"mixed-prep",l:"mid",t:"backend databases",q:"In the bank-transfer example, what guarantees both UPDATE statements apply or neither does?",o:["Wrapping them in a transaction — atomicity","Running them inside a stored procedure","Adding a foreign key between the accounts","Setting the isolation level to SERIALIZABLE"],c:0,e:"<code>BEGIN</code>, both updates, then <code>COMMIT</code> — a crash between them rolls back rather than destroying ₹1000. That's the A in ACID; C is constraint validity, I is isolation between concurrent transactions, D is durability once committed. Isolation level is a separate concern from atomicity."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"Which queue drains before the microtask queue in Node?",o:["The <code>process.nextTick</code> queue","The timers queue","The check (<code>setImmediate</code>) queue","The poll queue"],c:0,e:"Priority order: <code>process.nextTick</code> → microtasks (<code>Promise.then</code>, <code>queueMicrotask</code>) → then the loop advances through Timers → Pending → Idle/Prepare → Poll → Check → Close. Both <code>nextTick</code> and microtasks drain between <b>every</b> phase, which is why recursive <code>nextTick</code> can starve I/O entirely."},
{s:"wobot-prep",l:"mid",t:"backend databases",q:"Why is Fastify roughly 2–3× faster than Express?",o:["Schema-based validation, fast-json-stringify serialisation and a lighter router","It runs handlers on worker threads by default","It skips the middleware pipeline entirely","It compiles routes to native code via V8 intrinsics"],c:0,e:"Both use an ordered middleware pipeline sharing one <code>req</code>/<code>res</code>; Express advances via <code>next()</code>, Fastify via returning from hooks. The speed comes from pre-compiling JSON serialisation from a schema and a radix-tree router — not from a different concurrency model."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"Why does opening a Postgres connection per request fail at scale?",o:["Each connection is a full OS process (~10MB) and <code>max_connections</code> defaults to 100","Postgres serialises queries across connections","TCP handshake latency dominates query time","Connections leak file descriptors that are never released"],c:0,e:"At ~100 concurrent requests you hit <code>too many connections</code>. A pool keeps a small set open and multiplexes them. Remember the fleet-level constraint too: <code>pool.max</code> × pod_count must stay under <code>max_connections</code>, and beyond ~5 pods you want PgBouncer in front."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"In <code>EXPLAIN ANALYZE</code> output, which node type signals trouble on a large table?",o:["Seq Scan","Index Scan","Bitmap Heap Scan","Index Only Scan"],c:0,e:"Read plans bottom-up, inside-out. A sequential scan on a 100M-row table means no usable index. Bitmap Heap Scan is healthy when an index matches many rows. Also compare the planner's <code>rows</code> estimate against <code>actual</code> — a large gap means stale statistics, so run <code>ANALYZE</code>."},
{s:"wobot-prep",l:"mid",t:"backend databases",q:"Which TypeScript utility type fits a PATCH/update DTO?",o:["<code>Partial&lt;T&gt;</code>","<code>Required&lt;T&gt;</code>","<code>Readonly&lt;T&gt;</code>","<code>Record&lt;K, T&gt;</code>"],c:0,e:"PATCH sends only changed fields, so every property must be optional. <code>Required&lt;T&gt;</code> is the inverse and is useful right after runtime validation has proven everything present. <code>Pick</code>/<code>Omit</code> shape subsets, <code>Record</code> builds keyed maps."},
{s:"wobot-prep",l:"mid",t:"backend databases",q:"Why is Zod needed when the code is already TypeScript?",o:["TypeScript types vanish at compile time — only runtime validation catches a bad request body","Zod generates faster JSON parsing than <code>JSON.parse</code>","TypeScript cannot express nested object shapes","Zod replaces the need for a database schema"],c:0,e:"A client sending <code>{age: \"thirty\"}</code> sails past the compiler, and <code>user.age + 1</code> silently produces <code>\"thirty1\"</code>. Zod validates at runtime and infers the TS type from the same schema — one source of truth for both, applied at every API boundary."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"When is raw <code>pg</code> the better choice over Prisma?",o:["Complex analytical joins and window functions where you need full SQL control","Any CRUD endpoint, since Prisma adds latency","Whenever the schema changes frequently","When you need type-safe query results"],c:0,e:"Match abstraction to workload rather than picking a favourite. Prisma: type-safe queries and built-in migrations, weaker on complex joins (with <code>$queryRaw</code> as the escape hatch). TypeORM: ActiveRecord/DataMapper and decorators that fit NestJS, with looser type inference. Raw <code>pg</code>: full control, no safety net."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"Which combination suits an append-mostly camera-events table past 500M rows?",o:["Range-partition by month plus a BRIN index on <code>created_at</code>","A single table with a B-tree index on <code>created_at</code>","Hash-partition by <code>camera_id</code> with a GIN index","A materialised view refreshed hourly"],c:0,e:"Partitioning lets queries prune to one partition and makes dropping an old month an O(1) <code>DETACH</code> instead of a massive <code>DELETE</code>. BRIN is tiny and ideal when physical order tracks time. A lone B-tree on a table that size bloats, and VACUUM falls behind."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"What is backpressure in a Node stream pipeline?",o:["A slow consumer signalling a fast producer to pause so buffers don't grow unbounded","The queueing of errors until the stream closes","Retry logic when a write fails","The reordering of chunks to match consumer speed"],c:0,e:"A 100MB/s camera feed writing into a 30MB/s S3 upload will exhaust memory and OOM without it. <code>highWaterMark</code> sets the buffer threshold, and <code>pipeline()</code> honours backpressure plus propagates errors — which raw <code>.pipe()</code> does not."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"In refresh-token rotation, what does presenting the same refresh token twice mean?",o:["Compromise — invalidate the entire token family","Normal behaviour on a flaky network; reissue silently","The token simply expired","The clock is skewed between client and server"],c:0,e:"Each refresh issues a new token and retires the old one, so a legitimate client never replays. A replay means two parties hold the token and you can't tell which is the attacker — so you revoke the whole family and force re-login. Access tokens live ~15 minutes, refresh tokens ~7 days."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"Why enqueue CV inference to BullMQ instead of running it in the HTTP handler?",o:["CPU-heavy work blocks the event loop — return 202 Accepted and let workers process off the hot path","BullMQ runs the inference faster than a direct call","It avoids needing a Redis instance","Queues guarantee exactly-once execution"],c:0,e:"One blocking inference stalls every other request on that process. The pattern: camera POSTs an event, the API enqueues to Redis and returns 202 immediately, workers consume independently and scale separately. Queues give at-least-once delivery — design handlers to be idempotent."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"Which multi-tenancy pattern is cheapest but carries noisy-neighbour risk?",o:["Shared database with a <code>tenant_id</code> column and row-level security","Schema per tenant","Database per tenant","A separate cluster per tenant"],c:0,e:"Shared tables are cheapest to operate and make cross-tenant analytics trivial, but one bad query degrades everyone and isolation depends entirely on RLS being right. Schema-per-tenant is the middle ground; database-per-tenant gives the strongest isolation at the highest operational cost."},
{s:"wobot-prep",l:"startup",t:"backend databases",q:"What are the two defining characteristics of Node.js?",o:["A single-threaded event loop and non-blocking I/O","Multi-threaded request handling and blocking I/O","A compiled runtime with static typing","Built-in horizontal scaling across machines"],c:0,e:"Node is a JavaScript runtime on Chrome's V8 that runs JS outside the browser. One JS thread services many concurrent connections through callbacks rather than the thread-per-request model, and I/O is delegated so it never blocks that thread."},
{s:"wobot-prep",l:"mid",t:"backend databases",q:"What is a key difference between CommonJS and ES Modules in Node?",o:["<code>require</code> is synchronous and dynamic; <code>import</code> is statically analysed and hoisted","CommonJS supports top-level <code>await</code>; ESM does not","ESM cannot import npm packages","CommonJS is faster because it skips parsing"],c:0,e:"Static analysis is what enables tree-shaking. Practical traps: ESM needs <code>\"type\": \"module\"</code> or an <code>.mjs</code> extension, has no <code>__dirname</code> or <code>require</code>, needs file extensions in relative imports — but does support top-level <code>await</code>, which CommonJS doesn't."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"At the top level of a script, what is the order of <code>setTimeout(fn,0)</code> versus <code>setImmediate</code>?",o:["Non-deterministic — it depends on how long the process took to start","<code>setImmediate</code> always fires first","<code>setTimeout</code> always fires first","They fire simultaneously in the same tick"],c:0,e:"Whether the first loop iteration has already passed the 1ms timer threshold decides it, and that varies with startup timing. <b>Inside an I/O callback</b> the order is deterministic: <code>setImmediate</code> (Check phase) fires before <code>setTimeout</code>, because Check comes right after Poll."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"You need to scale an HTTP server across all CPU cores. Which tool?",o:["<code>cluster</code> — N processes sharing one port, load-balanced by the OS","<code>worker_threads</code> — threads sharing memory","<code>child_process.exec</code> — spawn a shell per request","<code>Promise.all</code> over the request handlers"],c:0,e:"<code>cluster</code> (or PM2 in cluster mode) forks one process per core, all sharing the listening socket — that scales I/O concurrency. <code>worker_threads</code> is for CPU-bound work inside a process, and <code>child_process</code> is for invoking external binaries like ffmpeg."},
{s:"wobot-prep",l:"mid",t:"backend databases",q:"Why does <code>app.use((req, res, next) =&gt; { console.error(err); })</code> fail as an error handler?",o:["With three parameters Express treats it as normal middleware, so <code>err</code> is undefined","<code>console.error</code> cannot serialise Error objects","It must be registered before the routes","Error handlers must be async functions"],c:0,e:"Express dispatches on arity — four parameters <code>(err, req, res, next)</code> marks it as error middleware. It must also be registered <b>last</b>, after all routes, or errors from later routes never reach it."},
{s:"wobot-prep",l:"mid",t:"backend databases",q:"Which request triggers a CORS preflight?",o:["A non-simple request — custom headers, or methods like PUT/DELETE/PATCH","Every cross-origin request without exception","Only requests carrying cookies","Only requests larger than 1KB"],c:0,e:"Simple GET/POST with standard headers go straight through. Anything else sends an <code>OPTIONS</code> preflight first, and the browser caches the result per request signature via <code>Access-Control-Max-Age</code>. CORS is a browser policy the server opts into with headers — it is not a Node feature and provides no server-side protection."},
{s:"wobot-prep",l:"mid",t:"backend databases",q:"To time a request in Express middleware, where do you record the end?",o:["In a <code>res.on('finish')</code> handler","Immediately after calling <code>next()</code>","In a <code>setTimeout</code> after the handler","In the error middleware"],c:0,e:"<code>next()</code> returns synchronously long before the response is actually written, so measuring around it captures nothing. The <code>finish</code> event on the response fires when the last byte is flushed — the correct hook for logging method, path, status and duration."},
{s:"wobot-prep",l:"mid",t:"backend databases",q:"When should you choose a Stream over a Buffer?",o:["When the data may not fit comfortably in memory — Buffers hold everything at once","When you need random access to bytes","When the data is text rather than binary","When the payload is under 1KB"],c:0,e:"A String is UTF-16 text; a Buffer is raw bytes fully resident in memory; a Stream processes chunks with bounded memory. Reading a 4GB video into a Buffer OOMs the process — stream it. Buffers are right for small binary payloads where you need indexing or hex/base64 conversion."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"Since Node 15, what happens on an unhandled promise rejection?",o:["The process crashes by default","A warning is logged and execution continues","The rejection is retried automatically","It is converted into an <code>uncaughtException</code>"],c:0,e:"<code>unhandledRejection</code> is now fatal, matching <code>uncaughtException</code>. The classic bug is an <code>async</code> polling loop with no <code>try/catch</code> — one failed call takes down the whole server. Handlers for both signals should log and exit gracefully, not resume: state after an escaped error is untrustworthy."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"Why does an in-memory rate limiter fail across multiple pods?",o:["Each pod counts independently, so the effective limit multiplies by the pod count","In-memory maps have no expiry mechanism","Kubernetes clears process memory between requests","The limiter cannot read the client IP behind a load balancer"],c:0,e:"Three pods each allowing 5 requests means an attacker gets 15. Shared state in Redis is the fix, and the check-and-increment must be atomic — a Lua script — or interleaved reads let pods see stale counts and overshoot anyway."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"What causes the Prisma connection-pool-exhaustion bug in development?",o:["Hot reload constructs a new PrismaClient on every save, each with its own pool","Prisma leaks a connection on every failed query","The default pool size is set too low for local work","Migrations hold connections open after completing"],c:0,e:"Twenty saves can orphan hundreds of connections until Postgres refuses new ones — and <code>next dev</code> has the same behaviour. Stash the client on <code>globalThis</code> in non-production so reloads reuse one instance, and append <code>?pgbouncer=true</code> when running behind PgBouncer."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"Why does PgBouncer's transaction mode break prepared statements?",o:["A client holds a server connection only for the duration of a transaction, so session state doesn't persist","Transaction mode disables the extended query protocol","Prepared statements require superuser privileges through a pooler","It rewrites queries, invalidating the statement cache"],c:0,e:"Session mode keeps one server connection per client until disconnect — everything works, but it barely improves on connecting directly. Transaction mode returns the connection after each transaction, giving far better multiplexing at the cost of <code>SET</code>, prepared statements and other session state. That's why Prisma needs <code>?pgbouncer=true</code>."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"What does Postgres write to before modifying data files?",o:["The Write-Ahead Log (WAL)","The system catalog","A temporary staging table","The replication slot buffer"],c:0,e:"Postgres <code>fsync</code>s the WAL before acknowledging <code>COMMIT</code> — that's the D in ACID. Streaming replication ships WAL to replicas continuously, and PITR replays archived WAL from a base backup up to a chosen point in time. All three concepts hang off the same log."},
{s:"wobot-prep",l:"mid",t:"backend databases",q:"What does the <code>satisfies</code> operator give you that a type annotation does not?",o:["It validates against the type while preserving the literal inferred type","It performs a runtime type check","It suppresses type errors like an assertion does","It makes the value deeply readonly"],c:0,e:"An annotation (<code>const routes: Record&lt;string, Route&gt;</code>) validates but widens, so you lose the specific keys. An assertion (<code>as</code>) bypasses checking entirely. <code>satisfies</code> is the middle ground — full validation, literal types retained. Interviewers use it to gauge whether you're current with TypeScript."},
{s:"wobot-prep",l:"mnc",t:"backend databases",q:"How do you make <code>req.user</code> typed after auth middleware sets it?",o:["Module augmentation — declare a merging interface for Express's Request","Cast to <code>any</code> at each usage site","Define a local <code>AuthedRequest</code> type and cast in every handler","Add <code>user</code> to <code>tsconfig.json</code> globals"],c:0,e:"Two interfaces with the same name merge, so re-declaring <code>Express.Request</code> in a <code>.d.ts</code> adds <code>user</code> everywhere without a cast. Declaration merging is exactly the capability interfaces have and type aliases don't."},
{s:"seo",l:"startup",t:"frontend",q:"Why does a pure client-side-rendered SPA struggle with SEO?",o:["The initial HTML is an empty shell — content only exists after JS executes, which crawlers may defer or skip","Search engines refuse to index any page that uses JavaScript","SPAs cannot serve a <code>&lt;title&gt;</code> tag","Single-page apps are penalised by ranking algorithms"],c:0,e:"Googlebot does render JS, but in a deferred second pass with a limited budget — and many other crawlers (social scrapers, Bing historically, LLM bots) don't render at all. Server-rendered HTML means the content is in the first response. This is precisely the gap Next.js closes for React."},
{s:"seo",l:"mid",t:"frontend",q:"You need a marketing page that ranks well and updates a few times a day. Which strategy?",o:["ISR — static HTML served from the CDN, regenerated in the background","SSR on every request, for maximum freshness","CSR with a loading skeleton","SSG with a redeploy triggered on every content edit"],c:0,e:"Crawlers get instant CDN-cached HTML, and <code>revalidate</code> keeps it current without a rebuild. SSR adds TTFB on every crawl for content that barely changes; CSR hides the content behind JS. SSG is right only when content changes at deploy cadence."},
{s:"seo",l:"mid",t:"frontend",q:"In the Next.js App Router, what generates per-page SEO metadata?",o:["Exporting <code>metadata</code> or an async <code>generateMetadata()</code> from the route","Rendering <code>&lt;Head&gt;</code> from <code>next/head</code> inside the component","Setting <code>document.title</code> in a <code>useEffect</code>","A <code>meta.json</code> file beside the route"],c:0,e:"<code>generateMetadata()</code> runs on the server and can <code>await</code> data, so a product page derives its title and description from the record itself. <code>next/head</code> is the Pages Router API; setting <code>document.title</code> client-side happens too late for a non-rendering crawler."},
{s:"seo",l:"startup",t:"frontend",q:"What is the relationship between the <code>&lt;title&gt;</code> tag and the <code>&lt;h1&gt;</code>?",o:["<code>&lt;title&gt;</code> is the SERP and tab label; <code>&lt;h1&gt;</code> is the on-page heading — related but written for different contexts","They must be byte-identical or search engines flag a mismatch","<code>&lt;h1&gt;</code> replaces <code>&lt;title&gt;</code> when both are present","<code>&lt;title&gt;</code> is deprecated in HTML5 in favour of <code>&lt;h1&gt;</code>"],c:0,e:"The title competes for a click in a results list and benefits from brand and qualifiers; the <code>&lt;h1&gt;</code> confirms the topic to a reader who has already arrived. Google frequently rewrites titles anyway. One <code>&lt;h1&gt;</code> per page, with <code>&lt;h2&gt;</code>/<code>&lt;h3&gt;</code> nesting in order."},
{s:"seo",l:"mid",t:"frontend",q:"Is the meta description a ranking factor?",o:["No — it doesn't affect ranking directly, but it drives click-through from the results page","Yes, it is one of the strongest on-page signals","Yes, but only for pages under 500 words","No, and search engines ignore it entirely"],c:0,e:"Google has stated it isn't used for ranking, and it often rewrites the snippet from page content anyway. It still matters: a well-written description wins clicks, and CTR influences how a result performs over time. Aim for roughly 150–160 characters."},
{s:"seo",l:"mnc",t:"frontend backend",q:"Two URLs serve the same product page. What tells search engines which to index?",o:["A <code>&lt;link rel=\"canonical\"&gt;</code> on both, pointing at the preferred URL","A <code>noindex</code> tag on the duplicate","Blocking the duplicate in <code>robots.txt</code>","A 302 redirect from the duplicate to the original"],c:0,e:"Canonical consolidates ranking signals onto one URL while both stay reachable — important when tracking parameters or filter combinations generate variants. <code>noindex</code> removes the page entirely rather than consolidating, and a <code>robots.txt</code> block prevents the crawler from ever seeing your directive."},
{s:"seo",l:"mnc",t:"frontend backend",q:"A page is blocked in <code>robots.txt</code> and also carries a <code>noindex</code> meta tag. What happens?",o:["It may still appear in results — the crawler can't fetch the page, so it never sees the <code>noindex</code>","It is guaranteed removed from the index, since two signals reinforce each other","The <code>robots.txt</code> rule is ignored when a meta tag is present","The page returns a 403 to all crawlers"],c:0,e:"This is the classic technical-SEO trap. <code>robots.txt</code> controls <b>crawling</b>; <code>noindex</code> controls <b>indexing</b> — and it only works if the page is crawlable. To de-index reliably, allow crawling and serve <code>noindex</code> (meta tag or <code>X-Robots-Tag</code> header)."},
{s:"seo",l:"mid",t:"frontend backend",q:"What is the purpose of <code>sitemap.xml</code>?",o:["It helps crawlers discover URLs and signals when each was last modified","It forces search engines to index every listed URL","It replaces internal linking as a discovery mechanism","It boosts the ranking of the URLs it contains"],c:0,e:"A sitemap is a discovery aid, not a guarantee — inclusion doesn't compel indexing. It matters most for large sites, weakly-linked pages, and fresh content. Next.js generates one from <code>app/sitemap.ts</code>. Solid internal linking still does most of the discovery work."},
{s:"seo",l:"mnc",t:"frontend",q:"What does JSON-LD structured data actually earn you?",o:["Eligibility for rich results — star ratings, FAQ accordions, breadcrumbs in the SERP","A direct ranking boost proportional to the number of schema types","Faster crawl frequency for the page","Automatic translation of the page into other languages"],c:0,e:"Schema.org markup in a <code>&lt;script type=\"application/ld+json\"&gt;</code> block describes entities (Product, Article, FAQPage, BreadcrumbList) so the engine can render an enhanced result. Rich results lift CTR substantially, but eligibility isn't a guarantee — and marking up content not visible on the page is a manual-action risk."},
{s:"seo",l:"mid",t:"frontend",q:"What do Open Graph tags control?",o:["How the link previews when shared on social platforms — not search ranking","The page's position in image search results","Which content search engines index first","Whether the page is eligible for rich results"],c:0,e:"<code>og:title</code>, <code>og:description</code>, <code>og:image</code> drive the card on LinkedIn, Slack, WhatsApp and the rest; Twitter reads <code>twitter:card</code> as well. Purely a social-sharing concern — orthogonal to ranking, but the first thing anyone notices when your link gets shared."},
{s:"seo",l:"mid",t:"frontend",q:"Which Core Web Vitals metric measures visual stability?",o:["CLS — Cumulative Layout Shift, target &lt; 0.1","LCP — Largest Contentful Paint, target &lt; 2.5s","INP — Interaction to Next Paint, target &lt; 200ms","TTFB — Time to First Byte, target &lt; 800ms"],c:0,e:"Core Web Vitals are a confirmed ranking signal, though a modest one — they're a tiebreaker between comparable pages, not a substitute for relevance. LCP covers loading, INP responsiveness, CLS stability. Measure with field data (CrUX) rather than lab scores alone."},
{s:"seo",l:"mid",t:"frontend",q:"Which change most directly improves LCP on a hero image?",o:["Preload it and mark it <code>priority</code> / <code>fetchpriority=\"high\"</code> instead of lazy-loading","Add <code>loading=\"lazy\"</code> so the rest of the page paints sooner","Convert it to a CSS background image","Move the <code>&lt;img&gt;</code> to the end of the document"],c:0,e:"Lazy-loading the LCP element is a common self-inflicted wound — it delays the very thing being measured. Use <code>&lt;Image priority&gt;</code> in Next.js, serve AVIF/WebP at correct dimensions, and lazy-load only below-the-fold media."},
{s:"seo",l:"startup",t:"frontend",q:"Why does semantic HTML help both SEO and accessibility?",o:["Elements like <code>&lt;article&gt;</code>, <code>&lt;nav&gt;</code> and <code>&lt;main&gt;</code> convey document structure that both crawlers and screen readers rely on","Semantic tags are ranked higher than <code>&lt;div&gt;</code> by search algorithms","They compress better, improving page speed","They automatically generate structured data"],c:0,e:"A wall of <code>&lt;div&gt;</code>s carries no meaning; <code>&lt;main&gt;</code>, <code>&lt;article&gt;</code> and a correct heading hierarchy tell any consumer what the primary content is. The same markup that lets a screen reader jump to the main region helps a crawler identify the substance of the page."},
{s:"seo",l:"startup",t:"frontend",q:"What should the <code>alt</code> attribute contain for a purely decorative image?",o:["An empty string, <code>alt=\"\"</code>, so assistive tech skips it","A keyword-rich description for image search","The filename","It should be omitted entirely"],c:0,e:"<code>alt=\"\"</code> marks the image as decorative and screen readers pass over it. <b>Omitting</b> <code>alt</code> is different — some readers then announce the filename. For meaningful images, describe the content plainly; keyword stuffing here is a spam signal, not an optimisation."},
{s:"seo",l:"mnc",t:"frontend backend",q:"A site serves English and Hindi versions of the same page. What prevents them competing?",o:["<code>hreflang</code> annotations linking the alternates, each self-referencing","A canonical tag from the Hindi page to the English one","Blocking the Hindi version in <code>robots.txt</code>","Serving both from the same URL based on <code>Accept-Language</code>"],c:0,e:"<code>hreflang</code> tells the engine these are localised equivalents, so each is served to the right audience rather than treated as duplicates. Canonicalising one to the other de-indexes a legitimate page. Language-switching on one URL via headers is a cloaking risk and prevents each version being indexed separately."},
{s:"seo",l:"mnc",t:"frontend",q:"An SPA uses <code>history.pushState</code> for navigation. What must each route still provide?",o:["A unique, server-resolvable URL that returns full HTML when requested directly","A hash fragment so the router can restore state","A <code>noindex</code> tag until the client hydrates","A redirect to the root, which then renders the view"],c:0,e:"A crawler will request <code>/products/42</code> cold, with no prior client state. If the server can't return that page's HTML, the route is effectively invisible. Old hash-based routing (<code>#/products</code>) is worse — everything after <code>#</code> is never sent to the server."},
{s:"seo",l:"mnc",t:"frontend",q:"Why is infinite scroll a crawlability risk?",o:["Content loaded on scroll may never be reached — crawlers don't scroll like users","Infinite scroll is explicitly penalised by search engines","It prevents the page from having a canonical URL","Lazy-loaded content is always treated as duplicate"],c:0,e:"The usual fix is a paginated fallback: real <code>&lt;a href&gt;</code> links to <code>?page=2</code> that render server-side, layered under the infinite-scroll experience. Same principle as any progressive enhancement — the crawler and the JS-less user get a working path through the content."},
{s:"seo",l:"mid",t:"frontend backend",q:"A page permanently moves to a new URL. Which redirect preserves ranking signals?",o:["301 Moved Permanently","302 Found","307 Temporary Redirect","A client-side <code>window.location</code> redirect"],c:0,e:"301 signals permanence and passes link equity to the destination, and engines eventually swap the indexed URL. 302/307 say the original will return, so signals stay with the old URL. A JS redirect only works if the crawler renders — slower and less reliable than an HTTP-level one."},
{s:"seo",l:"mnc",t:"frontend backend",q:"What is a soft 404 and why does it hurt?",o:["A missing page that returns HTTP 200 with \"not found\" content — crawl budget is wasted and the empty page may get indexed","A 404 page styled to match the site design","A 404 served from the CDN edge rather than the origin","A 404 that redirects to the homepage after a delay"],c:0,e:"SPAs cause this constantly: the router renders a NotFound component while the server happily returns 200. Return a real 404 (or 410 if permanently gone) status. Blanket-redirecting every unknown URL to the homepage is the other common anti-pattern — it also reads as a soft 404."},
{s:"seo",l:"mid",t:"frontend",q:"What does mobile-first indexing mean in practice?",o:["Google indexes the mobile rendering of your page, so content hidden on mobile may not be indexed","Mobile pages rank above desktop pages for all queries","You need a separate m.example.com domain","Desktop styles are ignored by the crawler"],c:0,e:"The mobile rendering is the canonical one for indexing. If a responsive breakpoint drops content, collapses text behind an interaction that never renders, or serves smaller structured data, that's what gets indexed. Content parity between breakpoints is the requirement."},
{s:"seo",l:"mid",t:"frontend",q:"What makes internal link anchor text valuable?",o:["It describes the destination, giving crawlers and users context about the linked page","It increases the number of links, which raises PageRank","It is the only signal used to determine a page's topic","Generic anchors like \"click here\" rank better because they are common"],c:0,e:"\"Read our loan underwriting guide\" tells both a crawler and a screen-reader user what they'll get; \"click here\" tells neither. Internal linking also shapes discovery and distributes authority — orphaned pages with no inbound internal links are the ones that quietly never get indexed."},
{s:"seo",l:"mnc",t:"frontend",q:"Why does Astro's island architecture suit content-heavy marketing pages?",o:["It ships zero JS by default and hydrates only interactive widgets, so crawlers get complete HTML fast","It pre-renders pages inside the search engine's cache","It automatically generates hreflang and canonical tags","It converts React components into static images"],c:0,e:"Exactly the reasoning behind the TimeMoney split — Astro for marketing (islands, minimal JS, strong Core Web Vitals), Svelte for the parent site, Next.js for the stateful auth app. Less JS means faster LCP and INP, and the content is in the HTML rather than behind a bundle."},
{s:"seo",l:"mnc",t:"frontend backend",q:"What is crawl budget and when does it actually matter?",o:["The number of URLs a crawler will fetch in a period — a real constraint on large sites with many low-value URLs","A paid quota you purchase through Search Console","The maximum page size a crawler will download","A per-domain limit on indexed pages"],c:0,e:"Irrelevant for a 50-page site; serious for e-commerce with faceted navigation generating millions of filter permutations. Manage it by blocking low-value parameter URLs, fixing redirect chains, removing soft 404s, and keeping sitemaps accurate — so crawl effort lands on pages that matter."},
{s:"seo",l:"mid",t:"frontend backend",q:"Which URL structure is best for both users and search?",o:["<code>/loans/home-loan-eligibility</code> — readable, hyphenated, hierarchical","<code>/p?id=8823&amp;cat=17</code> — compact and stable","<code>/loans/home_loan_eligibility</code> — underscores separate words","<code>/Loans/HomeLoanEligibility</code> — capitalised for readability"],c:0,e:"Hyphens are treated as word separators; underscores historically are not. Lowercase avoids duplicate-URL issues on case-sensitive servers, and a readable path survives being pasted into a message. Opaque query-string IDs work but forfeit the keyword and usability signal."},
{s:"seo",l:"mnc",t:"frontend",q:"Which resource hint reduces connection latency for a known third-party origin?",o:["<code>&lt;link rel=\"preconnect\"&gt;</code> — performs DNS, TCP and TLS ahead of the request","<code>&lt;link rel=\"prefetch\"&gt;</code> — downloads the resource at high priority","<code>&lt;link rel=\"preload\"&gt;</code> — resolves DNS for future navigations","<code>&lt;link rel=\"dns-prefetch\"&gt;</code> — completes the full TLS handshake"],c:0,e:"<code>preconnect</code> warms the whole connection — worth it for a font or API host on the critical path. <code>dns-prefetch</code> only resolves DNS (a cheaper, weaker hint). <code>preload</code> fetches a known critical resource early; <code>prefetch</code> grabs something at low priority for a likely <i>next</i> navigation."},
{s:"seo",l:"startup",t:"frontend",q:"Where should the most important content sit relative to the fold?",o:["Above the fold and present in the initial HTML — not gated behind an interaction or a client fetch","Below the fold, so the hero image loads first","In a modal triggered on page load","Duplicated in a hidden div for the crawler only"],c:0,e:"Content requiring a click, a scroll-triggered fetch, or a hydration pass is content a crawler may never see. And serving hidden text purely for crawlers is cloaking — a manual-action risk. The rule holds for users too: don't make people work to reach the substance."},
];

  "cheatsheet-fe":"0.1 🎨 Frontend Cheat Sheet","cheatsheet-be":"0.2 ⚙️ Backend Cheat Sheet",
  "cheatsheet-db":"0.3 🗄️ Databases Cheat Sheet","cheatsheet-infra":"0.4 ☁️ Infra Cheat Sheet",
  "cheatsheet-nt":"0.5 💬 Non-Tech Cheat Sheet","cheatsheet-univ":"0.6 🌐 Universal Cheat Sheet",
  "intro":"1. Intro & Behavioral","javascript":"2. JavaScript / TypeScript","react":"3. React / Next.js",
  "node":"4. Node.js / NestJS / Express","db":"5. Databases (Mongo / Postgres)","auth":"6. Auth, Security & JWT",
  "aws":"7. AWS & Cloud","realtime":"8. Real-time (SSE / Socket.io)","ai":"9. AI / LLM Integration",
  "perf":"10. Performance & Optimization","system":"11. System Design (MNC)","projects":"12. Project Deep-Dives",
  "hr":"13. HR / Salary / Closing","cs":"14. CS Fundamentals","html":"15. HTML / CSS / Browser",
  "testing":"16. Testing, Git & DevOps","dsa":"17. DSA Patterns & Coding",
  "india-service":"18. 🇮🇳 Indian Service IT","india-product":"19. 🇮🇳 Indian Startups — Tough",
  "practice":"22. 💻 JS Practice","jwt-notes":"23. 🔐 JWT Deep-Dive","mongo-notes":"24. 🍃 MongoDB Notes",
  "git-notes":"25. 🐙 Git & GitHub","js-react-notes":"26. ⚛️ JS + React Notes",
  "react-qa-notes":"27. 🎯 React.js Q&A","mixed-prep":"28. 🔀 Mixed Prep",
  "wobot-prep":"29. 🎥 Wobot AI Prep","seo":"31. 🔍 SEO Optimization"
};
const LEVEL_LABEL = { startup:"Startup", mid:"Mid", mnc:"MNC", india:"🇮🇳 India" };
const STORE_KEY = "rajat_mcq_progress_v1";

// Source data always lists the correct option first. Shuffle per question with a
// seed derived from the index, so the order is stable across renders AND across
// sessions — stored answers in sessionStorage stay valid.
function seededShuffle(n, seed) {
  const a = Array.from({ length: n }, (_, i) => i);
  let s = (seed * 2654435761) % 4294967296;
  const rnd = () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
  for (let i = n - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
QUESTIONS.forEach((q, i) => {
  q.id = i;
  const ord = seededShuffle(q.o.length, i + 1);
  q.o = ord.map(k => q.o[k]);
  q.c = ord.indexOf(q.c);
});

let state = { answers:{}, order:null };
try {
  const raw = sessionStorage.getItem(STORE_KEY);
  if (raw) { const p = JSON.parse(raw); if (p && typeof p === "object" && p.answers) state.answers = p.answers; }
} catch (e) { /* storage blocked (some in-app browsers) — fall back to in-memory */ }

function persist() {
  try { sessionStorage.setItem(STORE_KEY, JSON.stringify({ answers: state.answers })); } catch (e) {}
}

const activeLevels = new Set();
const activeTracks = new Set();
let secFilterVal = "all";
let onlyUnanswered = false;
let onlyWrong = false;
let currentSearch = "";

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
// Question/option/explanation text may contain intentional <code> tags authored here.
// Everything else is escaped first, then those tags are restored.
function rich(s) {
  return esc(s).replace(/&lt;code&gt;/g,"<code>").replace(/&lt;\/code&gt;/g,"</code>")
               .replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>")
               .replace(/&lt;br&gt;/g,"<br>");
}
function escapeRegex(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }
function hl(htmlStr, term) {
  if (!term) return htmlStr;
  return htmlStr.replace(new RegExp("(" + escapeRegex(term) + ")(?![^<]*>)", "gi"), "<mark>$1</mark>");
}

function visibleQuestions() {
  const src = state.order ? state.order.map(i => QUESTIONS[i]) : QUESTIONS;
  return src.filter(q => {
    if (activeLevels.size && !activeLevels.has(q.l)) return false;
    if (activeTracks.size) {
      const tracks = (q.t || "").split(/\s+/).filter(Boolean);
      if (!tracks.some(t => activeTracks.has(t))) return false;
    }
    if (secFilterVal !== "all" && q.s !== secFilterVal) return false;
    const rec = state.answers[q.id];
    if (onlyUnanswered && rec !== undefined) return false;
    if (onlyWrong && (rec === undefined || rec === q.c)) return false;
    if (currentSearch) {
      const hay = (q.q + " " + q.o.join(" ") + " " + q.e + " " + (SECTIONS[q.s] || "")).toLowerCase();
      if (!hay.includes(currentSearch)) return false;
    }
    return true;
  });
}

function cardHtml(q, idx) {
  const rec = state.answers[q.id];
  const done = rec !== undefined;
  const right = done && rec === q.c;
  const cls = done ? (right ? " answered-correct" : " answered-wrong") : "";
  let opts = "";
  for (let i = 0; i < q.o.length; i++) {
    let oc = "opt";
    if (done) {
      if (i === q.c) oc += " correct";
      else if (i === rec) oc += " wrong";
      else oc += " dimmed";
    }
    opts += '<button class="' + oc + '" data-q="' + q.id + '" data-o="' + i + '"' + (done ? " disabled" : "") + '>' +
            '<span class="key">' + "ABCD"[i] + "</span><span>" + hl(rich(q.o[i]), currentSearch) + "</span></button>";
  }
  const explain = done
    ? '<div class="explain"><span class="lead">' + (right ? "✓ Correct." : "✗ Answer: " + "ABCD"[q.c] + ".") + "</span>" +
      hl(rich(q.e), currentSearch) +
      '<span class="src">Source: ' + esc(SECTIONS[q.s] || q.s) + " · Rajat_Interview_Prep.html</span></div>"
    : "";
  return '<div class="q-card' + cls + '" id="qc-' + q.id + '">' +
    '<div class="q-meta">' +
      '<span class="badge ' + esc(q.l) + '">' + (LEVEL_LABEL[q.l] || q.l) + "</span>" +
      '<span class="badge sec">' + esc(SECTIONS[q.s] || q.s) + "</span>" +
      '<span class="q-num">#' + (idx + 1) + "</span>" +
    "</div>" +
    '<p class="q-text">' + hl(rich(q.q), currentSearch) + "</p>" +
    '<div class="opts">' + opts + "</div>" + explain + "</div>";
}

function render() {
  const list = visibleQuestions();
  document.getElementById("quizList").innerHTML = list.map(cardHtml).join("");
  document.getElementById("noResults").classList.toggle("visible", list.length === 0);
  document.getElementById("matchCount").textContent = list.length ? list.length + " Qs" : "";
  updateStats(list);
}

function updateStats(list) {
  const scope = list || visibleQuestions();
  let answered = 0, correct = 0;
  scope.forEach(q => {
    const rec = state.answers[q.id];
    if (rec !== undefined) { answered++; if (rec === q.c) correct++; }
  });
  const wrong = answered - correct;
  document.getElementById("statAnswered").textContent = answered;
  document.getElementById("statTotal").textContent = scope.length;
  document.getElementById("statCorrect").textContent = correct;
  document.getElementById("statWrong").textContent = wrong;
  document.getElementById("statPct").textContent = answered ? Math.round(correct / answered * 100) + "%" : "—";
  document.getElementById("progressFill").style.width = scope.length ? (answered / scope.length * 100) + "%" : "0%";
}

document.getElementById("quizList").addEventListener("click", e => {
  const btn = e.target.closest(".opt");
  if (!btn || btn.disabled) return;
  const qid = +btn.dataset.q, oi = +btn.dataset.o;
  if (state.answers[qid] !== undefined) return;
  state.answers[qid] = oi;
  persist();
  const q = QUESTIONS[qid];
  const card = document.getElementById("qc-" + qid);
  const idx = visibleQuestions().findIndex(x => x.id === qid);
  card.outerHTML = cardHtml(q, idx < 0 ? 0 : idx);
  updateStats();
});

function syncButtons() {
  document.querySelectorAll(".filter-btn[data-level]").forEach(b => {
    const v = b.dataset.level;
    b.classList.toggle("active", v === "all" ? activeLevels.size === 0 : activeLevels.has(v));
  });
  document.querySelectorAll(".filter-btn[data-track]").forEach(b => {
    const v = b.dataset.track;
    b.classList.toggle("active", v === "all" ? activeTracks.size === 0 : activeTracks.has(v));
  });
  document.getElementById("btnUnanswered").classList.toggle("active", onlyUnanswered);
  document.getElementById("btnWrong").classList.toggle("active", onlyWrong);
  document.getElementById("btnShuffle").classList.toggle("active", !!state.order);
}

document.querySelectorAll(".filter-btn[data-level]").forEach(b => b.addEventListener("click", () => {
  const v = b.dataset.level;
  if (v === "all") activeLevels.clear();
  else activeLevels.has(v) ? activeLevels.delete(v) : activeLevels.add(v);
  syncButtons(); render();
}));
document.querySelectorAll(".filter-btn[data-track]").forEach(b => b.addEventListener("click", () => {
  const v = b.dataset.track;
  if (v === "all") activeTracks.clear();
  else activeTracks.has(v) ? activeTracks.delete(v) : activeTracks.add(v);
  syncButtons(); render();
}));

const secSel = document.getElementById("secFilter");
const secCounts = {};
QUESTIONS.forEach(q => { secCounts[q.s] = (secCounts[q.s] || 0) + 1; });
secSel.innerHTML = '<option value="all">All sections (' + QUESTIONS.length + ")</option>" +
  Object.keys(SECTIONS).filter(k => secCounts[k])
    .map(k => '<option value="' + k + '">' + SECTIONS[k] + " (" + secCounts[k] + ")</option>").join("");
secSel.addEventListener("change", () => { secFilterVal = secSel.value; render(); });

document.getElementById("btnUnanswered").addEventListener("click", () => {
  onlyUnanswered = !onlyUnanswered; if (onlyUnanswered) onlyWrong = false; syncButtons(); render();
});
document.getElementById("btnWrong").addEventListener("click", () => {
  onlyWrong = !onlyWrong; if (onlyWrong) onlyUnanswered = false; syncButtons(); render();
});
document.getElementById("btnShuffle").addEventListener("click", () => {
  if (state.order) { state.order = null; }
  else {
    const a = QUESTIONS.map((_, i) => i);
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    state.order = a;
  }
  syncButtons(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
});
document.getElementById("btnReset").addEventListener("click", () => {
  if (!confirm("Clear all your answers and start over?")) return;
  state.answers = {}; persist();
  document.getElementById("resultsPanel").classList.remove("visible");
  render();
});

document.getElementById("btnResults").addEventListener("click", () => {
  const panel = document.getElementById("resultsPanel");
  if (panel.classList.contains("visible")) { panel.classList.remove("visible"); return; }
  const bySec = {};
  let answered = 0, correct = 0;
  QUESTIONS.forEach(q => {
    const rec = state.answers[q.id];
    if (rec === undefined) return;
    answered++;
    const ok = rec === q.c;
    if (ok) correct++;
    (bySec[q.s] = bySec[q.s] || { n:0, ok:0 });
    bySec[q.s].n++; if (ok) bySec[q.s].ok++;
  });
  const pct = answered ? Math.round(correct / answered * 100) : 0;
  const color = pct >= 80 ? "var(--green)" : pct >= 60 ? "var(--orange)" : "var(--red)";
  const rows = Object.keys(bySec).sort((a, b) => (bySec[a].ok / bySec[a].n) - (bySec[b].ok / bySec[b].n))
    .map(k => {
      const d = bySec[k], p = Math.round(d.ok / d.n * 100);
      const c = p >= 80 ? "var(--green)" : p >= 60 ? "var(--orange)" : "var(--red)";
      return '<div class="bd-row"><span class="bd-name">' + esc(SECTIONS[k] || k) + "</span>" +
             '<span class="bd-bar"><span style="width:' + p + "%;background:" + c + '"></span></span>' +
             '<span class="bd-score">' + d.ok + "/" + d.n + "</span></div>";
    }).join("");
  panel.innerHTML = "<h3>📊 Your results</h3>" +
    (answered === 0
      ? '<p style="color:var(--muted);margin:0">Nothing answered yet — pick an option on any question and your score builds here.</p>'
      : '<div class="score-big" style="color:' + color + '">' + pct + "%</div>" +
        '<p style="color:var(--muted);margin:0 0 14px 0;font-size:13px">' + correct + " correct out of " + answered +
        " answered · " + (QUESTIONS.length - answered) + " left</p>" +
        '<p style="font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px">Weakest sections first</p>' + rows);
  panel.classList.add("visible");
  panel.scrollIntoView({ behavior:"smooth", block:"nearest" });
});

const searchInput = document.getElementById("search");
let searchTimer = null;
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { currentSearch = searchInput.value.toLowerCase().trim(); render(); }, 120);
});

document.addEventListener("keydown", e => {
  const isMac = navigator.platform.toUpperCase().includes("MAC");
  if ((isMac ? e.metaKey : e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault(); searchInput.focus(); searchInput.select();
  }
  if (e.key === "Escape" && document.activeElement === searchInput) {
    searchInput.value = ""; currentSearch = ""; render();
  }
});

const hint = document.getElementById("kbdHint");
if (hint && !navigator.platform.toUpperCase().includes("MAC")) hint.textContent = "Ctrl+K";
document.getElementById("footNote").textContent =
  QUESTIONS.length + " multiple-choice questions · derived from Rajat_Interview_Prep.html · progress lasts for this tab session";

syncButtons();
render();
</script>
</body>
